steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-west4-docker.pkg.dev/property-agent-496300/cloud-run-source-deploy/aloepm-aloe-pm-assistant/aloe-pm-assistant-git:$COMMIT_SHA', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-west4-docker.pkg.dev/property-agent-496300/cloud-run-source-deploy/aloepm-aloe-pm-assistant/aloe-pm-assistant-git:$COMMIT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - run
  - deploy
  - aloe-pm-assistant-git
  - --image=us-west4-docker.pkg.dev/property-agent-496300/cloud-run-source-deploy/aloepm-aloe-pm-assistant/aloe-pm-assistant-git:$COMMIT_SHA
  - --region=us-west4
options:
  logging: CLOUD_LOGGING_ONLY
