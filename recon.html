<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe PM · Bank Reconciliation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8FAFC;--surface:#fff;--border:#E2E8F0;--border2:#CBD5E1;
  --teal:#0891B2;--teal-light:#E0F2FE;--teal-border:#7DD3FC;
  --green:#16A34A;--green-light:#DCFCE7;--green-border:#86EFAC;
  --red:#DC2626;--red-light:#FEE2E2;--red-border:#FCA5A5;
  --amber:#D97706;--amber-light:#FEF3C7;
  --text:#0F172A;--text2:#475569;--muted:#94A3B8;
  --header:#fff;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── TOP BAR ── */
.topbar{background:#0C1929;border-bottom:2px solid var(--teal);height:48px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
.topbar-title{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.1em;color:#94A3B8}
.topbar-title span{color:var(--teal)}
.topbar-right{margin-left:auto;display:flex;gap:8px}
.top-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:4px 12px;color:#CBD5E1;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.top-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.top-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.top-btn.primary:hover{background:#0e7490}
.top-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── CONFIG SCREEN ── */
.config-wrap{max-width:680px;margin:40px auto;padding:0 20px}
.config-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:16px}
.config-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:600;color:var(--text2);letter-spacing:.04em;text-transform:uppercase}
.field select,.field input{background:#F8FAFC;border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text);font-family:'DM Sans',sans-serif}
.field select:focus,.field input:focus{outline:1.5px solid var(--teal);border-color:var(--teal)}
.plaid-connected{background:var(--teal-light);border:1px solid var(--teal-border);border-radius:7px;padding:9px 12px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.plaid-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex-shrink:0}
.plaid-name{font-size:12px;font-weight:600;color:var(--teal)}
.plaid-bal{font-family:'DM Mono',monospace;font-size:11px;color:var(--teal);margin-left:auto}
.drop-zone{border:1.5px dashed var(--border2);border-radius:8px;padding:18px;text-align:center;cursor:pointer;transition:all .15s}
.drop-zone:hover,.drop-zone.over,.drop-zone.filled{border-color:var(--teal);background:var(--teal-light)}
.drop-zone .dz-icon{font-size:20px;margin-bottom:4px}
.drop-zone .dz-label{font-size:12px;font-weight:500;color:var(--text2)}
.drop-zone .dz-sub{font-size:10px;color:var(--muted);margin-top:2px}
.run-btn{width:100%;background:var(--teal);border:none;border-radius:7px;padding:12px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:14px;transition:background .12s}
.run-btn:hover{background:#0e7490}
.run-btn:disabled{background:var(--border2);color:var(--muted);cursor:not-allowed}
.err-box{background:var(--red-light);border:1px solid var(--red-border);border-radius:7px;padding:8px 14px;font-size:11px;color:var(--red);margin-bottom:12px}

/* ── RECON LAYOUT ── */
.recon-wrap{display:flex;flex-direction:column;height:calc(100vh - 48px);overflow:hidden}

/* ── RECON HEADER BAR ── */
.recon-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:16px;height:56px;flex-shrink:0}
.recon-title{font-size:15px;font-weight:600;color:var(--text)}
.recon-sub{font-size:11px;color:var(--muted)}
.header-field{display:flex;align-items:center;gap:6px}
.header-field label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.header-field input{background:#F8FAFC;border:1px solid var(--border2);border-radius:5px;padding:5px 9px;font-size:12px;font-family:'DM Mono',monospace;color:var(--text);width:130px}
.header-field input:focus{outline:1.5px solid var(--teal);border-color:var(--teal)}
.beg-bal{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap}

/* ── MAIN SPLIT: transactions left + summary right ── */
.recon-body{flex:1;display:grid;grid-template-columns:1fr 280px;overflow:hidden;min-height:0}
.txn-area{overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;min-height:0}
.summary-panel{border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;flex-shrink:0}

/* ── SECTION HEADERS ── */
.section-hdr{background:#F8FAFC;border-bottom:2px solid var(--border2);border-top:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;flex-shrink:0}
.section-hdr-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.section-total{margin-left:auto;font-family:'DM Mono',monospace;font-size:12px;font-weight:600}
.section-total.green{color:var(--green)}
.section-total.red{color:var(--red)}
.chk-all{width:16px;height:16px;cursor:pointer;accent-color:var(--teal)}

/* ── TABLE ── */
.txn-table{width:100%;border-collapse:collapse}
.txn-table th{background:#F1F5F9;padding:6px 10px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:36px;z-index:4}
.txn-table th.center{text-align:center}
.txn-table th.right{text-align:right}
.txn-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12px}
.txn-table tr.cleared td{background:#F0FDF4}
.txn-table tr.cleared:hover td{background:#DCFCE7}
.txn-table tr:not(.cleared):hover td{background:#F8FAFC}
.txn-table .chk-cell{width:36px;text-align:center}
.txn-table input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--teal)}
.mono{font-family:'DM Mono',monospace}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:9px;font-weight:600;white-space:nowrap}
.tag-deposit{background:#DBEAFE;color:#1D4ED8}
.tag-transfer{background:#F3E8FF;color:#7C3AED}
.tag-settlement{background:#FEF3C7;color:#92400E}
.tag-payout{background:#FEE2E2;color:#991B1B}
.tag-plaid{background:#E0F2FE;color:#0369A1}
.amt-in{color:var(--green);font-weight:600;font-family:'DM Mono',monospace}
.amt-out{color:var(--red);font-weight:500;font-family:'DM Mono',monospace}
.empty-msg{padding:32px;text-align:center;color:var(--muted);font-style:italic;font-size:12px}

/* ── SUMMARY PANEL ── */
.sum-block{padding:16px;border-bottom:1px solid var(--border)}
.sum-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sum-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:12px}
.sum-row .sk{color:var(--text2)}
.sum-row .sv{font-family:'DM Mono',monospace;font-weight:500}
.sum-divider{height:1px;background:var(--border);margin:8px 0}
.sum-total{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-top:4px}
.sum-total .st{color:var(--text)}
.sum-total .sv{font-family:'DM Mono',monospace}

.balance-block{padding:16px;border-bottom:1px solid var(--border)}
.balance-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.balance-amount{font-family:'DM Mono',monospace;font-size:22px;font-weight:600;line-height:1}
.balance-sub{font-size:10px;margin-top:4px}
.bal-green{color:var(--green)}
.bal-red{color:var(--red)}
.bal-ok{background:var(--green-light);border:1px solid var(--green-border)}
.bal-off{background:var(--red-light);border:1px solid var(--red-border)}
.diff-block{border-radius:7px;padding:10px 14px;margin:16px;display:flex;flex-direction:column;gap:4px}
.diff-block .dl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.diff-block .da{font-family:'DM Mono',monospace;font-size:20px;font-weight:600}
.diff-block .ds{font-size:10px;margin-top:2px}

/* ── LOADING ── */
.load-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.spinner{width:28px;height:28px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-msg{font-family:'DM Mono',monospace;font-size:11px;color:var(--teal)}
.load-steps{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.load-step{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.load-step.done{color:var(--green)}
.load-step.active{color:var(--teal);font-weight:500}
.load-step::before{content:'○';font-size:10px}
.load-step.done::before{content:'✓';color:var(--green)}
.load-step.active::before{content:'●';color:var(--teal)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
const S = {
  screen: 'config',   // config | loading | recon
  bankId: '129',
  startDate: '',
  endDate: '',
  stmtEndBal: '',
  bankFile: null, bankText: '',
  plaidAcct: null,    // { key, name, balance }
  error: '',
  loadSteps: [],      // [{label, status}]
  // Recon data
  txns: [],           // all transactions
  checked: new Set(), // cleared transaction IDs
  begBal: 0,
};
function set(p){ Object.assign(S, p); render(); }

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const fmt = n => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
function fmtDate(d){
  if(!d) return '';
  try{ const dt=new Date(d+'T12:00:00'); return `${dt.getMonth()+1}/${dt.getDate()}/${dt.getFullYear()}`; }
  catch(e){ return d; }
}
function esc(s){ return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── API FETCH ────────────────────────────────────────────────────────────────
async function apiFetch(path, params={}){
  const url = new URL('/api/rentvine'+path, location.origin);
  Object.entries(params).forEach(([k,v])=>{ if(v!==undefined&&v!==null) url.searchParams.set(k,v); });
  const r = await fetch(url.toString());
  if(!r.ok) throw new Error(`Rentvine ${path} → ${r.status}`);
  return r.json();
}

async function fetchAllPages(path, params={}){
  let page=1, all=[];
  while(page <= 20){
    const d = await apiFetch(path, {...params, page, pageSize:200});
    const rows = Array.isArray(d) ? d : (d?.data ?? []);
    if(!rows.length) break;
    all = all.concat(rows);
    if(rows.length < 200) break;
    page++;
  }
  return all;
}

// ─── DATE FILTER ──────────────────────────────────────────────────────────────
function inRange(dateStr){
  if(!dateStr) return false;
  const d = dateStr.slice(0,10);
  if(S.startDate && d < S.startDate) return false;
  if(S.endDate   && d > S.endDate)   return false;
  return true;
}

// ─── LOAD DATA ────────────────────────────────────────────────────────────────
function stepUpdate(label, status){
  const steps = S.loadSteps.map(s => s.label===label ? {...s,status} : s);
  set({loadSteps: steps});
}

async function loadData(){
  const steps = [
    {label:'Deposits',   status:'pending'},
    {label:'Transfers',  status:'pending'},
    {label:'Settlements',status:'pending'},
    {label:'Bank side',  status:'pending'},
  ];
  set({screen:'loading', loadSteps:steps, error:''});

  try{
    // Fetch Rentvine data
    stepUpdate('Deposits','active');
    const deps = await fetchAllPages('/accounting/deposits',{bankAccountID:S.bankId}).catch(()=>[]);
    stepUpdate('Deposits','done');

    stepUpdate('Transfers','active');
    const transfers = await fetchAllPages('/accounting/bank-transfers/search',{bankAccountID:S.bankId,isVoided:0}).catch(()=>[]);
    stepUpdate('Transfers','done');

    stepUpdate('Settlements','active');
    const settlements = await fetchAllPages('/accounting/settlements',{bankAccountID:S.bankId}).catch(()=>[]);
    stepUpdate('Settlements','done');

    // Build transaction list
    const txns = [];

    // Deposits
    deps.forEach(row=>{
      const dep = row.deposit || row;
      const date = (dep.dateDeposited||dep.depositDate||dep.dateTimeCreated||'').slice(0,10);
      if(!inRange(date)) return;
      txns.push({
        id: 'dep-'+dep.depositID,
        date,
        type: 'Deposit',
        tag: 'tag-deposit',
        reference: dep.depositNumber||dep.reference||'',
        description: dep.description || dep.memo || '',
        amount: Math.abs(parseFloat(dep.amount||0)),
        direction: 'in',
        source: 'rv',
      });
    });

    // Transfers
    transfers.forEach(row=>{
      const bt = row.bankTransfer || row;
      const date = (bt.datePosted||bt.dateTransferred||bt.dateTimeCreated||'').slice(0,10);
      if(!inRange(date)) return;
      const fromId = String(bt.sourceBankAccountID||'');
      const toId   = String(bt.destinationBankAccountID||'');
      const myId   = String(S.bankId);
      const dir = toId===myId ? 'in' : 'out';
      txns.push({
        id: 'xfr-'+bt.bankTransferID,
        date,
        type: 'Transfer',
        tag: 'tag-transfer',
        reference: bt.reference||bt.bankTransferNumber||'',
        description: bt.description||bt.memo||`Transfer ${dir==='in'?'from':'to'} account`,
        amount: Math.abs(parseFloat(bt.amount||0)),
        direction: dir,
        source: 'rv',
      });
    });

    // Settlements
    settlements.forEach(row=>{
      const s = row.settlement || row;
      const date = (s.settlementDate||s.datePosted||s.dateTimeCreated||'').slice(0,10);
      if(!inRange(date)) return;
      const raw = parseFloat(s.amount||0);
      const dir = raw >= 0 ? 'in' : 'out';
      txns.push({
        id: 'set-'+s.settlementID,
        date,
        type: dir==='out' ? 'Payout' : 'Settlement',
        tag: dir==='out' ? 'tag-payout' : 'tag-settlement',
        reference: s.reference||'--',
        description: s.description||s.memo||(dir==='out'?'ACH Payout':'ACH Settlement'),
        amount: Math.abs(raw),
        direction: dir,
        source: 'rv',
      });
    });

    // Bank side: Plaid or CSV
    stepUpdate('Bank side','active');
    let bankTxns = [];
    if(S.plaidAcct){
      try{
        const pr = await fetch(`/api/plaid/transactions?account_key=${S.plaidAcct.key}&start_date=${S.startDate}&end_date=${S.endDate}`);
        const pd = await pr.json();
        bankTxns = (pd.transactions||[]).map(t=>({
          id: 'plaid-'+t.transactionId,
          date: t.date,
          type: 'Bank',
          tag: 'tag-plaid',
          reference: t.transactionId.slice(-8),
          description: t.description,
          amount: t.amount,
          direction: t.direction,
          source: 'bank',
        }));
      }catch(e){}
    } else if(S.bankText){
      bankTxns = parseCSV(S.bankText).filter(t=>inRange(t.date));
    }
    stepUpdate('Bank side','done');

    // Merge — mark each transaction with which side(s) it appears on
    // For now show all Rentvine txns as the primary list (like Rentvine's UI)
    // Bank txns used for matching indicator
    const allTxns = txns.sort((a,b)=>a.date.localeCompare(b.date));

    // Beginning balance from Rentvine (we'll compute or default to 0)
    set({
      screen:'recon',
      txns: allTxns,
      checked: new Set(),
      begBal: 0,
      stmtEndBal: S.stmtEndBal || '',
    });
  } catch(e){
    set({screen:'config', error: e.message});
  }
}

// ─── CSV PARSER ───────────────────────────────────────────────────────────────
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const h = parseLine(lines[0]);
  const hi = k => h.findIndex(x=>x.toLowerCase().includes(k.toLowerCase()));
  const iDate=hi('date'), iDesc=hi('desc'), iAmt=hi('amount'), iType=hi('type');
  return lines.slice(1).map((l,i)=>{
    const v = parseLine(l);
    const rawAmt = parseFloat((v[iAmt]||'').replace(/[$,]/g,''))||0;
    if(!rawAmt) return null;
    const type=(v[iType]||'').trim();
    if(type!=='Sale'&&rawAmt>=0) return null;
    return {
      id:'csv-'+i, date: parseDate(v[iDate]),
      description:(v[iDesc]||'').trim(), amount:Math.abs(rawAmt),
      direction:'out', source:'bank', type:'Bank', tag:'tag-plaid', reference:'',
    };
  }).filter(Boolean);
}
function parseLine(line){
  const f=[]; let c='',q=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"')q=!q;
    else if(line[i]===','&&!q){f.push(c.trim());c='';}
    else c+=line[i];
  }
  f.push(c.trim()); return f;
}
function parseDate(d){
  if(!d) return '';
  const s=String(d).trim().replace(/^"|"$/g,'');
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  let m=s.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if(m) return `${m[3]}-${m[1]}-${m[2]}`;
  m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  return s;
}

// ─── COMPUTED VALUES ──────────────────────────────────────────────────────────
function computeSummary(){
  const {txns, checked, begBal, stmtEndBal} = S;
  const moneyIn  = txns.filter(t=>t.direction==='in');
  const moneyOut = txns.filter(t=>t.direction==='out');
  const clearedIn  = moneyIn.filter(t=>checked.has(t.id)).reduce((s,t)=>s+t.amount,0);
  const clearedOut = moneyOut.filter(t=>checked.has(t.id)).reduce((s,t)=>s+t.amount,0);
  const totalIn    = moneyIn.reduce((s,t)=>s+t.amount,0);
  const totalOut   = moneyOut.reduce((s,t)=>s+t.amount,0);
  const clearedBal = parseFloat(begBal||0) + clearedIn - clearedOut;
  const endBal     = parseFloat(stmtEndBal||0);
  const diff       = endBal - clearedBal;
  return {moneyIn,moneyOut,clearedIn,clearedOut,totalIn,totalOut,clearedBal,endBal,diff};
}

// ─── TOGGLE CHECK ─────────────────────────────────────────────────────────────
function toggleCheck(id){
  const c = new Set(S.checked);
  if(c.has(id)) c.delete(id); else c.add(id);
  set({checked: c});
}
function checkAll(ids, val){
  const c = new Set(S.checked);
  ids.forEach(id => val ? c.add(id) : c.delete(id));
  set({checked: c});
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML =
    S.screen==='loading' ? renderLoading() :
    S.screen==='recon'   ? renderRecon()   :
    renderConfig();
  bindAll();
}

// ── CONFIG ────────────────────────────────────────────────────────────────────
function renderConfig(){
  const {bankFile, plaidAcct, startDate, endDate, stmtEndBal, error} = S;
  const acctOpts = [
    {id:'129',label:'1000 · Rental Trust Account'},
    {id:'130',label:'1100 · Security Deposit Account'},
    {id:'149',label:'3100 · Employee Trust'},
  ];
  return `
  <div class="topbar">
    <span class="topbar-title"><span>Aloe</span> PM · Bank Reconciliation</span>
  </div>
  <div class="config-wrap">
    ${error?`<div class="err-box">⚠ ${esc(error)}</div>`:''}
    <div class="config-card">
      <div class="config-title">New Bank Reconciliation</div>
      <div class="field-row">
        <div class="field">
          <label>Bank Account</label>
          <select id="bankId">
            ${acctOpts.map(a=>`<option value="${a.id}" ${S.bankId===a.id?'selected':''}>${a.label}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Statement End Date</label>
          <input type="date" id="endDate" value="${endDate}"/>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Statement Start Date</label>
          <input type="date" id="startDate" value="${startDate}"/>
        </div>
        <div class="field">
          <label>Statement Ending Balance</label>
          <input type="number" id="stmtEndBal" placeholder="0.00" step="0.01" value="${stmtEndBal}"/>
        </div>
      </div>
    </div>
    <div class="config-card">
      <div class="config-title">Bank Statement Source</div>
      <div id="plaid-status-area">
        <div style="font-size:11px;color:var(--muted);padding:8px 0">Checking Plaid connection…</div>
      </div>
      <div class="drop-zone ${bankFile?'filled':''}" id="drop-zone">
        <input type="file" id="csv-input" accept=".csv" style="display:none"/>
        ${bankFile
          ?`<div class="dz-icon">✓</div><div class="dz-label" style="color:var(--teal)">${esc(bankFile.name)}</div><div class="dz-sub">Click to replace</div>`
          :`<div class="dz-icon">📄</div><div class="dz-label">Upload bank statement CSV (optional)</div><div class="dz-sub">Or use Plaid connection above</div>`}
      </div>
      <button class="run-btn" id="run-btn">Run Reconciliation →</button>
    </div>
  </div>`;
}

// ── LOADING ───────────────────────────────────────────────────────────────────
function renderLoading(){
  const steps = S.loadSteps;
  return `
  <div class="topbar"><span class="topbar-title"><span>Aloe</span> PM · Bank Reconciliation</span></div>
  <div class="load-wrap">
    <div class="spinner"></div>
    <div class="load-msg">Loading transactions…</div>
    <div class="load-steps">
      ${steps.map(s=>`<div class="load-step ${s.status}">${esc(s.label)}</div>`).join('')}
    </div>
  </div>`;
}

// ── RECON ─────────────────────────────────────────────────────────────────────
function renderRecon(){
  const {txns, checked, begBal, stmtEndBal, startDate, endDate, plaidAcct, bankFile} = S;
  const {moneyIn,moneyOut,clearedIn,clearedOut,totalIn,totalOut,clearedBal,endBal,diff} = computeSummary();
  const isBalanced = Math.abs(diff) < 0.01;

  const acctNames = {'129':'1000: Rental Trust Account (3221)','130':'1100: Security Deposit','149':'3100: Employee Trust'};

  // Row renderer
  const renderRow = (t) => {
    const isCleared = checked.has(t.id);
    const dirClass = t.direction==='in' ? 'amt-in' : 'amt-out';
    const dirPrefix = t.direction==='in' ? '+' : '-';
    return `<tr class="${isCleared?'cleared':''}" data-id="${t.id}">
      <td class="chk-cell"><input type="checkbox" class="row-chk" data-id="${t.id}" ${isCleared?'checked':''}></td>
      <td class="mono" style="font-size:11px;color:var(--text2)">${fmtDate(t.date)}</td>
      <td><span class="tag ${t.tag}">${esc(t.type)}</span></td>
      <td class="mono" style="font-size:11px;color:var(--text2)">${esc(t.reference)}</td>
      <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.description)}">${esc(t.description)}</td>
      <td class="${dirClass}" style="text-align:right">${dirPrefix}${fmt(t.amount)}</td>
    </tr>`;
  };

  const inIds  = moneyIn.map(t=>t.id);
  const outIds = moneyOut.map(t=>t.id);
  const allInChecked  = inIds.length>0  && inIds.every(id=>checked.has(id));
  const allOutChecked = outIds.length>0 && outIds.every(id=>checked.has(id));

  const cols = `
    <th class="chk-cell center"><input type="checkbox" class="chk-all-header" id="chk-all-in" ${allInChecked?'checked':''}></th>
    <th>Date</th><th>Type</th><th>Reference</th><th>Description</th><th class="right">Amount</th>`;

  return `
  <div class="recon-wrap">
    <!-- HEADER -->
    <div class="recon-header">
      <div>
        <div class="recon-title">Bank Reconciliation</div>
        <div class="recon-sub">${esc(acctNames[S.bankId]||'')} · ${fmtDate(startDate)} – ${fmtDate(endDate)}</div>
      </div>
      <div class="header-field" style="margin-left:20px">
        <label>Stmt End Date</label>
        <span style="font-size:12px;color:var(--text2);font-family:'DM Mono',monospace">${endDate}</span>
      </div>
      <div class="header-field">
        <label>Stmt Ending Balance</label>
        <input type="number" id="stmt-end-live" value="${stmtEndBal}" step="0.01" placeholder="0.00" style="width:140px"/>
      </div>
      <div class="header-field">
        <label>Beginning Balance</label>
        <span class="beg-bal">${fmt(begBal)}</span>
      </div>
      <div class="topbar-right" style="margin-left:auto">
        <button class="top-btn" id="back-btn">← New Recon</button>
        <button class="top-btn primary" id="save-btn" ${isBalanced?'':'disabled'}>Reconcile</button>
      </div>
    </div>

    <!-- BODY -->
    <div class="recon-body">
      <!-- TRANSACTIONS -->
      <div class="txn-area">

        <!-- MONEY IN -->
        <div class="section-hdr">
          <input type="checkbox" class="chk-all" id="chk-all-in" ${allInChecked?'checked':''} title="Select all Money In">
          <span class="section-hdr-title">💰 Money In</span>
          <span style="font-size:11px;color:var(--muted);margin-left:6px">${moneyIn.length} transactions · ${moneyIn.filter(t=>checked.has(t.id)).length} cleared</span>
          <span class="section-total green">${fmt(totalIn)}</span>
        </div>
        <table class="txn-table">
          <thead><tr>
            <th class="chk-cell"></th>
            <th>Date</th><th>Type</th><th>Reference</th><th>Description</th><th class="right">Amount</th>
          </tr></thead>
          <tbody>
            ${moneyIn.length ? moneyIn.map(renderRow).join('') : `<tr><td colspan="6" class="empty-msg">No Money In transactions for this period</td></tr>`}
          </tbody>
        </table>

        <!-- MONEY OUT -->
        <div class="section-hdr">
          <input type="checkbox" class="chk-all" id="chk-all-out" ${allOutChecked?'checked':''} title="Select all Money Out">
          <span class="section-hdr-title">💸 Money Out</span>
          <span style="font-size:11px;color:var(--muted);margin-left:6px">${moneyOut.length} transactions · ${moneyOut.filter(t=>checked.has(t.id)).length} cleared</span>
          <span class="section-total red">${fmt(totalOut)}</span>
        </div>
        <table class="txn-table">
          <thead><tr>
            <th class="chk-cell"></th>
            <th>Date</th><th>Type</th><th>Reference</th><th>Description</th><th class="right">Amount</th>
          </tr></thead>
          <tbody>
            ${moneyOut.length ? moneyOut.map(renderRow).join('') : `<tr><td colspan="6" class="empty-msg">No Money Out transactions for this period</td></tr>`}
          </tbody>
        </table>

      </div>

      <!-- SUMMARY PANEL -->
      <div class="summary-panel">
        <!-- Cleared Balance -->
        <div class="balance-block ${isBalanced?'':''}">
          <div class="balance-label" style="color:var(--muted)">Ending Balance (Statement)</div>
          <div class="balance-amount" style="color:var(--text)">${fmt(endBal)}</div>
        </div>

        <!-- Cleared -->
        <div class="sum-block">
          <div class="sum-label">Cleared</div>
          <div class="sum-row"><span class="sk">Money In</span><span class="sv" style="color:var(--green)">${fmt(clearedIn)}</span></div>
          <div class="sum-row"><span class="sk">Money Out</span><span class="sv" style="color:var(--red)">${fmt(clearedOut)}</span></div>
          <div class="sum-divider"></div>
          <div class="sum-total">
            <span class="st">Cleared Balance</span>
            <span class="sv">${fmt(clearedBal)}</span>
          </div>
        </div>

        <!-- Out of Balance -->
        <div class="diff-block ${isBalanced?'bal-ok':'bal-off'}">
          <div class="dl ${isBalanced?'bal-green':'bal-red'}">${isBalanced?'✓ Balanced':'Out of Balance'}</div>
          <div class="da ${isBalanced?'bal-green':'bal-red'}">${isBalanced?'$0.00':fmt(Math.abs(diff))}</div>
          <div class="ds" style="color:var(--text2)">${isBalanced?'All transactions accounted for':diff>0?'Statement is higher than cleared':'Statement is lower than cleared'}</div>
        </div>

        <!-- Totals -->
        <div class="sum-block">
          <div class="sum-label">All Transactions</div>
          <div class="sum-row"><span class="sk">Total In (${moneyIn.length})</span><span class="sv" style="color:var(--green)">${fmt(totalIn)}</span></div>
          <div class="sum-row"><span class="sk">Total Out (${moneyOut.length})</span><span class="sv" style="color:var(--red)">${fmt(totalOut)}</span></div>
          <div class="sum-divider"></div>
          <div class="sum-row"><span class="sk">Cleared In (${moneyIn.filter(t=>checked.has(t.id)).length})</span><span class="sv">${fmt(clearedIn)}</span></div>
          <div class="sum-row"><span class="sk">Cleared Out (${moneyOut.filter(t=>checked.has(t.id)).length})</span><span class="sv">${fmt(clearedOut)}</span></div>
        </div>

        <!-- Source -->
        <div class="sum-block">
          <div class="sum-label">Data Source</div>
          <div style="font-size:11px;color:var(--text2)">
            ${plaidAcct?`🔗 Plaid · ${plaidAcct.name}`:bankFile?`📄 ${esc(bankFile.name)}`:'Rentvine only'}
          </div>
          <div style="font-size:10px;color:var(--muted);margin-top:4px">
            ${txns.length} total transactions · ${checked.size} cleared
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// ─── BIND ─────────────────────────────────────────────────────────────────────
function bindAll(){
  if(S.screen==='config'){
    document.getElementById('bankId')?.addEventListener('change',e=>set({bankId:e.target.value}));
    document.getElementById('startDate')?.addEventListener('change',e=>set({startDate:e.target.value}));
    document.getElementById('endDate')?.addEventListener('change',e=>set({endDate:e.target.value}));
    document.getElementById('stmtEndBal')?.addEventListener('input',e=>set({stmtEndBal:e.target.value}));
    document.getElementById('run-btn')?.addEventListener('click',loadData);
    bindDrop();
    loadPlaidStatus();
  }
  if(S.screen==='recon'){
    document.getElementById('back-btn')?.addEventListener('click',()=>set({screen:'config',txns:[],checked:new Set()}));
    document.getElementById('stmt-end-live')?.addEventListener('input',e=>set({stmtEndBal:e.target.value}));

    // Row checkboxes
    document.querySelectorAll('.row-chk').forEach(chk=>{
      chk.addEventListener('change',e=>{
        e.stopPropagation();
        toggleCheck(chk.dataset.id);
      });
    });

    // Select all Money In
    document.getElementById('chk-all-in')?.addEventListener('change',e=>{
      const ids = S.txns.filter(t=>t.direction==='in').map(t=>t.id);
      checkAll(ids, e.target.checked);
    });
    // Select all Money Out
    document.getElementById('chk-all-out')?.addEventListener('change',e=>{
      const ids = S.txns.filter(t=>t.direction==='out').map(t=>t.id);
      checkAll(ids, e.target.checked);
    });

    // Row click to toggle (clicking anywhere on row)
    document.querySelectorAll('.txn-table tbody tr').forEach(row=>{
      row.addEventListener('click',e=>{
        if(e.target.type==='checkbox') return;
        const id = row.dataset.id;
        if(id) toggleCheck(id);
      });
    });

    document.getElementById('save-btn')?.addEventListener('click',()=>{
      alert('Reconciliation complete! ✓\n\nIn the future this will save to Rentvine.');
    });
  }
}

function bindDrop(){
  const drop=document.getElementById('drop-zone');
  const fi=document.getElementById('csv-input');
  if(!drop||!fi) return;
  drop.addEventListener('click',()=>fi.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');handleFile(e.dataTransfer.files[0]);});
  fi.addEventListener('change',e=>handleFile(e.target.files[0]));
}
async function handleFile(file){
  if(!file) return;
  const text = await file.text();
  set({bankFile:file, bankText:text});
}

async function loadPlaidStatus(){
  const area = document.getElementById('plaid-status-area');
  if(!area) return;
  try{
    const bankKeyMap = {'129':'trust','130':'security','149':'employee'};
    const key = bankKeyMap[S.bankId] || 'trust';
    const sr = await fetch('/api/plaid/status');
    const sd = await sr.json();
    const acct = sd.accounts?.[key];
    if(acct?.connected){
      const br = await fetch('/api/plaid/balances');
      const bd = await br.json();
      const bal = bd[key];
      const balStr = bal?.available!=null ? fmt(bal.available) : '';
      S.plaidAcct = {key, name: acct.name, balance: balStr};
      area.innerHTML = `<div class="plaid-connected">
        <div class="plaid-dot"></div>
        <div>
          <div class="plaid-name">Connected via Plaid · ${esc(acct.name)}</div>
          <div style="font-size:10px;color:var(--teal);margin-top:2px">Transactions will be pulled automatically for the selected date range</div>
        </div>
        ${balStr?`<div class="plaid-bal">${balStr}</div>`:''}
      </div>`;
    } else {
      S.plaidAcct = null;
      area.innerHTML = `<div style="font-size:11px;color:var(--muted);padding:4px 0 10px">No Plaid connection for this account — upload a CSV above or <a href="/bank-setup" style="color:var(--teal)">connect via Plaid</a>.</div>`;
    }
  } catch(e){
    S.plaidAcct = null;
    area.innerHTML = `<div style="font-size:11px;color:var(--muted);padding:4px 0 10px">Upload a bank statement CSV below.</div>`;
  }
}

// Set default dates (current month)
const now = new Date();
const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0');
const lastDay = new Date(y, now.getMonth()+1, 0).getDate();
S.startDate = `${y}-${m}-01`;
S.endDate   = `${y}-${m}-${lastDay}`;

render();
</script>
</body>
