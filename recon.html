<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe PM · Bank Reconciliation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--panel:#fff;--border:#E2E8F0;--border2:#CBD5E1;
  --teal:#0891B2;--teal-lt:#E0F2FE;--teal-bd:#7DD3FC;
  --green:#16A34A;--green-lt:#DCFCE7;--green-bd:#86EFAC;
  --amber:#D97706;--amber-lt:#FEF3C7;--amber-bd:#FCD34D;
  --red:#DC2626;--red-lt:#FEE2E2;--red-bd:#FCA5A5;
  --purple:#7C3AED;--purple-lt:#EDE9FE;--purple-bd:#C4B5FD;
  --text:#0F172A;--text2:#475569;--muted:#94A3B8;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* TOP BAR */
.topbar{height:46px;background:#0C1929;border-bottom:2px solid var(--teal);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100}
.topbar-title{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.1em;color:#94A3B8}
.topbar-title span{color:var(--teal)}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.top-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:4px 12px;color:#CBD5E1;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s;white-space:nowrap}
.top-btn:hover{background:rgba(255,255,255,.18);color:#fff}
.top-btn.accent{background:var(--teal);border-color:var(--teal);color:#fff}
.top-btn.accent:hover{background:#0e7490}

/* CONFIG */
.config-screen{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:32px 20px;overflow-y:auto}
.config-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;width:100%;max-width:640px}
.config-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:600;color:var(--text2);letter-spacing:.04em;text-transform:uppercase}
.field select,.field input[type=date],.field input[type=number]{background:#F8FAFC;border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text);font-family:'DM Sans',sans-serif}
.field select:focus,.field input:focus{outline:1.5px solid var(--teal);border-color:var(--teal)}
.plaid-banner{background:var(--teal-lt);border:1px solid var(--teal-bd);border-radius:7px;padding:10px 13px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.plaid-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.plaid-text{font-size:12px;font-weight:600;color:var(--teal)}
.plaid-bal{font-family:'DM Mono',monospace;font-size:12px;color:var(--teal);margin-left:auto;font-weight:500}
.or-divider{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.drop{border:1.5px dashed var(--border2);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .15s;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.drop:hover,.drop.over,.drop.filled{border-color:var(--teal);background:var(--teal-lt)}
.drop-icon{font-size:18px}
.drop-label{font-size:12px;font-weight:500;color:var(--text2)}
.drop-sub{font-size:10px;color:var(--muted)}
.run-btn{width:100%;background:var(--teal);border:none;border-radius:7px;padding:12px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:16px;transition:background .12s}
.run-btn:hover{background:#0e7490}
.run-btn:disabled{background:var(--border2);color:var(--muted);cursor:not-allowed}
.err{background:var(--red-lt);border:1px solid var(--red-bd);border-radius:7px;padding:8px 13px;font-size:11px;color:var(--red);margin-bottom:12px}
.info-box{background:var(--teal-lt);border:1px solid var(--teal-bd);border-radius:7px;padding:8px 13px;font-size:11px;color:var(--teal);margin-bottom:14px;line-height:1.6}

/* LOADING */
.load-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.spinner{width:28px;height:28px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-msg{font-family:'DM Mono',monospace;font-size:11px;color:var(--teal);font-weight:500}
.load-steps{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.step{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}
.step::before{content:'○';font-size:10px;flex-shrink:0}
.step.done{color:var(--green)}.step.done::before{content:'✓';color:var(--green)}
.step.active{color:var(--teal);font-weight:500}.step.active::before{content:'●';color:var(--teal)}

/* RECON LAYOUT */
.recon-layout{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* STATS BAR */
.stats-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:0 14px;height:42px;display:flex;align-items:center;gap:16px;flex-shrink:0;overflow-x:auto}
.stat{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:11px}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stat-label{color:var(--muted)}
.stat-val{font-family:'DM Mono',monospace;font-weight:500}
.stats-bar-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}

/* TOOLBAR */
.toolbar{background:var(--panel);border-bottom:1px solid var(--border);padding:0 12px;height:40px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:4px 10px;font-size:11px;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .12s}
.tb-btn:hover{border-color:var(--teal);color:var(--teal)}
.tb-btn.active{background:var(--teal-lt);border-color:var(--teal-bd);color:var(--teal);font-weight:600}
.tb-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;margin:0 2px}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.link-banner{background:linear-gradient(90deg,var(--purple),#6D28D9);color:#fff;padding:5px 14px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:10px;flex-shrink:0;display:none}
.link-banner.on{display:flex}
.link-cancel{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:2px 9px;color:#fff;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-left:auto}

/* WORKSPACE */
.workspace{flex:1;display:grid;grid-template-columns:1fr 28px 1fr;overflow:hidden;min-height:0}
.panel{display:flex;flex-direction:column;overflow:hidden;height:100%}
.panel-left{border-right:1px solid var(--border)}
.divider-col{background:#F8FAFC;border-left:1px solid var(--border);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:6px;flex-shrink:0;overflow:hidden}
.div-label{font-size:9px;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.06em;font-weight:600;text-transform:uppercase}

/* PANEL HEADER */
.panel-hdr{height:34px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--border);background:#F8FAFC;flex-shrink:0;gap:8px}
.panel-name{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text2)}
.panel-count{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}

/* COL HEADERS */
.col-hdr{display:grid;padding:0 6px;height:26px;align-items:center;background:#F1F5F9;border-bottom:2px solid var(--border2);flex-shrink:0}
/* RV cols: date | type | desc | amount */
.rv-grid{grid-template-columns:72px 74px 1fr 78px}
/* Bank cols: date | desc | amount */
.bk-grid{grid-template-columns:72px 1fr 82px}
.col-hdr span{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;user-select:none}
.col-hdr span:hover{color:var(--teal)}
.col-hdr span.sa::after{content:' ↑'}.col-hdr span.sd::after{content:' ↓'}

/* ROWS */
.rows{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.row{display:grid;padding:0 6px;min-height:33px;align-items:center;border-bottom:1px solid var(--border);cursor:pointer;transition:background .07s;position:relative}
.row.rv-grid{grid-template-columns:72px 74px 1fr 78px}
.row.bk-grid{grid-template-columns:72px 1fr 82px}
.row:hover{background:#F0F9FF}
/* Match states */
.row.matched{background:var(--green-lt)}
.row.matched:hover{background:#BBF7D0}
.row.manual-match{background:var(--purple-lt)}
.row.manual-match:hover{background:#DDD6FE}
.row.partial{background:var(--amber-lt)}
.row.partial:hover{background:#FDE68A}
.row.selected{background:#DBEAFE !important;box-shadow:inset 2px 0 0 var(--teal),inset -2px 0 0 var(--teal)}
.row.pending{background:#FEF9C3 !important;animation:blink .8s ease-in-out infinite alternate}
@keyframes blink{from{background:#FEF9C3}to{background:#FDE68A}}
.row.dimmed{opacity:.3}
/* Match dot */
.match-dot{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-g{background:var(--green)}.dot-a{background:var(--amber)}.dot-p{background:var(--purple)}
/* Cells */
.c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;padding:0 3px}
.c.date{font-family:'DM Mono',monospace;font-size:10px;color:var(--text2)}
.c.amt{font-family:'DM Mono',monospace;font-weight:500;text-align:right;padding-right:12px}
.c.amt.in{color:var(--green)}.c.amt.out{color:var(--red)}
.c.muted{color:var(--muted);font-size:10px}
.tag{display:inline-block;padding:1px 5px;border-radius:8px;font-size:9px;font-weight:600;white-space:nowrap}
.td{background:#DBEAFE;color:#1D4ED8}.tt{background:#F3E8FF;color:#6D28D9}
.ts{background:#FEF3C7;color:#92400E}.tp{background:#FEE2E2;color:#991B1B}
.tb{background:#E0F2FE;color:#0369A1}
.empty{padding:28px;text-align:center;color:var(--muted);font-style:italic;font-size:11px}

/* SUMMARY PANEL (right side) */
.sum-panel{width:240px;border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.sum-block{padding:14px;border-bottom:1px solid var(--border)}
.sum-title{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sum-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:11px}
.sum-row .sk{color:var(--text2)}.sum-row .sv{font-family:'DM Mono',monospace;font-weight:500;font-size:11px}
.sum-divider{height:1px;background:var(--border);margin:7px 0}
.bal-block{margin:14px;border-radius:8px;padding:12px 14px;border:1px solid}
.bal-block.ok{background:var(--green-lt);border-color:var(--green-bd)}.bal-block.off{background:var(--red-lt);border-color:var(--red-bd)}
.bal-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.bal-label.ok{color:var(--green)}.bal-label.off{color:var(--red)}
.bal-amt{font-family:'DM Mono',monospace;font-size:20px;font-weight:600;line-height:1}
.bal-amt.ok{color:var(--green)}.bal-amt.off{color:var(--red)}
.bal-sub{font-size:10px;color:var(--text2);margin-top:3px}
.stmt-input-wrap{padding:14px;border-bottom:1px solid var(--border)}
.stmt-input-wrap label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
.stmt-input-wrap input{width:100%;background:#F8FAFC;border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:13px;font-family:'DM Mono',monospace;color:var(--text);font-weight:500}
.stmt-input-wrap input:focus{outline:1.5px solid var(--teal);border-color:var(--teal)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
const ST = {
  screen: 'config',
  bankId: '129', startDate: '', endDate: '', stmtEndBal: '',
  bankFile: null, bankText: '',
  plaidAcct: null,
  error: '',
  loadSteps: [],
  // Recon data
  rvRows: [], bankRows: [],
  // Links: rvId → bankId, reverse
  links: {}, linksRev: {}, linkTypes: {},
  // UI
  filter: 'all',
  rvSort: 'date_asc', bkSort: 'date_asc',
  linkMode: false, linkSrc: null, linkSrcSide: null,
  selRV: null, selBK: null,
};
const set = p => { Object.assign(ST, p); render(); };

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const fmt = n => '$'+Math.abs(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD = d => { if(!d) return ''; try{ const dt=new Date(d+'T12:00:00'); return `${dt.getMonth()+1}/${dt.getDate()}/${String(dt.getFullYear()).slice(2)}`; }catch(e){ return d; } };
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const daysDiff = (a,b) => { try{ return Math.abs((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000); }catch(e){ return 999; } };

// ─── FETCH ALL PAGES ──────────────────────────────────────────────────────────
async function fetchAll(path, params={}) {
  let page=1, all=[];
  while(page<=20) {
    const url = new URL('/api/rentvine'+path, location.origin);
    Object.entries({...params,page,pageSize:200}).forEach(([k,v])=>url.searchParams.set(k,v));
    const r = await fetch(url); if(!r.ok) break;
    const d = await r.json();
    const rows = Array.isArray(d)?d:(d?.data??[]);
    if(!rows.length) break;
    all=all.concat(rows);
    if(rows.length<200) break;
    page++;
  }
  return all;
}

// ─── PARSE ────────────────────────────────────────────────────────────────────
function parseLine(l){ const f=[]; let c='',q=false; for(let i=0;i<l.length;i++){ if(l[i]==='"')q=!q; else if(l[i]===','&&!q){f.push(c.trim());c='';}else c+=l[i]; } f.push(c.trim()); return f; }
function parseDate(d){ if(!d) return ''; const s=String(d).trim().replace(/^"|"$/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10); let m=s.match(/^(\d{2})-(\d{2})-(\d{4})$/); if(m) return `${m[3]}-${m[1]}-${m[2]}`; m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/); if(m){const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}  return s; }

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const h = parseLine(lines[0]);
  const hi = k => h.findIndex(x=>x.toLowerCase().includes(k.toLowerCase()));
  const iDate=hi('date'),iDesc=hi('desc'),iAmt=hi('amount'),iType=hi('type');
  return lines.slice(1).map((l,i)=>{
    const v=parseLine(l);
    const raw=parseFloat((v[iAmt]||'').replace(/[$,]/g,''))||0;
    if(!raw) return null;
    const type=(v[iType]||'').trim();
    if(type!=='Sale'&&raw>=0) return null;
    const date=parseDate(v[iDate]);
    if(!date) return null;
    return { id:'csv'+i, date, description:(v[iDesc]||'').trim(), amount:Math.abs(raw), direction:'out', tag:'tb', typeLabel:'Bank' };
  }).filter(Boolean);
}

// ─── AUTO MATCH ───────────────────────────────────────────────────────────────
function autoMatch(rvRows, bankRows) {
  const links={}, linksRev={}, linkTypes={};
  const usedBank = new Set();

  // Pass 1: exact amount (±$0.02) + date within 5 days
  rvRows.forEach(rv => {
    if(links[rv.id]) return;
    let best=null, bestDiff=999;
    bankRows.forEach(bk => {
      if(usedBank.has(bk.id)) return;
      if(Math.abs(rv.amount - bk.amount) > 0.02) return;
      const dd = daysDiff(rv.date, bk.date);
      if(dd<=5 && dd<bestDiff){ bestDiff=dd; best=bk; }
    });
    if(best){ links[rv.id]=best.id; linksRev[best.id]=rv.id; linkTypes[rv.id]='matched'; usedBank.add(best.id); }
  });

  // Pass 2: exact amount + date within 45 days
  rvRows.forEach(rv => {
    if(links[rv.id]) return;
    let best=null, bestDiff=999;
    bankRows.forEach(bk => {
      if(usedBank.has(bk.id)) return;
      if(Math.abs(rv.amount - bk.amount) > 0.02) return;
      const dd = daysDiff(rv.date, bk.date);
      if(dd<=45 && dd<bestDiff){ bestDiff=dd; best=bk; }
    });
    if(best){ links[rv.id]=best.id; linksRev[best.id]=rv.id; linkTypes[rv.id]='matched'; usedBank.add(best.id); }
  });

  // Pass 3: amount within $5 + date within 45 days (partial)
  rvRows.forEach(rv => {
    if(links[rv.id]) return;
    let best=null, bestDiff=999;
    bankRows.forEach(bk => {
      if(usedBank.has(bk.id)) return;
      if(Math.abs(rv.amount - bk.amount) > 5) return;
      const dd = daysDiff(rv.date, bk.date);
      if(dd<=45 && dd<bestDiff){ bestDiff=dd; best=bk; }
    });
    if(best){ links[rv.id]=best.id; linksRev[best.id]=rv.id; linkTypes[rv.id]='partial'; usedBank.add(best.id); }
  });

  return { links, linksRev, linkTypes };
}

// ─── LOAD DATA ────────────────────────────────────────────────────────────────
async function loadData() {
  const steps = [
    {label:'Rentvine deposits', status:'pending'},
    {label:'Rentvine transfers', status:'pending'},
    {label:'Rentvine settlements', status:'pending'},
    {label:'Bank transactions', status:'pending'},
    {label:'Auto-matching', status:'pending'},
  ];
  set({screen:'loading', loadSteps:steps, error:''});
  const upd = (label,status) => { const s=ST.loadSteps.map(x=>x.label===label?{...x,status}:x); set({loadSteps:s}); };

  try {
    const inRange = d => { const s=d?.slice(0,10)||''; return (!ST.startDate||s>=ST.startDate)&&(!ST.endDate||s<=ST.endDate); };

    upd('Rentvine deposits','active');
    const deps = await fetchAll('/accounting/deposits',{bankAccountID:ST.bankId}).catch(()=>[]);
    upd('Rentvine deposits','done');

    upd('Rentvine transfers','active');
    const xfrs = await fetchAll('/accounting/bank-transfers/search',{bankAccountID:ST.bankId,isVoided:0}).catch(()=>[]);
    upd('Rentvine transfers','done');

    upd('Rentvine settlements','active');
    const setts = await fetchAll('/accounting/settlements',{bankAccountID:ST.bankId}).catch(()=>[]);
    upd('Rentvine settlements','done');

    // Build RV rows
    const rvRows = [];
    deps.forEach((row,i)=>{
      const d=row.deposit||row;
      const date=(d.dateDeposited||d.depositDate||d.dateTimeCreated||'').slice(0,10);
      if(!inRange(date)) return;
      rvRows.push({ id:'dep'+i, date, amount:Math.abs(parseFloat(d.amount||0)), direction:'in',
        typeLabel:'Deposit', tag:'td', reference:d.depositNumber||d.reference||'',
        description:d.description||d.memo||'Deposit' });
    });
    xfrs.forEach((row,i)=>{
      const bt=row.bankTransfer||row;
      const date=(bt.datePosted||bt.dateTransferred||'').slice(0,10);
      if(!inRange(date)) return;
      const fromId=String(bt.sourceBankAccountID||''), toId=String(bt.destinationBankAccountID||''), myId=String(ST.bankId);
      const dir = toId===myId?'in':'out';
      rvRows.push({ id:'xfr'+i, date, amount:Math.abs(parseFloat(bt.amount||0)), direction:dir,
        typeLabel:'Transfer', tag:'tt', reference:bt.bankTransferNumber||bt.reference||'',
        description:bt.description||bt.memo||`Transfer ${dir==='in'?'from':'to'} account` });
    });
    setts.forEach((row,i)=>{
      const s=row.settlement||row;
      const date=(s.settlementDate||s.datePosted||'').slice(0,10);
      if(!inRange(date)) return;
      const raw=parseFloat(s.amount||0), dir=raw>=0?'in':'out';
      rvRows.push({ id:'set'+i, date, amount:Math.abs(raw), direction:dir,
        typeLabel:dir==='out'?'Payout':'Settlement', tag:dir==='out'?'tp':'ts',
        reference:s.reference||'--', description:s.description||s.memo||(dir==='out'?'ACH Payout':'ACH Settlement') });
    });

    // Bank rows
    upd('Bank transactions','active');
    let bankRows = [];
    if(ST.plaidAcct) {
      try {
        const pr = await fetch(`/api/plaid/transactions?account_key=${ST.plaidAcct.key}&start_date=${ST.startDate}&end_date=${ST.endDate}`);
        const pd = await pr.json();
        bankRows = (pd.transactions||[]).map(t=>({
          id:'pl'+t.transactionId, date:t.date, amount:t.amount,
          description:t.description, direction:t.direction,
          typeLabel:'Bank', tag:'tb', reference:t.transactionId.slice(-6),
        }));
      } catch(e) {}
    } else if(ST.bankText) {
      bankRows = parseCSV(ST.bankText).filter(t=>inRange(t.date));
    }
    upd('Bank transactions','done');

    // Auto match
    upd('Auto-matching','active');
    const {links,linksRev,linkTypes} = autoMatch(rvRows, bankRows);
    upd('Auto-matching','done');

    set({ screen:'recon', rvRows, bankRows, links, linksRev, linkTypes,
      filter:'all', rvSort:'date_asc', bkSort:'date_asc',
      linkMode:false, linkSrc:null, linkSrcSide:null, selRV:null, selBK:null });
  } catch(e) {
    set({screen:'config', error:e.message});
  }
}

// ─── LINK MANAGEMENT ─────────────────────────────────────────────────────────
function applyLink(rvId, bkId) {
  const links={...ST.links}, linksRev={...ST.linksRev}, linkTypes={...ST.linkTypes};
  const oldBk=links[rvId], oldRv=linksRev[bkId];
  if(oldBk){ delete linksRev[oldBk]; }
  if(oldRv){ delete links[oldRv]; delete linkTypes[oldRv]; }
  links[rvId]=bkId; linksRev[bkId]=rvId; linkTypes[rvId]='manual';
  set({links,linksRev,linkTypes,linkMode:false,linkSrc:null,linkSrcSide:null,selRV:rvId,selBK:bkId});
}
function removeLink(rvId) {
  const links={...ST.links},linksRev={...ST.linksRev},linkTypes={...ST.linkTypes};
  const bkId=links[rvId]; if(bkId) delete linksRev[bkId];
  delete links[rvId]; delete linkTypes[rvId];
  set({links,linksRev,linkTypes});
}
function clickRow(side, id) {
  if(ST.linkMode) {
    if(!ST.linkSrc) { set({linkSrc:id,linkSrcSide:side}); return; }
    if(ST.linkSrcSide===side) { set({linkSrc:id,linkSrcSide:side}); return; }
    const rvId=side==='rv'?id:ST.linkSrc, bkId=side==='bk'?id:ST.linkSrc;
    applyLink(rvId,bkId); return;
  }
  if(side==='rv') {
    const bkId=ST.links[id]||null;
    set({selRV:id,selBK:bkId});
    if(bkId) setTimeout(()=>scrollIntoView('bk',bkId),50);
  } else {
    const rvId=ST.linksRev[id]||null;
    set({selBK:id,selRV:rvId});
    if(rvId) setTimeout(()=>scrollIntoView('rv',rvId),50);
  }
}
function scrollIntoView(side, id) {
  const wrap = document.getElementById(side==='rv'?'rv-rows':'bk-rows');
  const row = wrap?.querySelector(`[data-id="${id}"]`);
  row?.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ─── FILTER / SORT ────────────────────────────────────────────────────────────
function getSortedFiltered(side) {
  const rows = side==='rv'?[...ST.rvRows]:[...ST.bankRows];
  const sort = side==='rv'?ST.rvSort:ST.bkSort;
  const q = ST.filter;
  let filtered = rows;
  if(q==='matched') filtered=rows.filter(r=>side==='rv'?ST.links[r.id]:ST.linksRev[r.id]);
  else if(q==='unmatched') filtered=rows.filter(r=>side==='rv'?!ST.links[r.id]:!ST.linksRev[r.id]);
  else if(q==='partial') filtered=rows.filter(r=>side==='rv'&&ST.linkTypes[r.id]==='partial');
  const [col,dir]=sort.split('_');
  const d=dir==='asc'?1:-1;
  return filtered.sort((a,b)=>{
    if(col==='date') return d*a.date.localeCompare(b.date);
    if(col==='amt')  return d*(a.amount-b.amount);
    return 0;
  });
}

// ─── SUMMARY ──────────────────────────────────────────────────────────────────
function computeSummary() {
  const {rvRows,bankRows,links,linkTypes,stmtEndBal} = ST;
  const rvMatched=rvRows.filter(r=>links[r.id]&&linkTypes[r.id]==='matched').length;
  const rvPartial=rvRows.filter(r=>links[r.id]&&linkTypes[r.id]==='partial').length;
  const rvManual=rvRows.filter(r=>links[r.id]&&linkTypes[r.id]==='manual').length;
  const rvUnmatched=rvRows.filter(r=>!links[r.id]).length;
  const bkUnmatched=bankRows.filter(r=>!ST.linksRev[r.id]).length;
  const rvIn=rvRows.filter(r=>r.direction==='in').reduce((s,r)=>s+r.amount,0);
  const rvOut=rvRows.filter(r=>r.direction==='out').reduce((s,r)=>s+r.amount,0);
  const endBal=parseFloat(stmtEndBal||0);
  const isBalanced=Math.abs(endBal-(rvIn-rvOut))<0.01 && endBal>0;
  return {rvMatched,rvPartial,rvManual,rvUnmatched,bkUnmatched,rvIn,rvOut,endBal,isBalanced};
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function exportUnmatched() {
  const lines=[['Side','Date','Type','Description','Amount']];
  ST.rvRows.filter(r=>!ST.links[r.id]).forEach(r=>lines.push(['RV',r.date,r.typeLabel,`"${r.description}"`,r.amount.toFixed(2)]));
  ST.bankRows.filter(r=>!ST.linksRev[r.id]).forEach(r=>lines.push(['Bank',r.date,'Bank',`"${r.description}"`,r.amount.toFixed(2)]));
  const a=document.createElement('a');
  a.href='data:text/csv,'+encodeURIComponent(lines.map(r=>r.join(',')).join('\n'));
  a.download='recon_unmatched_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// ─── BIND ─────────────────────────────────────────────────────────────────────
function bindAll() {
  if(ST.screen==='config') {
    document.getElementById('bankId')?.addEventListener('change',e=>{ set({bankId:e.target.value}); });
    document.getElementById('startDate')?.addEventListener('change',e=>set({startDate:e.target.value}));
    document.getElementById('endDate')?.addEventListener('change',e=>set({endDate:e.target.value}));
    document.getElementById('stmtEndBal')?.addEventListener('input',e=>set({stmtEndBal:e.target.value}));
    document.getElementById('run-btn')?.addEventListener('click',loadData);
    bindDrop();
    loadPlaidStatus();
  }
  if(ST.screen==='recon') {
    document.getElementById('back-btn')?.addEventListener('click',()=>set({screen:'config',rvRows:[],bankRows:[],links:{},linksRev:{},linkTypes:{}}));
    document.getElementById('export-btn')?.addEventListener('click',exportUnmatched);
    document.getElementById('stmt-live')?.addEventListener('input',e=>set({stmtEndBal:e.target.value}));
    document.getElementById('link-btn')?.addEventListener('click',()=>set({linkMode:true,linkSrc:null,linkSrcSide:null}));
    document.getElementById('cancel-link')?.addEventListener('click',()=>set({linkMode:false,linkSrc:null,linkSrcSide:null}));
    document.getElementById('unlink-btn')?.addEventListener('click',()=>{ if(ST.selRV) removeLink(ST.selRV); });
    document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>set({filter:b.dataset.filter})));
    document.querySelectorAll('[data-sort]').forEach(th=>th.addEventListener('click',()=>{
      const [side,col]=th.dataset.sort.split('-');
      const key=side==='rv'?'rvSort':'bkSort';
      const [c,d]=ST[key].split('_');
      set({[key]:c===col?(d==='asc'?col+'_desc':col+'_asc'):col+'_asc'});
    }));
    document.querySelectorAll('.row').forEach(row=>{
      row.addEventListener('click',()=>clickRow(row.dataset.side,row.dataset.id));
      row.addEventListener('contextmenu',e=>{ e.preventDefault();
        const {side,id}=row.dataset;
        if(side==='rv'&&ST.links[id]) removeLink(id);
        else if(side==='bk'&&ST.linksRev[id]) removeLink(ST.linksRev[id]);
      });
    });
  }
}

function bindDrop() {
  const drop=document.getElementById('drop-zone'), fi=document.getElementById('csv-fi');
  if(!drop||!fi) return;
  drop.addEventListener('click',()=>fi.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');hf(e.dataTransfer.files[0]);});
  fi.addEventListener('change',e=>hf(e.target.files[0]));
}
async function hf(file){ if(!file) return; const text=await file.text(); set({bankFile:file,bankText:text}); }

async function loadPlaidStatus() {
  const area=document.getElementById('plaid-area'); if(!area) return;
  try {
    const keyMap={'129':'trust','130':'security','149':'employee'};
    const key=keyMap[ST.bankId]||'trust';
    const sd=await fetch('/api/plaid/status').then(r=>r.json());
    const acct=sd.accounts?.[key];
    if(acct?.connected) {
      const bd=await fetch('/api/plaid/balances').then(r=>r.json());
      const bal=bd[key];
      const balStr=bal?.available!=null?fmt(bal.available):'';
      ST.plaidAcct={key,name:acct.name,balance:balStr};
      area.innerHTML=`<div class="plaid-banner">
        <div class="plaid-dot"></div>
        <div><div class="plaid-text">Connected via Plaid · ${esc(acct.name)}</div>
        <div style="font-size:10px;color:var(--teal);margin-top:1px">Transactions pulled automatically for selected date range</div></div>
        ${balStr?`<div class="plaid-bal">${balStr}</div>`:''}
      </div>`;
    } else {
      ST.plaidAcct=null;
      area.innerHTML=`<div style="font-size:11px;color:var(--muted);padding:2px 0 8px">No Plaid connection for this account. <a href="/bank-setup" style="color:var(--teal)">Connect via Plaid</a> or upload a CSV below.</div>`;
    }
  } catch(e) { ST.plaidAcct=null; area.innerHTML=`<div style="font-size:11px;color:var(--muted);padding:2px 0 8px">Upload a bank CSV below.</div>`; }
}

// Set default dates (current month)
