<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe Recon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f7f7f5;--surface:#fff;--s2:#f2f2f0;--border:#e5e5e2;--border2:#d0d0cc;
    --green:#3B6D11;--gbg:#EAF3DE;--gborder:#97C459;
    --red:#A32D2D;--rbg:#FCEBEB;--rborder:#F09595;
    --amber:#854F0B;--abg:#FAEEDA;--aborder:#EF9F27;
    --blue:#185FA5;--muted:#888;--text:#1a1a1a;--text2:#555
  }
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;font-size:14px}
  .mono{font-family:'IBM Plex Mono',monospace}
  ::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

  .hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
  .logo{width:26px;height:26px;background:var(--green);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:'IBM Plex Mono',monospace;flex-shrink:0}
  .hdr-title{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.06em}
  .hdr-sub{font-size:11px;color:var(--muted)}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn-sm{background:none;border:1px solid var(--border2);border-radius:6px;padding:4px 11px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s}
  .btn-sm:hover{border-color:var(--text2);color:var(--text)}

  .body{padding:20px 24px;max-width:1100px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:18px;margin-bottom:14px}
  .card-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:13px}
  .info{background:var(--gbg);border:1px solid var(--gborder);border-radius:7px;padding:9px 14px;font-size:12px;color:#27500A;margin-bottom:14px}
  .err{background:var(--rbg);border:1px solid var(--rborder);border-radius:7px;padding:9px 14px;font-size:12px;color:var(--red);margin-bottom:14px}

  /* DROP */
  .drop{border:1.5px dashed var(--border2);border-radius:8px;padding:22px 20px;text-align:center;cursor:pointer;transition:all .18s}
  .drop:hover,.drop.over,.drop.filled{border-color:var(--gborder);background:var(--gbg)}
  .drop-icon{font-size:22px;margin-bottom:6px}
  .drop-title{font-size:13px;font-weight:500;margin-bottom:3px}
  .drop-sub{font-size:11px;color:var(--muted)}

  /* DATE RANGE PILL */
  .range-info{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:10px 14px;font-size:12px;margin-bottom:4px}
  .range-label{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--green)}
  .range-sub{color:var(--muted);font-size:11px}

  .btn-run{background:var(--green);border:none;border-radius:7px;padding:12px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;width:100%;transition:opacity .12s}
  .btn-run:hover{opacity:.88}
  .btn-run:disabled{background:var(--s2);color:var(--muted);cursor:not-allowed;border:1px solid var(--border)}

  /* LOADING */
  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;gap:16px}
  .spinner{width:34px;height:34px;border:2.5px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-msg{font-family:'IBM Plex Mono',monospace;color:var(--green);font-size:12px;font-weight:500}
  .load-sub{font-size:11px;color:var(--muted);margin-top:4px;text-align:center;max-width:320px;line-height:1.5}

  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:12px 14px}
  .stat-n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;line-height:1}
  .stat-l{font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:4px}

  /* ALERTS */
  .alert-row{display:flex;gap:8px;margin-bottom:14px}
  .alert{flex:1;border-radius:7px;padding:11px 14px}
  .alert-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
  .alert-amt{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500}
  .alert-sub{font-size:11px;margin-top:2px}

  /* SIDE-BY-SIDE TABLE */
  .recon-wrap{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .col-hdrs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--border)}
  .col-hdr{padding:9px 14px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--s2)}
  .col-hdr.left{border-right:1px solid var(--border)}
  .filters{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
  .srch{background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace;width:210px}
  .srch:focus{outline:2px solid var(--gborder);outline-offset:1px}
  .fsel{background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace}
  .row-ct{margin-left:auto;font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
  .recon-table{overflow:auto;max-height:520px}

  /* ROWS */
  .recon-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--border)}
  .recon-row:last-child{border-bottom:none}
  .recon-row.matched .cell-l,.recon-row.matched .cell-r{background:var(--surface)}
  .recon-row.bank-only .cell-l{background:#FAEEDA28}
  .recon-row.bank-only .cell-r{background:#FAEEDA10}
  .recon-row.rv-only .cell-l{background:#FCEBEB10}
  .recon-row.rv-only .cell-r{background:#FCEBEB28}
  .recon-row:hover .cell-l,.recon-row:hover .cell-r{filter:brightness(.97)}
  .cell-l{padding:9px 14px;border-right:1px solid var(--border);min-height:54px}
  .cell-r{padding:9px 14px;min-height:54px}
  .cell-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:3px}
  .cell-desc{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-bottom:3px}
  .cell-amt{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500}
  .cell-amt.in{color:var(--green)}
  .cell-amt.out{color:var(--red)}
  .cell-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--border2);font-size:20px}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:middle;font-family:'IBM Plex Mono',monospace}
  .badge-ok{background:var(--gbg);color:var(--green);border:1px solid var(--gborder)}
  .badge-warn{background:var(--abg);color:var(--amber);border:1px solid var(--aborder)}
  .badge-miss{background:var(--rbg);color:var(--red);border:1px solid var(--rborder)}
  .match-how{font-size:10px;color:var(--muted);margin-top:1px}
  .cell-type{font-size:10px;color:var(--muted);margin-top:1px}
  .empty{padding:42px;text-align:center;color:var(--muted);font-size:13px}
  .legend{display:flex;gap:16px;padding:8px 14px;border-top:1px solid var(--border);background:var(--s2)}
  .leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
  .leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PROXY='/api/rentvine', BANK_ID='129';
let S={
  screen:'config',
  bankFile:null, bankText:'',
  loadMsg:'', loadSub:'',
  error:'',
  results:null,
  search:'', dir:'all',
};
function set(p){Object.assign(S,p);render();}

// ── API ────────────────────────────────────────────────────────────────────
async function apiFetch(path,opts={}){
  const url=new URL(PROXY+path,location.origin);
  if(opts.params) Object.entries(opts.params).forEach(([k,v])=>url.searchParams.set(k,v));
  const fo={method:opts.method||'GET',headers:{'Content-Type':'application/json'}};
  if(opts.body){fo.method='POST';fo.body=JSON.stringify(opts.body);}
  const r=await fetch(url,fo);
  if(!r.ok) throw new Error(`${path} → ${r.status} ${r.statusText}`);
  return r.json();
}
async function fetchAll(path,params={}){
  let page=1,all=[];
  while(true){
    const d=await apiFetch(path,{params:{...params,page,pageSize:200}});
    const rows=Array.isArray(d)?d:(d?.data??[]);
    all=all.concat(rows);
    if(rows.length<200) break;
    page++;
  }
  return all;
}

// ── CSV ────────────────────────────────────────────────────────────────────
function pd(d){
  if(!d) return '';
  const s=String(d).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  return s;
}
function pl(line){
  const f=[];let c='',q=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"')q=!q;
    else if(line[i]===','&&!q){f.push(c.trim());c='';}
    else c+=line[i];
  }
  f.push(c.trim());return f;
}
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const headers=pl(lines[0]);
  return lines.slice(1).map(l=>{
    const v=pl(l),r={};
    headers.forEach((h,i)=>{r[h.trim()]=(v[i]||'').replace(/^"|"$/g,'').trim();});
    return r;
  }).filter(r=>Object.values(r).some(v=>v));
}
function parseBankFile(text){
  return parseCSV(text).map(r=>{
    const date=pd(r['Post Date']||r['Date']||r['Transaction Date']||'');
    const desc=(r['Description']||r['Memo']||'').trim();
    const debit=parseFloat((r['Debit']||'').replace(/[$,]/g,''))||0;
    const credit=parseFloat((r['Credit']||'').replace(/[$,]/g,''))||0;
    const amount=credit>0?credit:debit;
    if(!amount||!date) return null;
    return {date,description:desc,amount,direction:credit>0?'in':'out'};
  }).filter(Boolean);
}

// ── MATCH ──────────────────────────────────────────────────────────────────
function extractAch(str){
  const m=(str||'').match(/ACH-([A-Z0-9]{4}-[A-Z0-9]{5})/i);
  return m?m[1].toUpperCase():null;
}
function doMatch(bankTxns,rvTxns){
  const pool=rvTxns.map(r=>({...r,matched:false}));
  const bank=bankTxns.map(b=>({...b,matched:false,rvMatch:null,matchType:null}));

  // Pass 1: ACH ID exact match
  bank.forEach(b=>{
    if(b.matched) return;
    const achB=extractAch(b.description);
    if(!achB) return;
    const rv=pool.find(r=>!r.matched&&extractAch(r.reference||'')===achB);
    if(rv){b.matched=true;b.rvMatch=rv;b.matchType='ACH ID';rv.matched=true;}
  });

  // Pass 2: Exact amount, same direction
  bank.forEach(b=>{
    if(b.matched) return;
    const rv=pool.find(r=>!r.matched&&r.direction===b.direction&&Math.abs(r.amount-b.amount)<0.02);
    if(rv){b.matched=true;b.rvMatch=rv;b.matchType='Amount';rv.matched=true;}
  });

  // Pass 3: Exact amount, any direction
  bank.forEach(b=>{
    if(b.matched) return;
    const rv=pool.find(r=>!r.matched&&Math.abs(r.amount-b.amount)<0.02);
    if(rv){b.matched=true;b.rvMatch=rv;b.matchType='Amount (±dir)';rv.matched=true;}
  });

  return {
    matched:bank.filter(b=>b.matched),
    bankOnly:bank.filter(b=>!b.matched),
    rvOnly:pool.filter(r=>!r.matched),
  };
}

// ── HELPERS ────────────────────────────────────────────────────────────────
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
function fmtDate(d){
  if(!d) return '';
  try{const dt=new Date(d+'T12:00:00');return (dt.getMonth()+1)+'/'+dt.getDate()+'/'+dt.getFullYear();}
  catch(e){return d;}
}

// Type label mapping for Rentvine objectTypeID
function typeLabel(tx){
  const map={'2':'Deposit','3':'Transfer','4':'Check Deposit','5':'Payout','8':'ACH Settlement','10':'Bank Transfer'};
  return map[String(tx.objectTypeID||'')] || tx.description || 'Transaction';
}

function buildRows(results){
  if(!results) return [];
  const {matched,bankOnly,rvOnly}=results;
  const rows=[];
  matched.forEach(b=>rows.push({type:'matched',bank:b,rv:b.rvMatch}));
  bankOnly.forEach(b=>rows.push({type:'bank_only',bank:b,rv:null}));
  rvOnly.forEach(r=>rows.push({type:'rv_only',bank:null,rv:r}));
  rows.sort((a,b)=>{
    const da=a.bank?.date||a.rv?.date||'';
    const db=b.bank?.date||b.rv?.date||'';
    return da.localeCompare(db);
  });
  return rows;
}

function filteredRows(){
  if(!S.results) return [];
  let rows=buildRows(S.results);
  const q=S.search.toLowerCase();
  if(S.dir!=='all'){
    rows=rows.filter(r=>{
      const d=r.bank?.direction||r.rv?.direction;
      return d===S.dir;
    });
  }
  if(q) rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  return rows;
}

// ── MAIN ACTION ────────────────────────────────────────────────────────────
async function runRecon(){
  if(!S.bankText){set({error:'Upload your bank CSV first.'});return;}
  set({error:'',screen:'loading',loadMsg:'Parsing bank CSV…',loadSub:''});

  try{
    const bankTxns=parseBankFile(S.bankText);
    if(!bankTxns.length) throw new Error('Could not parse CSV — needs columns: Post Date, Description, Debit, Credit');

    // Date range: past 90 days
    const cutoff=new Date(Date.now()-90*24*60*60*1000).toISOString().slice(0,10);
    const today=new Date().toISOString().slice(0,10);

    // Step 1: load all reconciliation periods
    set({loadMsg:'Loading reconciliation periods…',loadSub:'Checking last 90 days of periods'});
    const reconData=await fetchAll('/accounting/reconciliations',{bankAccountID:BANK_ID});
    const recons=reconData.map(d=>d.reconciliation).filter(Boolean)
      .filter(r=>r.statementEndDate>=cutoff)
      .sort((a,b)=>b.statementEndDate.localeCompare(a.statementEndDate));

    if(!recons.length) throw new Error('No reconciliation periods found in the last 90 days');

    // Step 2: for each period, fetch transactions and keep only unreconciled
    let rvTxns=[];
    for(let i=0;i<recons.length;i++){
      const r=recons[i];
      set({
        loadMsg:`Fetching period ${i+1} of ${recons.length}…`,
        loadSub:`${r.statementStartDate} → ${r.statementEndDate}`
      });
      const raw=await fetchAll(`/accounting/reconciliations/${r.reconciliationID}/transactions`);
      const unreconciled=raw
        .map(row=>{
          const tx=row.reconciliationTransaction;
          const ref=tx.reference||'';
          const raw=parseFloat(tx.amount||0);
          return {
            id:tx.reconciliationTransactionID,
            objectTypeID:tx.reconciliationObjectTypeID,
            reference:ref,
            direction:tx.reconciliationTransactionTypeID==='1'?'in':'out',
            amount:Math.abs(raw),
            date:(tx.datePosted||'').slice(0,10),
            description:tx.description||'',
            isReconciled:tx.isReconciled==='1',
            period:`${r.statementStartDate} → ${r.statementEndDate}`,
            matched:false,
          };
        })
        .filter(tx=>!tx.isReconciled && tx.date>=cutoff);
      rvTxns=rvTxns.concat(unreconciled);
    }

    // De-duplicate by transaction ID (same txn can appear in multiple periods)
    const seen=new Set();
    rvTxns=rvTxns.filter(tx=>{
      if(seen.has(tx.id)) return false;
      seen.add(tx.id);
      return true;
    });

    set({loadMsg:`Matching ${bankTxns.length} bank vs ${rvTxns.length} unreconciled Rentvine…`,loadSub:''});
    const result=doMatch(bankTxns,rvTxns);

    set({
      results:{bankTxns,rvTxns,cutoff,today,...result},
      screen:'results',search:'',dir:'all'
    });
  }catch(e){set({error:e.message,screen:'config'});}
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML=
    S.screen==='loading'?rLoad():
    S.screen==='results'?rResults():
    rConfig();
  bind();
}

function rLoad(){
  return `<div class="hdr"><div class="logo">$</div><span class="hdr-title">ALOE RECON</span></div>
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div class="load-msg">${S.loadMsg}</div>
    ${S.loadSub?`<div class="load-sub">${S.loadSub}</div>`:''}
  </div>`;
}

function rConfig(){
  const {bankFile,error}=S;
  const now=new Date();
  const cutoff=new Date(Date.now()-90*24*60*60*1000);
  const fmt2=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  return `<div class="hdr">
    <div class="logo">$</div>
    <span class="hdr-title">ALOE RECON</span>
    <span class="hdr-sub" style="margin-left:6px">Trust Account · Bank ↔ Rentvine</span>
  </div>
  <div class="body">
    ${error?`<div class="err">⚠ ${error}</div>`:''}
    <div class="info">✓ Connected — pulls unreconciled transactions from Rentvine via your Render server</div>

    <div class="card">
      <div class="card-title">Rentvine data source</div>
      <div class="range-info">
        <div>
          <div class="range-label">Unreconciled · Last 90 days</div>
          <div class="range-sub">${fmt2(cutoff)} → ${fmt2(now)} · All reconciliation periods · isReconciled = false only</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Upload bank CSV</div>
      <div class="drop ${bankFile?'filled':''}" id="drop">
        <input type="file" id="fi" accept=".csv" style="display:none"/>
        ${bankFile
          ?`<div class="drop-title" style="color:var(--green)">✓ ${bankFile.name}</div><div class="drop-sub">Click to replace</div>`
          :`<div class="drop-icon">📄</div>
           <div class="drop-title">Drop CSV or click to browse</div>
           <div class="drop-sub">Enterprise Bank → Account History → Download → CSV</div>
           <div style="font-size:10px;color:var(--muted);margin-top:5px">Columns needed: Post Date, Description, Debit, Credit</div>`}
      </div>
    </div>

    <button class="btn-run" id="runBtn" ${!bankFile?'disabled':''}>Run reconciliation →</button>
  </div>`;
}

function rResults(){
  const {results,search,dir,bankFile}=S;
  const {bankTxns,rvTxns,matched,bankOnly,rvOnly,cutoff,today}=results;
  const rate=bankTxns.length?Math.round((matched.length/bankTxns.length)*100):0;
  const boOut=bankOnly.filter(r=>r.direction==='out').reduce((s,r)=>s+r.amount,0);
  const boIn=bankOnly.filter(r=>r.direction==='in').reduce((s,r)=>s+r.amount,0);
  const rows=filteredRows();

  const tableRows=rows.length===0
    ?`<div class="empty">No transactions match the current filter.</div>`
    :rows.map(row=>{
        const cls=row.type==='matched'?'matched':row.type==='bank_only'?'bank-only':'rv-only';
        const b=row.bank,rv=row.rv;

        // LEFT — bank
        let leftHtml;
        if(b){
          const badge=row.type==='matched'
            ?`<span class="badge badge-ok">matched</span>`
            :`<span class="badge badge-warn">bank only</span>`;
          leftHtml=`
            <div class="cell-date">${fmtDate(b.date)}</div>
            <div class="cell-desc" title="${b.description}">${b.description||'—'}</div>
            <div>
              <span class="cell-amt ${b.direction}">${b.direction==='in'?'+':'−'}${fmt(b.amount)}</span>
              ${badge}
            </div>
            ${row.matchType?`<div class="match-how">via ${row.bank.matchType}</div>`:''}`;
        }else{
          leftHtml=`<div class="cell-empty">—</div>`;
        }

        // RIGHT — Rentvine
        let rightHtml;
        if(rv){
          const badge=row.type==='matched'
            ?`<span class="badge badge-ok">matched</span>`
            :`<span class="badge badge-miss">RV only</span>`;
          const desc=rv.reference||rv.description||typeLabel(rv);
          rightHtml=`
            <div class="cell-date">${fmtDate(rv.date)}</div>
            <div class="cell-desc" title="${desc}">${desc}</div>
            <div>
              <span class="cell-amt ${rv.direction}">${rv.direction==='in'?'+':'−'}${fmt(rv.amount)}</span>
              ${badge}
            </div>
            <div class="cell-type">${typeLabel(rv)}${rv.period?' · '+rv.period:''}</div>`;
        }else{
          rightHtml=`<div class="cell-empty">—</div>`;
        }

        return `<div class="recon-row ${cls}">
          <div class="cell-l">${leftHtml}</div>
          <div class="cell-r">${rightHtml}</div>
        </div>`;
      }).join('');

  return `<div class="hdr">
    <div class="logo">$</div>
    <div>
      <div class="hdr-title">ALOE RECON — Last 90 days · Unreconciled only</div>
      <div class="hdr-sub" style="margin-top:1px">${bankTxns.length} bank · ${rvTxns.length} unreconciled RV · ${bankFile?.name||''}</div>
    </div>
    <div class="hdr-right"><button class="btn-sm" id="backBtn">← New run</button></div>
  </div>
  <div class="body">
    <div class="stats">
      <div class="stat"><div class="stat-n" style="color:var(--green)">${rate}%</div><div class="stat-l">Match rate</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--blue)">${matched.length}</div><div class="stat-l">Matched</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--amber)">${bankOnly.length}</div><div class="stat-l">Bank only</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--red)">${rvOnly.length}</div><div class="stat-l">Rentvine only</div></div>
    </div>

    ${boOut>0||boIn>0?`<div class="alert-row">
      ${boOut>0?`<div class="alert" style="background:var(--abg);border:1px solid var(--aborder)">
        <div class="alert-lbl" style="color:var(--amber)">⚠ Debits in bank — not in Rentvine</div>
        <div class="alert-amt" style="color:var(--amber)">${fmt(boOut)}</div>
        <div class="alert-sub" style="color:#633806">Payments out with no unreconciled RV record</div>
      </div>`:''}
      ${boIn>0?`<div class="alert" style="background:var(--rbg);border:1px solid var(--rborder)">
        <div class="alert-lbl" style="color:var(--red)">⚠ Credits in bank — not in Rentvine</div>
        <div class="alert-amt" style="color:var(--red)">${fmt(boIn)}</div>
        <div class="alert-sub" style="color:#791F1F">Deposits with no unreconciled RV record</div>
      </div>`:''}
    </div>`:''}

    <div class="recon-wrap">
      <div class="col-hdrs">
        <div class="col-hdr left">🏦 Bank statement</div>
        <div class="col-hdr">📋 Rentvine — unreconciled</div>
      </div>
      <div class="filters">
        <input class="srch" id="si" placeholder="Search date, amount, description…" value="${search}"/>
        <select class="fsel" id="ds">
          <option value="all">All directions</option>
          <option value="in" ${dir==='in'?'selected':''}>Money in</option>
          <option value="out" ${dir==='out'?'selected':''}>Money out</option>
        </select>
        <span class="row-ct">${rows.length} rows</span>
      </div>
      <div class="recon-table">${tableRows}</div>
      <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:var(--surface);border:1px solid var(--border2)"></div>Matched</div>
        <div class="leg-item"><div class="leg-dot" style="background:#FAEEDA80;border:1px solid var(--aborder)"></div>In bank — no Rentvine record</div>
        <div class="leg-item"><div class="leg-dot" style="background:#FCEBEB80;border:1px solid var(--rborder)"></div>In Rentvine — not in bank</div>
      </div>
    </div>
  </div>`;
}

// ── EVENTS ─────────────────────────────────────────────────────────────────
function bind(){
  if(S.screen==='config'){
    const drop=document.getElementById('drop'),fi=document.getElementById('fi');
    drop?.addEventListener('click',()=>fi?.click());
    drop?.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
    drop?.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop?.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');hf(e.dataTransfer.files[0]);});
    fi?.addEventListener('change',e=>hf(e.target.files[0]));
    document.getElementById('runBtn')?.addEventListener('click',runRecon);
  }
  if(S.screen==='results'){
    document.getElementById('backBtn')?.addEventListener('click',()=>set({screen:'config',results:null,search:'',dir:'all'}));
    document.getElementById('si')?.addEventListener('input',e=>set({search:e.target.value}));
    document.getElementById('ds')?.addEventListener('change',e=>set({dir:e.target.value}));
  }
}
async function hf(file){if(!file)return;const text=await file.text();set({bankFile:file,bankText:text});}

render();
</script>
</body>
</html>
