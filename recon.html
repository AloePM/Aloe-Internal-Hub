<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe Recon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f7f7f5;--surface:#ffffff;--surface2:#f2f2f0;--border:#e5e5e2;--border2:#d0d0cc;--green:#3B6D11;--green-bg:#EAF3DE;--green-border:#97C459;--red:#A32D2D;--red-bg:#FCEBEB;--red-border:#F09595;--amber:#854F0B;--amber-bg:#FAEEDA;--amber-border:#EF9F27;--blue:#185FA5;--muted:#888;--text:#1a1a1a;--text2:#555}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;font-size:14px}
  .mono{font-family:'IBM Plex Mono',monospace}
  ::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

  /* HEADER */
  .hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
  .logo{width:26px;height:26px;background:var(--green);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:'IBM Plex Mono',monospace;flex-shrink:0}
  .hdr-title{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--text)}
  .hdr-sub{font-size:11px;color:var(--muted)}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn-sm{background:none;border:1px solid var(--border2);border-radius:6px;padding:4px 11px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s}
  .btn-sm:hover{border-color:var(--text2);color:var(--text)}

  /* BODY */
  .body{padding:20px 24px;max-width:1100px;margin:0 auto}

  /* INFO / ERR */
  .info{background:var(--green-bg);border:1px solid var(--green-border);border-radius:7px;padding:9px 14px;font-size:12px;color:#27500A;margin-bottom:14px}
  .err{background:var(--red-bg);border:1px solid var(--red-border);border-radius:7px;padding:9px 14px;font-size:12px;color:var(--red);margin-bottom:14px}

  /* CARD */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:18px;margin-bottom:14px}
  .card-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:13px}

  /* PERIOD SELECTOR */
  .period-grid{display:grid;gap:6px}
  .period-item{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .12s}
  .period-item:hover,.period-item.sel{border-color:var(--green-border);background:var(--green-bg)}
  .period-item.sel .period-label{color:var(--green)}
  .period-label{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500}
  .period-meta{font-size:11px;color:var(--muted);margin-top:1px}
  .period-bal{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--green)}
  .period-warn{font-size:10px;font-weight:600;color:var(--amber)}
  .period-ok{font-size:10px;font-weight:600;color:var(--green)}

  /* DROP ZONE */
  .drop{border:1.5px dashed var(--border2);border-radius:8px;padding:22px 20px;text-align:center;cursor:pointer;transition:all .18s}
  .drop:hover,.drop.over,.drop.filled{border-color:var(--green-border);background:var(--green-bg)}
  .drop-icon{font-size:22px;margin-bottom:6px}
  .drop-title{font-size:13px;font-weight:500;margin-bottom:3px}
  .drop-sub{font-size:11px;color:var(--muted)}

  /* MODE SWITCH */
  .mode-row{display:flex;gap:6px;margin-bottom:13px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:3px}
  .mode-btn{flex:1;padding:7px;border:none;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;cursor:pointer;letter-spacing:.03em;transition:all .12s;background:none;color:var(--muted)}
  .mode-btn.active{background:var(--green);color:#fff}

  /* RUN BUTTON */
  .btn-run{background:var(--green);border:none;border-radius:7px;padding:12px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;width:100%;transition:opacity .12s;letter-spacing:.02em}
  .btn-run:hover{opacity:.88}
  .btn-run:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;border:1px solid var(--border)}

  /* LOADING */
  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:16px}
  .spinner{width:34px;height:34px;border:2.5px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-msg{font-family:'IBM Plex Mono',monospace;color:var(--green);font-size:12px;font-weight:500}

  /* STATS BAR */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:12px 14px}
  .stat-n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;line-height:1}
  .stat-l{font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:4px}

  /* ALERT ROW */
  .alert-row{display:flex;gap:8px;margin-bottom:14px}
  .alert{flex:1;border-radius:7px;padding:11px 14px}
  .alert-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
  .alert-amt{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500}
  .alert-sub{font-size:11px;margin-top:2px}

  /* FILTERS BAR */
  .filters{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center;background:var(--surface);flex-wrap:wrap}
  .srch{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace;width:210px}
  .srch:focus{outline:2px solid var(--green-border);outline-offset:1px}
  .fsel{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace}
  .row-ct{margin-left:auto;font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}

  /* ── MAIN RECON TABLE ─────────────────────────────────── */
  .recon-wrap{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden}

  /* column headers */
  .col-hdrs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--border)}
  .col-hdr{padding:9px 14px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
  .col-hdr.left{border-right:1px solid var(--border)}

  /* each row = two cells side by side */
  .recon-table{overflow:auto;max-height:520px}
  .recon-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--border)}
  .recon-row:last-child{border-bottom:none}
  .recon-row:hover .cell-l,.recon-row:hover .cell-r{background:#00000005}

  /* matched row */
  .recon-row.matched .cell-l,.recon-row.matched .cell-r{background:var(--surface)}

  /* bank-only row — amber tint on left, blank on right */
  .recon-row.bank-only .cell-l{background:#FAEEDA30}
  .recon-row.bank-only .cell-r{background:#FAEEDA18}

  /* rv-only row — blank on left, red tint on right */
  .recon-row.rv-only .cell-l{background:#FCEBEB18}
  .recon-row.rv-only .cell-r{background:#FCEBEB30}

  /* cells */
  .cell-l{padding:9px 14px;border-right:1px solid var(--border);min-height:52px}
  .cell-r{padding:9px 14px;min-height:52px}

  .cell-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:3px}
  .cell-desc{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-bottom:3px}
  .cell-amt{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500}
  .cell-amt.in{color:var(--green)}
  .cell-amt.out{color:var(--red)}
  .cell-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--border2);font-size:18px;font-weight:300}

  /* badge */
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:middle;font-family:'IBM Plex Mono',monospace}
  .badge-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
  .badge-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
  .badge-miss{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}

  /* HOW matched */
  .match-how{font-size:10px;color:var(--muted);margin-top:2px}

  /* empty state */
  .empty{padding:42px;text-align:center;color:var(--muted);font-size:13px}

  /* date inputs */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field label{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  input[type=date]{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:8px 11px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace;width:100%}
  input[type=date]:focus{outline:2px solid var(--green-border);outline-offset:1px}

  /* LEGEND */
  .legend{display:flex;gap:16px;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface2)}
  .leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
  .leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PROXY='/api/rentvine', BANK_ID='129';
let S={
  screen:'config', mode:'reconciliation',
  reconciliations:[], selRecon:null,
  settlStart:'', settlEnd:'',
  bankFile:null, bankText:'',
  loadMsg:'', error:'',
  results:null,
  search:'', dir:'all',
};
function set(p){Object.assign(S,p);render();}

// ── API ────────────────────────────────────────────────────────────────────
async function apiFetch(path,opts={}){
  const url=new URL(PROXY+path,location.origin);
  if(opts.params) Object.entries(opts.params).forEach(([k,v])=>url.searchParams.set(k,v));
  const fo={method:opts.method||'GET',headers:{'Content-Type':'application/json'}};
  if(opts.body){fo.method='POST';fo.body=JSON.stringify(opts.body);}
  const r=await fetch(url,fo);
  if(!r.ok) throw new Error(`${path} → ${r.status} ${r.statusText}`);
  return r.json();
}
async function fetchAll(path,params={}){
  let page=1,all=[];
  while(true){
    const d=await apiFetch(path,{params:{...params,page,pageSize:200}});
    const rows=Array.isArray(d)?d:(d?.data??[]);
    all=all.concat(rows);
    if(rows.length<200) break;
    page++;
  }
  return all;
}

// ── CSV ────────────────────────────────────────────────────────────────────
function pd(d){
  if(!d) return '';
  const s=String(d).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  return s;
}
function pl(line){const f=[];let c='',q=false;for(let i=0;i<line.length;i++){if(line[i]==='"')q=!q;else if(line[i]===','&&!q){f.push(c.trim());c='';}else c+=line[i];}f.push(c.trim());return f;}
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const headers=pl(lines[0]);
  return lines.slice(1).map(l=>{const v=pl(l),r={};headers.forEach((h,i)=>{r[h.trim()]=(v[i]||'').replace(/^"|"$/g,'').trim();});return r;}).filter(r=>Object.values(r).some(v=>v));
}
function parseBankFile(text){
  return parseCSV(text).map(r=>{
    const date=pd(r['Post Date']||r['Date']||r['Transaction Date']||'');
    const desc=(r['Description']||r['Memo']||'').trim();
    const debit=parseFloat((r['Debit']||'').replace(/[$,]/g,''))||0;
    const credit=parseFloat((r['Credit']||'').replace(/[$,]/g,''))||0;
    const amount=credit>0?credit:debit;
    if(!amount||!date) return null;
    return {date,description:desc,amount,direction:credit>0?'in':'out'};
  }).filter(Boolean);
}

// ── MATCH ──────────────────────────────────────────────────────────────────
function extractAch(str){const m=(str||'').match(/ACH-([A-Z0-9]{4}-[A-Z0-9]{5})/i);return m?m[1].toUpperCase():null;}
function doMatch(bankTxns,rvTxns){
  const pool=rvTxns.map(r=>({...r,matched:false}));
  const bank=bankTxns.map(b=>({...b,matched:false,rvMatch:null,matchType:null}));
  // Pass 1: ACH ID exact match (most reliable — reference number is identical)
  bank.forEach(b=>{
    if(b.matched) return;
    const achB=extractAch(b.description);
    if(!achB) return;
    const rv=pool.find(r=>!r.matched&&extractAch(r.achId||r.reference||'')===achB);
    if(rv){b.matched=true;b.rvMatch=rv;b.matchType='ACH ID';rv.matched=true;}
  });
  // Pass 2: Exact amount match only — no date required
  // Same direction first (more precise)
  bank.forEach(b=>{
    if(b.matched) return;
    const rv=pool.find(r=>!r.matched&&r.direction===b.direction&&Math.abs(r.amount-b.amount)<0.02);
    if(rv){b.matched=true;b.rvMatch=rv;b.matchType='Amount';rv.matched=true;}
  });
  // Pass 3: Exact amount, any direction (catches cases where direction encoding differs)
  bank.forEach(b=>{
    if(b.matched) return;
    const rv=pool.find(r=>!r.matched&&Math.abs(r.amount-b.amount)<0.02);
    if(rv){b.matched=true;b.rvMatch=rv;b.matchType='Amount (any dir)';rv.matched=true;}
  });
  return {
    matched:bank.filter(b=>b.matched),
    bankOnly:bank.filter(b=>!b.matched),
    rvOnly:pool.filter(r=>!r.matched),
  };
}

// ── HELPERS ────────────────────────────────────────────────────────────────
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
function fmtDate(d){if(!d) return '';try{const dt=new Date(d+'T12:00:00');return (dt.getMonth()+1)+'/'+dt.getDate()+'/'+dt.getFullYear();}catch(e){return d;}}

// Build the merged rows for the side-by-side view
// Each row is one of:
//   {type:'matched', bank, rv}
//   {type:'bank_only', bank}
//   {type:'rv_only', rv}
function buildRows(results){
  if(!results) return [];
  const {matched,bankOnly,rvOnly}=results;
  const rows=[];
  matched.forEach(b=>rows.push({type:'matched',bank:b,rv:b.rvMatch}));
  bankOnly.forEach(b=>rows.push({type:'bank_only',bank:b,rv:null}));
  rvOnly.forEach(r=>rows.push({type:'rv_only',bank:null,rv:r}));
  // sort by date (bank date first, then rv date)
  rows.sort((a,b)=>{
    const da=(a.bank?.date||a.rv?.date||'');
    const db=(b.bank?.date||b.rv?.date||'');
    return da.localeCompare(db);
  });
  return rows;
}

function filteredRows(){
  if(!S.results) return [];
  let rows=buildRows(S.results);
  const q=S.search.toLowerCase();
  if(S.dir!=='all'){
    rows=rows.filter(r=>{
      const d=r.bank?.direction||r.rv?.direction;
      return d===S.dir;
    });
  }
  if(q){
    rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  }
  return rows;
}

// ── ACTIONS ────────────────────────────────────────────────────────────────
async function loadInit(){
  set({loadMsg:'Loading reconciliation history…',screen:'loading',error:''});
  try{
    const data=await fetchAll('/accounting/reconciliations',{bankAccountID:BANK_ID});
    const recons=data.map(d=>d.reconciliation).filter(Boolean).sort((a,b)=>b.statementEndDate.localeCompare(a.statementEndDate));
    const now=new Date();
    const y=now.getFullYear(),m=String(now.getMonth()+1).padStart(2,'0');
    const last=new Date(y,now.getMonth()+1,0).getDate();
    set({reconciliations:recons,selRecon:recons[0]?.reconciliationID||null,settlStart:`${y}-${m}-01`,settlEnd:`${y}-${m}-${last}`,screen:'config'});
  }catch(e){set({error:e.message,screen:'config'});}
}

async function runRecon(){
  if(!S.bankText){set({error:'Upload your bank CSV first.'});return;}
  if(S.mode==='reconciliation'&&!S.selRecon){set({error:'Select a reconciliation period.'});return;}
  if(S.mode==='settlements'&&(!S.settlStart||!S.settlEnd)){set({error:'Set a date range.'});return;}
  set({error:'',screen:'loading',loadMsg:'Parsing bank file…'});
  try{
    const bankTxns=parseBankFile(S.bankText);
    if(!bankTxns.length) throw new Error('Could not parse CSV — needs columns: Post Date, Description, Debit, Credit');
    let rvTxns=[];
    if(S.mode==='settlements'){
      set({loadMsg:'Fetching Rentvine settlements…'});
      const resp=await apiFetch('/reports/settlements',{body:{isReconciled:'booleanAny',startDate:S.settlStart,endDate:S.settlEnd,bankAccountID:BANK_ID}});
      const rows=(resp.rows||[]).filter(r=>r.data&&r.data.bankAccountID===BANK_ID);
      rvTxns=rows.map(r=>{
        const d=r.data;
        const achId=d.bankAccountGatewaySettlementID||'';
        const raw=parseFloat(d.amount||0);const direction=raw>=0?'in':'out';const amount=Math.abs(raw);return {id:d.settlementID,achId,direction,amount,date:(d.settlementDate||'').slice(0,10),description:achId||'ACH Settlement',reference:achId,isReconciled:d.isReconciled==='1',matched:false};
      });
    }else{
      set({loadMsg:'Fetching Rentvine reconciliation…'});
      const raw=await fetchAll(`/accounting/reconciliations/${S.selRecon}/transactions`);
      rvTxns=raw.map(r=>{
        const tx=r.reconciliationTransaction;
        const ref=tx.reference||'';
        return {id:tx.reconciliationTransactionID,achId:ref,direction:tx.reconciliationTransactionTypeID==='1'?'in':'out',amount:parseFloat(tx.amount||0),date:(tx.datePosted||'').slice(0,10),description:tx.description||'',reference:ref,isReconciled:tx.isReconciled==='1',matched:false};
      });
    }
    set({loadMsg:`Matching ${bankTxns.length} bank vs ${rvTxns.length} Rentvine…`});
    const r=doMatch(bankTxns,rvTxns);
    set({results:{bankTxns,rvTxns,mode:S.mode,...r},screen:'results',search:'',dir:'all'});
  }catch(e){set({error:e.message,screen:'config'});}
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML=
    S.screen==='loading'?rLoad():S.screen==='results'?rResults():rConfig();
  bind();
}

function rLoad(){
  return `<div class="hdr"><div class="logo">$</div><span class="hdr-title">ALOE RECON</span></div>
  <div class="loading-wrap"><div class="spinner"></div><div class="load-msg">${S.loadMsg}</div></div>`;
}

function rConfig(){
  const {reconciliations,selRecon,bankFile,error,mode,settlStart,settlEnd}=S;
  const reconItems=reconciliations.slice(0,8).map(r=>{
    const unr=parseFloat(r.unreconciledMoneyInTotal||0)+parseFloat(r.unreconciledMoneyOutTotal||0);
    return `<div class="period-item ${r.reconciliationID===selRecon?'sel':''}" data-r="${r.reconciliationID}">
      <div>
        <div class="period-label">${r.statementStartDate} → ${r.statementEndDate}</div>
        <div class="period-meta">Ending: <span class="period-bal">${fmt(r.statementEndingBalance)}</span></div>
      </div>
      <span class="${unr>0?'period-warn':'period-ok'}">${unr>0?'⚠ '+fmt(unr)+' unreconciled':'✓ Balanced'}</span>
    </div>`;
  }).join('');

  return `<div class="hdr"><div class="logo">$</div><span class="hdr-title">ALOE RECON</span><span class="hdr-sub" style="margin-left:6px">Trust Account · Bank ↔ Rentvine</span></div>
  <div class="body">
    ${error?`<div class="err">⚠ ${error}</div>`:''}
    <div class="info">✓ Connected — pulls live from Rentvine via your Render server</div>
    <div class="card">
      <div class="card-title">1 — Data source</div>
      <div class="mode-row">
        <button class="mode-btn ${mode==='reconciliation'?'active':''}" data-m="reconciliation">Reconciliation period</button>
        <button class="mode-btn ${mode==='settlements'?'active':''}" data-m="settlements">Settlements only</button>
      </div>
      ${mode==='settlements'?`
        <div class="grid2">
          <div class="field"><label>From</label><input type="date" id="ss" value="${settlStart}"/></div>
          <div class="field"><label>To</label><input type="date" id="se" value="${settlEnd}"/></div>
        </div>
      `:`<div class="period-grid">${reconItems}</div>`}
    </div>
    <div class="card">
      <div class="card-title">2 — Bank CSV</div>
      <div class="drop ${bankFile?'filled':''}" id="drop">
        <input type="file" id="fi" accept=".csv" style="display:none"/>
        ${bankFile
          ?`<div class="drop-title" style="color:var(--green)">✓ ${bankFile.name}</div><div class="drop-sub">Click to replace</div>`
          :`<div class="drop-icon">📄</div><div class="drop-title">Drop CSV or click to browse</div><div class="drop-sub">Enterprise Bank → Account History → Download → CSV</div><div style="font-size:10px;color:var(--muted);margin-top:5px">Needs: Post Date, Description, Debit, Credit</div>`}
      </div>
    </div>
    <button class="btn-run" id="runBtn" ${!bankFile?'disabled':''}>Run reconciliation →</button>
  </div>`;
}

function rResults(){
  const {results,search,dir,bankFile,reconciliations,selRecon,settlStart,settlEnd}=S;
  const {bankTxns,rvTxns,matched,bankOnly,rvOnly,mode}=results;
  const recon=reconciliations.find(r=>r.reconciliationID===selRecon);
  const periodLabel=mode==='settlements'?`${settlStart} → ${settlEnd}`:(recon?`${recon.statementStartDate} → ${recon.statementEndDate}`:'');
  const rate=bankTxns.length?Math.round((matched.length/bankTxns.length)*100):0;
  const boOut=bankOnly.filter(r=>r.direction==='out').reduce((s,r)=>s+r.amount,0);
  const boIn=bankOnly.filter(r=>r.direction==='in').reduce((s,r)=>s+r.amount,0);

  const rows=filteredRows();

  const tableRows=rows.length===0
    ?`<div class="empty">No transactions match the current filter.</div>`
    :rows.map(row=>{
        const cls=row.type==='matched'?'matched':row.type==='bank_only'?'bank-only':'rv-only';
        const b=row.bank, rv=row.rv;

        // LEFT CELL — bank side
        let leftHtml;
        if(b){
          const badge=row.type==='matched'
            ?`<span class="badge badge-ok">matched</span>`
            :b.direction==='in'
              ?`<span class="badge badge-warn">bank only</span>`
              :`<span class="badge badge-warn">bank only</span>`;
          leftHtml=`
            <div class="cell-date">${fmtDate(b.date)}</div>
            <div class="cell-desc" title="${b.description}">${b.description||'—'}</div>
            <div>
              <span class="cell-amt ${b.direction}">${b.direction==='in'?'+':'−'}${fmt(b.amount)}</span>
              ${badge}
            </div>
            ${row.type==='matched'&&row.bank.matchType?`<div class="match-how">via ${row.bank.matchType}</div>`:''}`;
        }else{
          leftHtml=`<div class="cell-empty">—</div>`;
        }

        // RIGHT CELL — Rentvine side
        let rightHtml;
        if(rv){
          const badge=row.type==='matched'
            ?`<span class="badge badge-ok">matched</span>`
            :`<span class="badge badge-miss">RV only</span>`;
          const desc=rv.description||rv.reference||'—';
          const ref=rv.reference&&rv.description?`<div class="cell-date" style="margin-top:1px">${rv.reference}</div>`:'';
          rightHtml=`
            <div class="cell-date">${fmtDate(rv.date)}</div>
            <div class="cell-desc" title="${desc}">${desc}</div>
            ${ref}
            <div>
              <span class="cell-amt ${rv.direction}">${rv.direction==='in'?'+':'−'}${fmt(rv.amount)}</span>
              ${badge}
            </div>`;
        }else{
          rightHtml=`<div class="cell-empty">—</div>`;
        }

        return `<div class="recon-row ${cls}">
          <div class="cell-l">${leftHtml}</div>
          <div class="cell-r">${rightHtml}</div>
        </div>`;
      }).join('');

  return `<div class="hdr">
    <div class="logo">$</div>
    <div>
      <div class="hdr-title">ALOE RECON — ${periodLabel}</div>
      <div class="hdr-sub" style="margin-top:1px">${bankTxns.length} bank · ${rvTxns.length} Rentvine · ${mode==='settlements'?'Settlements':'Reconciliation'} · ${bankFile?.name||''}</div>
    </div>
    <div class="hdr-right"><button class="btn-sm" id="backBtn">← New run</button></div>
  </div>
  <div class="body">
    <div class="stats">
      <div class="stat"><div class="stat-n" style="color:var(--green)">${rate}%</div><div class="stat-l">Match rate</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--blue)">${matched.length}</div><div class="stat-l">Matched</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--amber)">${bankOnly.length}</div><div class="stat-l">Bank only</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--red)">${rvOnly.length}</div><div class="stat-l">Rentvine only</div></div>
    </div>

    ${boOut>0||boIn>0?`<div class="alert-row">
      ${boOut>0?`<div class="alert" style="background:var(--amber-bg);border:1px solid var(--amber-border)">
        <div class="alert-lbl" style="color:var(--amber)">⚠ Debits in bank not in Rentvine</div>
        <div class="alert-amt" style="color:var(--amber)">${fmt(boOut)}</div>
        <div class="alert-sub" style="color:#633806">Payments out with no Rentvine record</div>
      </div>`:''}
      ${boIn>0?`<div class="alert" style="background:var(--red-bg);border:1px solid var(--red-border)">
        <div class="alert-lbl" style="color:var(--red)">⚠ Credits in bank not in Rentvine</div>
        <div class="alert-amt" style="color:var(--red)">${fmt(boIn)}</div>
        <div class="alert-sub" style="color:#791F1F">Deposits with no Rentvine settlement</div>
      </div>`:''}
    </div>`:''}

    <div class="recon-wrap">
      <div class="col-hdrs">
        <div class="col-hdr left">🏦 Bank statement</div>
        <div class="col-hdr">📋 Rentvine</div>
      </div>
      <div class="filters">
        <input class="srch" id="si" placeholder="Search date, amount, description…" value="${search}"/>
        <select class="fsel" id="ds">
          <option value="all">All directions</option>
          <option value="in" ${dir==='in'?'selected':''}>Money in</option>
          <option value="out" ${dir==='out'?'selected':''}>Money out</option>
        </select>
        <span class="row-ct">${rows.length} rows</span>
      </div>
      <div class="recon-table">${tableRows}</div>
      <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:var(--surface);border:1px solid var(--border2)"></div>Matched</div>
        <div class="leg-item"><div class="leg-dot" style="background:#FAEEDA80;border:1px solid var(--amber-border)"></div>Bank only — no Rentvine record</div>
        <div class="leg-item"><div class="leg-dot" style="background:#FCEBEB80;border:1px solid var(--red-border)"></div>Rentvine only — not in bank</div>
      </div>
    </div>
  </div>`;
}

// ── EVENTS ─────────────────────────────────────────────────────────────────
function bind(){
  if(S.screen==='config'){
    document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>set({mode:b.dataset.m})));
    document.querySelectorAll('[data-r]').forEach(el=>el.addEventListener('click',()=>set({selRecon:el.dataset.r})));
    document.getElementById('ss')?.addEventListener('change',e=>set({settlStart:e.target.value}));
    document.getElementById('se')?.addEventListener('change',e=>set({settlEnd:e.target.value}));
    const drop=document.getElementById('drop'),fi=document.getElementById('fi');
    drop?.addEventListener('click',()=>fi?.click());
    drop?.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
    drop?.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop?.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');hf(e.dataTransfer.files[0]);});
    fi?.addEventListener('change',e=>hf(e.target.files[0]));
    document.getElementById('runBtn')?.addEventListener('click',runRecon);
  }
  if(S.screen==='results'){
    document.getElementById('backBtn')?.addEventListener('click',()=>set({screen:'config',results:null,search:'',dir:'all'}));
    document.getElementById('si')?.addEventListener('input',e=>set({search:e.target.value}));
    document.getElementById('ds')?.addEventListener('change',e=>set({dir:e.target.value}));
  }
}
async function hf(file){if(!file)return;const text=await file.text();set({bankFile:file,bankText:text});}

render();
loadInit();
</script>
</body>
</html>
