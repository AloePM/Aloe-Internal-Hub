<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe PM · Recon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F8FAFC;--surface:#fff;--s2:#EFF8FC;--border:#D6EEF5;--border2:#B4C3C3;
    --green:#3CC3E1;--gbg:#EAF8FC;--gborder:#3CC3E1;
    --red:#C0392B;--rbg:#FDF0EF;--rborder:#E8A09A;
    --amber:#B7770D;--abg:#FEF7E8;--aborder:#F0C36D;
    --blue:#4BB4D2;--muted:#8AA5AD;--text:#1A2E35;--text2:#4A6570;
    --teal:#3CC3E1;--teal-dk:#4BB4D2;--silver:#B4C3C3;
  }
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;font-size:14px}
  ::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

  .hdr{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-top:3px solid var(--teal)}
  .logo{width:26px;height:26px;background:var(--teal);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:'IBM Plex Mono',monospace;flex-shrink:0}
  .hdr-title{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.06em}
  .hdr-sub{font-size:11px;color:var(--muted)}
  .hdr-right{margin-left:auto}
  .btn-sm{background:none;border:1px solid var(--border2);border-radius:6px;padding:4px 11px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s}
  .btn-sm:hover{border-color:var(--text2);color:var(--text)}

  .body{padding:20px 24px;max-width:1100px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:18px;margin-bottom:14px}
  .card-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:13px}
  .info{background:var(--gbg);border:1px solid var(--teal);border-radius:7px;padding:9px 14px;font-size:12px;color:var(--teal-dk);margin-bottom:14px}
  .err{background:var(--rbg);border:1px solid var(--rborder);border-radius:7px;padding:9px 14px;font-size:12px;color:var(--red);margin-bottom:14px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field label{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  input[type=date]{background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:8px 11px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace;width:100%}
  input[type=date]:focus{outline:2px solid var(--teal);outline-offset:1px}

  .drop{border:1.5px dashed var(--border2);border-radius:8px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80px}
  .drop:hover,.drop.over,.drop.filled{border-color:var(--teal);background:var(--gbg)}
  .drop-icon{font-size:20px;margin-bottom:5px}
  .drop-title{font-size:12px;font-weight:500;margin-bottom:2px}
  .drop-sub{font-size:10px;color:var(--muted);line-height:1.4}

  .btn-run{background:var(--teal);border:none;border-radius:7px;padding:12px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;width:100%;transition:all .15s;margin-top:14px}
  .btn-run:hover{background:var(--teal-dk);opacity:1}
  .btn-run:disabled{background:var(--s2);color:var(--muted);cursor:not-allowed;border:1px solid var(--border)}

  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;gap:14px}
  .spinner{width:34px;height:34px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-msg{font-family:'IBM Plex Mono',monospace;color:var(--teal);font-size:12px;font-weight:500}
  .load-steps{display:flex;flex-direction:column;gap:4px;align-items:center}
  .load-step{font-size:11px;color:var(--muted)}
  .load-step.done{color:var(--green)}
  .load-step.active{color:var(--text);font-weight:500}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:12px 14px}
  .stat-n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;line-height:1}
  .stat-l{font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:4px}

  .alert-row{display:flex;gap:8px;margin-bottom:14px}
  .alert{flex:1;border-radius:7px;padding:11px 14px}
  .alert-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
  .alert-amt{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500}
  .alert-sub{font-size:11px;margin-top:2px}

  .recon-wrap{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .col-hdrs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--border)}
  .col-hdr{padding:9px 14px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-dk);background:var(--s2)}
  .col-hdr.left{border-right:1px solid var(--border)}
  .filters{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
  .srch{background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace;width:200px}
  .srch:focus{outline:2px solid var(--teal);outline-offset:1px}
  .fsel{background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace}
  .row-ct{margin-left:auto;font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
  .sort-dir-btn{background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;white-space:nowrap;transition:all .12s}
  .sort-dir-btn:hover{border-color:var(--teal);color:var(--teal)}
  .acct-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .acct-item{border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .15s;background:var(--bg)}
  .acct-item:hover,.acct-item.sel{border-color:var(--teal);background:var(--gbg)}
  .acct-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:3px}
  .acct-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
  .acct-item.sel .acct-name{color:var(--teal-dk)}
  .acct-sub{font-size:11px;color:var(--muted);line-height:1.4}
  .recon-table{overflow:auto;max-height:520px}

  .recon-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--border)}
  .recon-row:last-child{border-bottom:none}
  .recon-row.matched .cell-l,.recon-row.matched .cell-r{background:var(--surface)}
  .recon-row.bank-only .cell-l{background:#FAEEDA28}
  .recon-row.bank-only .cell-r{background:#FAEEDA10}
  .recon-row.rv-only .cell-l{background:#FCEBEB10}
  .recon-row.rv-only .cell-r{background:#FCEBEB28}
  .recon-row:hover .cell-l,.recon-row:hover .cell-r{filter:brightness(.97)}
  .cell-l{padding:9px 14px;border-right:1px solid var(--border);min-height:52px}
  .cell-r{padding:9px 14px;min-height:52px}
  .cell-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:2px}
  .cell-desc{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-bottom:2px}
  .cell-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:2px}
  .cell-amt{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500}
  .cell-amt.in{color:var(--teal-dk)}
  .cell-amt.out{color:var(--red)}
  .cell-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--border2);font-size:20px}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:middle;font-family:'IBM Plex Mono',monospace}
  .badge-ok{background:var(--gbg);color:var(--teal-dk);border:1px solid var(--teal)}
  .badge-warn{background:var(--abg);color:var(--amber);border:1px solid var(--aborder)}
  .badge-miss{background:var(--rbg);color:var(--red);border:1px solid var(--rborder)}
  .type-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:600;letter-spacing:.04em;margin-left:4px;vertical-align:middle;background:var(--s2);color:var(--muted);border:1px solid var(--border2);font-family:'IBM Plex Mono',monospace}
  .match-how{font-size:10px;color:var(--muted);margin-top:1px}
  .empty{padding:42px;text-align:center;color:var(--muted);font-size:13px}
  .legend{display:flex;gap:16px;padding:8px 14px;border-top:1px solid var(--border);background:var(--s2)}
  .leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
  .leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

  /* source summary pills */
  .source-pills{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .pill{padding:4px 10px;border-radius:6px;font-size:11px;font-family:'IBM Plex Mono',monospace;border:1px solid var(--border2);background:var(--surface);color:var(--text2)}
  .pill span{font-weight:500;color:var(--text)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PROXY='/api/rentvine';

let S={
  screen:'config',
  bankId:'129',
  startDate:'', endDate:'',
  bankFile:null, bankText:'',
  error:'',
  loadSteps:[],
  results:null,
  search:'', dir:'all', typeFilter:'all',
  sortBy:'status', sortDir:'asc',
};
function set(p){Object.assign(S,p);render();}

// ── API ────────────────────────────────────────────────────────────────────
async function apiFetch(path, params={}){
  const url=new URL(PROXY+path, location.origin);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const r=await fetch(url);
  if(!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}
async function fetchAllPages(path, params={}){
  let page=1, all=[];
  while(true){
    const d=await apiFetch(path, {...params, page, pageSize:200});
    const rows=Array.isArray(d)?d:(d?.data??[]);
    all=all.concat(rows);
    if(rows.length<200) break;
    page++;
  }
  return all;
}

// ── CSV ────────────────────────────────────────────────────────────────────
function pd(d){
  if(!d) return '';
  const s=String(d).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  return s;
}
function pl(line){
  const f=[];let c='',q=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"')q=!q;
    else if(line[i]===','&&!q){f.push(c.trim());c='';}
    else c+=line[i];
  }
  f.push(c.trim());return f;
}
function parseBankCSV(text){
  const lines=text.trim().split(/\r?\n/);
  const headers=pl(lines[0]);
  return lines.slice(1).map(l=>{
    const v=pl(l),r={};
    headers.forEach((h,i)=>{r[h.trim()]=(v[i]||'').replace(/^"|"$/g,'').trim();});
    return r;
  }).filter(r=>Object.values(r).some(v=>v)).map(r=>{
    const date=pd(r['Post Date']||r['Date']||'');
    const desc=(r['Description']||r['Memo']||'').trim();
    const debit=parseFloat((r['Debit']||'').replace(/[$,]/g,''))||0;
    const credit=parseFloat((r['Credit']||'').replace(/[$,]/g,''))||0;
    const amount=credit>0?credit:debit;
    if(!amount||!date) return null;
    return {date,description:desc,amount,direction:credit>0?'in':'out'};
  }).filter(Boolean);
}

// ── FETCH RV DATA ──────────────────────────────────────────────────────────
async function fetchRVTransactions(start, end){
  const step=(label,status)=>{
    const steps=S.loadSteps.map(s=>s.label===label?{...s,status}:s);
    set({loadSteps:steps});
  };

  // Run all three in parallel
  const [deps, transfers, settlements] = await Promise.all([
    fetchAllPages('/accounting/deposits',{bankAccountID:S.bankId}).catch(e=>{step('Deposits','error');return [];}),
    fetchAllPages('/accounting/bank-transfers/search',{bankAccountID:S.bankId,isVoided:0}).catch(e=>{step('Transfers','error');return [];}),
    fetchAllPages('/accounting/settlements',{bankAccountID:S.bankId}).catch(e=>{step('Settlements','error');return [];}),
  ]);

  const inRange=d=>d&&d>=start&&d<=end;
  const txns=[];

  // Deposits: money IN
  deps.forEach(row=>{
    const d=row.deposit;
    if(!d||!inRange(d.dateDeposited)) return;
    txns.push({
      id:'dep-'+d.depositID, type:'Deposit',
      direction:'in', amount:parseFloat(d.amount||0),
      date:d.dateDeposited, description:d.description||'Deposit',
      reference:d.depositNumber?'#'+d.depositNumber:'',
    });
  });

  // Bank transfers: datePosted is the correct date field
  transfers.forEach(row=>{
    const d=row.bankTransfer;
    if(!d) return;
    const date=(d.datePosted||'').slice(0,10);
    if(!inRange(date)) return;
    const isSrc=String(d.sourceBankAccountID)===S.bankId;
    const isDst=String(d.destinationBankAccountID)===S.bankId;
    if(!isSrc&&!isDst) return;
    const desc=d.description||d.reference||'Bank Transfer';
    txns.push({
      id:'xfr-'+d.bankTransferID, type:'Transfer',
      direction:isSrc?'out':'in',
      amount:parseFloat(d.amount||0),
      date, description:desc,
      reference:d.reference||'',
    });
  });

  // Settlements: ACH deposits IN (positive) or payouts OUT (negative if any)
  settlements.forEach(row=>{
    const d=row.settlement;
    if(!d||!inRange(d.settlementDate)) return;
    const raw=parseFloat(d.amount||0);
    txns.push({
      id:'set-'+d.settlementID, type:'Settlement',
      direction:raw>=0?'in':'out',
      amount:Math.abs(raw),
      date:d.settlementDate,
      description:d.bankAccountGatewaySettlementID||'ACH Settlement',
      reference:d.bankAccountGatewaySettlementID||'',
    });
  });

  return {txns, counts:{deposits:deps.filter(r=>inRange(r.deposit?.dateDeposited)).length, transfers:transfers.filter(r=>{const d=r.bankTransfer;const date=(d?.datePosted||'').slice(0,10);return inRange(date)&&(String(d?.sourceBankAccountID)===S.bankId||String(d?.destinationBankAccountID)===S.bankId);}).length, settlements:settlements.filter(r=>inRange(r.settlement?.settlementDate)).length}};
}

// ── MATCH ──────────────────────────────────────────────────────────────────
function extractAch(str){const m=(str||'').match(/ACH-([A-Z0-9]{4}-[A-Z0-9]{5})/i);return m?m[1].toUpperCase():null;}
function doMatch(bank, rv){
  const pool=rv.map(r=>({...r,matched:false}));
  const b=bank.map(x=>({...x,matched:false,rvMatch:null,matchType:null}));

  // Pass 1: ACH ID
  b.forEach(bk=>{
    if(bk.matched) return;
    const ach=extractAch(bk.description);
    if(!ach) return;
    const rv=pool.find(r=>!r.matched&&extractAch(r.reference||r.description||'')===ach);
    if(rv){bk.matched=true;bk.rvMatch=rv;bk.matchType='ACH ID';rv.matched=true;}
  });
  // Pass 2: exact amount, same direction
  b.forEach(bk=>{
    if(bk.matched) return;
    const rv=pool.find(r=>!r.matched&&r.direction===bk.direction&&Math.abs(r.amount-bk.amount)<0.02);
    if(rv){bk.matched=true;bk.rvMatch=rv;bk.matchType='Amount';rv.matched=true;}
  });
  // Pass 3: exact amount, any direction
  b.forEach(bk=>{
    if(bk.matched) return;
    const rv=pool.find(r=>!r.matched&&Math.abs(r.amount-bk.amount)<0.02);
    if(rv){bk.matched=true;bk.rvMatch=rv;bk.matchType='Amount (±dir)';rv.matched=true;}
  });

  return {matched:b.filter(x=>x.matched), bankOnly:b.filter(x=>!x.matched), rvOnly:pool.filter(r=>!r.matched)};
}

// ── HELPERS ────────────────────────────────────────────────────────────────
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
function fmtDate(d){if(!d) return '';try{const dt=new Date(d+'T12:00:00');return (dt.getMonth()+1)+'/'+dt.getDate()+'/'+dt.getFullYear();}catch(e){return d;}}

function buildRows(results){
  if(!results) return [];
  const {matched,bankOnly,rvOnly}=results;
  const rows=[];
  matched.forEach(b=>rows.push({type:'matched',bank:b,rv:b.rvMatch,matchType:b.matchType}));
  bankOnly.forEach(b=>rows.push({type:'bank_only',bank:b,rv:null}));
  rvOnly.forEach(r=>rows.push({type:'rv_only',bank:null,rv:r}));
  rows.sort((a,b)=>(a.bank?.date||a.rv?.date||'').localeCompare(b.bank?.date||b.rv?.date||''));
  return rows;
}
function filteredRows(){
  if(!S.results) return [];
  let rows=buildRows(S.results);
  const q=S.search.toLowerCase();
  if(S.dir!=='all') rows=rows.filter(r=>(r.bank?.direction||r.rv?.direction)===S.dir);
  if(S.typeFilter!=='all') rows=rows.filter(r=>r.rv?.type===S.typeFilter||r.bank?.type===S.typeFilter);
  if(q) rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));

  // Sort
  const asc=S.sortDir==='asc';
  rows.sort((a,b)=>{
    if(S.sortBy==='status'){
      // Unmatched (bank-only, rv-only) first, then matched
      const rankA=a.type==='matched'?2:1;
      const rankB=b.type==='matched'?2:1;
      if(rankA!==rankB) return asc?rankA-rankB:rankB-rankA;
      // Secondary: date asc within group
      return (a.bank?.date||a.rv?.date||'').localeCompare(b.bank?.date||b.rv?.date||'');
    }
    if(S.sortBy==='date'){
      const da=a.bank?.date||a.rv?.date||'';
      const db=b.bank?.date||b.rv?.date||'';
      return asc?da.localeCompare(db):db.localeCompare(da);
    }
    if(S.sortBy==='amount'){
      const amtA=a.bank?.amount||a.rv?.amount||0;
      const amtB=b.bank?.amount||b.rv?.amount||0;
      return asc?amtA-amtB:amtB-amtA;
    }
    return 0;
  });
  return rows;
}

// ── RUN ────────────────────────────────────────────────────────────────────
async function runRecon(){
  if(!S.bankText){set({error:'Upload your bank CSV first.'});return;}
  if(!S.startDate||!S.endDate){set({error:'Set a date range.'});return;}

  set({
    error:'', screen:'loading',
    loadSteps:[
      {label:'Deposits',status:'active'},
      {label:'Bank transfers',status:'active'},
      {label:'ACH settlements',status:'active'},
    ]
  });

  try{
    const bankTxns=parseBankCSV(S.bankText);
    if(!bankTxns.length) throw new Error('Could not parse bank CSV — needs: Post Date, Description, Debit, Credit');

    const {txns:rvTxns, counts}=await fetchRVTransactions(S.startDate, S.endDate);
    const result=doMatch(bankTxns, rvTxns);
    set({results:{bankTxns,rvTxns,counts,...result}, screen:'results', search:'', dir:'all', typeFilter:'all'});
  }catch(e){set({error:e.message, screen:'config'});}
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML=
    S.screen==='loading'?rLoad():
    S.screen==='results'?rResults():
    rConfig();
  bind();
}

function rLoad(){
  const steps=S.loadSteps.map(s=>`<div class="load-step ${s.status}">${s.status==='done'?'✓ ':s.status==='error'?'✗ ':s.status==='active'?'⟳ ':''} ${s.label}</div>`).join('');
  return `<div class="hdr"><div class="logo">A</div><span class="hdr-title">ALOE RECON</span></div>
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div class="load-msg">Fetching from Rentvine…</div>
    <div class="load-steps">${steps}</div>
  </div>`;
}

function rConfig(){
  const {startDate,endDate,bankFile,error,bankId}=S;
  // Default to current month
  const now=new Date();
  const defStart=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
  const defEnd=new Date(now.getFullYear(),now.getMonth()+1,0).toISOString().slice(0,10);

  return `<div class="hdr">
    <div class="logo">A</div>
    <span class="hdr-title">ALOE RECON</span>
    <span class="hdr-sub" style="margin-left:6px">Trust Account · Bank ↔ Rentvine</span>
  </div>
  <div class="body">
    ${error?`<div class="err">⚠ ${error}</div>`:''}
    <div class="info">✓ Connected — pulls deposits, transfers &amp; settlements from Rentvine via your Render server</div>

    <div class="card">
      <div class="card-title">1 — Bank account</div>
      <div class="acct-grid">
        <div class="acct-item ${bankId==='129'?'sel':''}" data-acct="129">
          <div class="acct-num">1000</div>
          <div class="acct-name">Rental Trust Account</div>
          <div class="acct-sub">Primary operating account · #3221</div>
        </div>
        <div class="acct-item ${bankId==='130'?'sel':''}" data-acct="130">
          <div class="acct-num">1100</div>
          <div class="acct-name">Security Deposit Account</div>
          <div class="acct-sub">Tenant security deposits</div>
        </div>
        <div class="acct-item ${bankId==='149'?'sel':''}" data-acct="149">
          <div class="acct-num">3100</div>
          <div class="acct-name">Employee Trust</div>
          <div class="acct-sub">Employee trust account</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">2 — Date range</div>
      <div class="grid2">
        <div class="field"><label>From</label><input type="date" id="sd" value="${startDate||defStart}"/></div>
        <div class="field"><label>To</label><input type="date" id="ed" value="${endDate||defEnd}"/></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">3 — Bank CSV</div>
      <div class="drop ${bankFile?'filled':''}" id="drop">
        <input type="file" id="fi" accept=".csv" style="display:none"/>
        ${bankFile
          ?`<div class="drop-title" style="color:var(--green)">✓ ${bankFile.name}</div><div class="drop-sub">Click to replace</div>`
          :`<div class="drop-icon">📄</div>
           <div class="drop-title">Drop bank CSV or click to browse</div>
           <div class="drop-sub">Enterprise Bank → Account History → Download → CSV<br>Needs: Post Date, Description, Debit, Credit</div>`}
      </div>
    </div>

    <button class="btn-run" id="runBtn" ${!bankFile?'disabled':''}>Run reconciliation →</button>
  </div>`;
}

function rResults(){
  const {results,search,dir,typeFilter,bankFile,startDate,endDate}=S;
  const {sortBy,sortDir}=S;
  const {bankTxns,rvTxns,matched,bankOnly,rvOnly,counts}=results;
  const rate=bankTxns.length?Math.round((matched.length/bankTxns.length)*100):0;
  const boOut=bankOnly.filter(r=>r.direction==='out').reduce((s,r)=>s+r.amount,0);
  const boIn=bankOnly.filter(r=>r.direction==='in').reduce((s,r)=>s+r.amount,0);
  const rows=filteredRows();

  const tableRows=rows.length===0
    ?`<div class="empty">No transactions match the current filter.</div>`
    :rows.map(row=>{
        const cls=row.type==='matched'?'matched':row.type==='bank_only'?'bank-only':'rv-only';
        const b=row.bank, rv=row.rv;

        // LEFT — bank
        let leftHtml;
        if(b){
          const badge=row.type==='matched'
            ?`<span class="badge badge-ok">matched</span>`
            :`<span class="badge badge-warn">bank only</span>`;
          leftHtml=`
            <div class="cell-date">${fmtDate(b.date)}</div>
            <div class="cell-desc" title="${b.description}">${b.description||'—'}</div>
            <div><span class="cell-amt ${b.direction}">${b.direction==='in'?'+':'−'}${fmt(b.amount)}</span>${badge}</div>
            ${row.type==='matched'?`<div class="match-how">via ${row.matchType}</div>`:''}`;
        }else{
          leftHtml=`<div class="cell-empty">—</div>`;
        }

        // RIGHT — Rentvine
        let rightHtml;
        if(rv){
          const badge=row.type==='matched'
            ?`<span class="badge badge-ok">matched</span>`
            :`<span class="badge badge-miss">RV only</span>`;
          const typeColors={'Deposit':'#4BB4D2','Transfer':'#B4C3C3','Settlement':'#3CC3E1'};
          const typeTag=`<span class="type-tag" style="border-color:${typeColors[rv.type]||'var(--border2)'};color:${typeColors[rv.type]||'var(--muted)'}">${rv.type}</span>`;
          rightHtml=`
            <div class="cell-date">${fmtDate(rv.date)}</div>
            <div class="cell-desc">${rv.description||'—'}</div>
            ${rv.reference&&rv.reference!==rv.description?`<div class="cell-sub">${rv.reference}</div>`:''}
            <div><span class="cell-amt ${rv.direction}">${rv.direction==='in'?'+':'−'}${fmt(rv.amount)}</span>${badge}${typeTag}</div>`;
        }else{
          rightHtml=`<div class="cell-empty">—</div>`;
        }

        return `<div class="recon-row ${cls}"><div class="cell-l">${leftHtml}</div><div class="cell-r">${rightHtml}</div></div>`;
      }).join('');

  return `<div class="hdr">
    <div class="logo">A</div>
    <div>
      <div class="hdr-title">ALOE RECON — ${startDate} → ${endDate}</div>
      <div class="hdr-sub" style="margin-top:1px">${{'129':'Rental Trust','130':'Security Deposit','149':'Employee Trust'}[S.bankId]||'Account '+S.bankId} · ${bankTxns.length} bank · ${rvTxns.length} RV · ${bankFile?.name||''}</div>
    </div>
    <div class="hdr-right"><button class="btn-sm" id="backBtn">← New run</button></div>
  </div>
  <div class="body">
    <div class="stats">
      <div class="stat"><div class="stat-n" style="color:var(--teal)">${rate}%</div><div class="stat-l">Match rate</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--teal-dk)">${matched.length}</div><div class="stat-l">Matched</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--amber)">${bankOnly.length}</div><div class="stat-l">Bank only</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--red)">${rvOnly.length}</div><div class="stat-l">Rentvine only</div></div>
    </div>

    <div class="source-pills">
      <div class="pill">Deposits: <span>${counts.deposits}</span></div>
      <div class="pill">Transfers: <span>${counts.transfers}</span></div>
      <div class="pill">ACH Settlements: <span>${counts.settlements}</span></div>
    </div>

    ${boOut>0||boIn>0?`<div class="alert-row">
      ${boOut>0?`<div class="alert" style="background:var(--abg);border:1px solid var(--aborder)">
        <div class="alert-lbl" style="color:var(--amber)">⚠ Debits in bank — not in Rentvine</div>
        <div class="alert-amt" style="color:var(--amber)">${fmt(boOut)}</div>
        <div class="alert-sub" style="color:#633806">Payments out with no matching RV record</div>
      </div>`:''}
      ${boIn>0?`<div class="alert" style="background:var(--rbg);border:1px solid var(--rborder)">
        <div class="alert-lbl" style="color:var(--red)">⚠ Credits in bank — not in Rentvine</div>
        <div class="alert-amt" style="color:var(--red)">${fmt(boIn)}</div>
        <div class="alert-sub" style="color:#791F1F">Deposits with no matching RV record</div>
      </div>`:''}
    </div>`:''}

    <div class="recon-wrap">
      <div class="col-hdrs">
        <div class="col-hdr left">🏦 Bank statement</div>
        <div class="col-hdr">📋 Rentvine — deposits · transfers · settlements</div>
      </div>
      <div class="filters">
        <input class="srch" id="si" placeholder="Search amount, description, ACH ID…" value="${search}"/>
        <select class="fsel" id="ds">
          <option value="all">All directions</option>
          <option value="in" ${dir==='in'?'selected':''}>Money in</option>
          <option value="out" ${dir==='out'?'selected':''}>Money out</option>
        </select>
        <select class="fsel" id="ts">
          <option value="all">All types</option>
          <option value="Deposit" ${typeFilter==='Deposit'?'selected':''}>Deposits</option>
          <option value="Transfer" ${typeFilter==='Transfer'?'selected':''}>Transfers</option>
          <option value="Settlement" ${typeFilter==='Settlement'?'selected':''}>Settlements</option>
        </select>
        <div style="width:1px;height:20px;background:var(--border2);margin:0 2px"></div>
        <select class="fsel" id="sb">
          <option value="status" ${S.sortBy==='status'?'selected':''}>Unmatched first</option>
          <option value="date" ${S.sortBy==='date'?'selected':''}>Sort by date</option>
          <option value="amount" ${S.sortBy==='amount'?'selected':''}>Sort by amount</option>
        </select>
        <button class="sort-dir-btn" id="sdir" title="Toggle sort direction">
          ${S.sortDir==='asc'?'↑ Asc':'↓ Desc'}
        </button>
        <span class="row-ct">${rows.length} rows</span>
      </div>
      <div class="recon-table">${tableRows}</div>
      <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:var(--gbg);border:1px solid var(--teal)"></div>Matched</div>
        <div class="leg-item"><div class="leg-dot" style="background:#FAEEDA80;border:1px solid var(--aborder)"></div>In bank only</div>
        <div class="leg-item"><div class="leg-dot" style="background:#FCEBEB80;border:1px solid var(--rborder)"></div>In Rentvine only</div>
      </div>
    </div>
  </div>`;
}

// ── EVENTS ─────────────────────────────────────────────────────────────────
function bind(){
  if(S.screen==='config'){
    document.querySelectorAll('[data-acct]').forEach(el=>el.addEventListener('click',()=>set({bankId:el.dataset.acct})));
    document.getElementById('sd')?.addEventListener('change',e=>set({startDate:e.target.value}));
    document.getElementById('ed')?.addEventListener('change',e=>set({endDate:e.target.value}));
    const drop=document.getElementById('drop'),fi=document.getElementById('fi');
    drop?.addEventListener('click',()=>fi?.click());
    drop?.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
    drop?.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop?.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');hf(e.dataTransfer.files[0]);});
    fi?.addEventListener('change',e=>hf(e.target.files[0]));
    document.getElementById('runBtn')?.addEventListener('click',runRecon);
  }
  if(S.screen==='results'){
    document.getElementById('backBtn')?.addEventListener('click',()=>set({screen:'config',results:null,search:'',dir:'all',typeFilter:'all',sortBy:'status',sortDir:'asc'}));
    document.getElementById('si')?.addEventListener('input',e=>set({search:e.target.value}));
    document.getElementById('ds')?.addEventListener('change',e=>set({dir:e.target.value}));
    document.getElementById('ts')?.addEventListener('change',e=>set({typeFilter:e.target.value}));
    document.getElementById('sb')?.addEventListener('change',e=>set({sortBy:e.target.value}));
    document.getElementById('sdir')?.addEventListener('click',()=>set({sortDir:S.sortDir==='asc'?'desc':'asc'}));
  }
}
async function hf(file){if(!file)return;const text=await file.text();set({bankFile:file,bankText:text});}

// Set default dates on load
const now=new Date();
S.startDate=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
S.endDate=new Date(now.getFullYear(),now.getMonth()+1,0).toISOString().slice(0,10);
render();
</script>
</body>
</html>
