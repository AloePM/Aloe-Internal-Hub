<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aloe Recon — Bank Reconciliation</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d1117;color:#e6edf3;font-family:monospace;min-height:100vh}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#0d1117}
    ::-webkit-scrollbar-thumb{background:#21262d;border-radius:3px}
    .header{background:#161b26;border-bottom:1px solid #21262d;padding:14px 20px;display:flex;align-items:center;gap:10px}
    .header h1{font-size:14px;font-weight:700;letter-spacing:.04em}
    .header p{font-size:11px;color:#8b949e;margin-top:2px}
    .body{padding:20px;max-width:680px;margin:0 auto}
    .card{background:#161b26;border:1px solid #21262d;border-radius:8px;padding:18px;margin-bottom:14px}
    .card h2{font-size:12px;font-weight:700;margin-bottom:14px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field label{display:block;font-size:10px;color:#8b949e;letter-spacing:.08em;font-weight:700;margin-bottom:5px;text-transform:uppercase}
    input[type=date],input[type=text],input[type=password]{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:9px 12px;color:#e6edf3;font-size:13px;font-family:monospace;width:100%}
    input:focus{outline:2px solid #3fb950;outline-offset:1px}
    .dropzone{border:2px dashed #21262d;border-radius:8px;padding:24px 16px;text-align:center;cursor:pointer;transition:border-color .2s}
    .dropzone.has-file{border-color:#3fb950;background:#0d1f0d}
    .dropzone .icon{font-size:24px;margin-bottom:6px}
    .dropzone .title{font-weight:700;font-size:13px;margin-bottom:4px}
    .dropzone .sub{font-size:11px;color:#8b949e}
    .dropzone .hint{font-size:10px;color:#484f58;margin-top:6px}
    .btn{background:#3fb950;border:none;border-radius:6px;padding:12px;color:#0d1117;font-size:13px;font-weight:700;cursor:pointer;font-family:monospace;letter-spacing:.02em;width:100%}
    .btn:hover{opacity:.85}
    .btn:disabled{background:#21262d;color:#484f58;cursor:not-allowed}
    .info-box{background:#0d1f0d;border:1px solid #3fb95033;border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:#8b949e}
    .info-box strong{color:#3fb950}
    .error-box{background:#1f0808;border:1px solid #f85149;border-radius:8px;padding:12px 14px;color:#f87171;font-size:12px;margin-bottom:16px}
    .what-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px}
    .what-item{display:flex;gap:8px}
    .what-item strong{color:#e6edf3}
    .what-item span{color:#8b949e}

    /* Loading */
    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}
    .spinner{width:40px;height:40px;border:3px solid #21262d;border-top-color:#3fb950;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .load-msg{color:#3fb950;font-weight:700;font-size:14px}
    .load-sub{color:#8b949e;font-size:12px}

    /* Results */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
    .stat{background:#161b26;border:1px solid #21262d;border-radius:8px;padding:14px 16px}
    .stat-num{font-size:24px;font-weight:800;font-family:monospace}
    .stat-label{font-size:11px;color:#8b949e;margin-top:3px;letter-spacing:.05em}
    .alert-row{display:flex;gap:10px;margin-bottom:14px}
    .alert{flex:1;border-radius:8px;padding:12px 16px}
    .alert-label{font-size:10px;font-weight:700;letter-spacing:.1em;margin-bottom:4px}
    .alert-amt{font-size:20px;font-weight:800}
    .alert-sub{font-size:11px;margin-top:2px}
    .results-card{background:#161b26;border:1px solid #21262d;border-radius:8px}
    .tabs{display:flex;border-bottom:1px solid #21262d;padding:0 16px}
    .tab{background:none;border:none;font-family:monospace;font-size:12px;font-weight:700;color:#8b949e;cursor:pointer;padding:12px 14px;border-bottom:2px solid transparent}
    .tab.active{color:#e6edf3;border-bottom-color:#3fb950}
    .filters{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid #21262d;align-items:center}
    .search-input{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:6px 10px;color:#e6edf3;font-size:12px;font-family:monospace;width:240px}
    .search-input:focus{outline:2px solid #3fb950;outline-offset:1px}
    .dir-select{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:6px 10px;color:#e6edf3;font-size:12px;font-family:monospace}
    .row-count{margin-left:auto;font-size:11px;color:#8b949e}
    .table-wrap{overflow-x:auto;max-height:460px;overflow-y:auto}
    table{width:100%;border-collapse:collapse;font-size:12px}
    thead{position:sticky;top:0;background:#161b26;z-index:1}
    th{padding:8px 12px;text-align:left;color:#8b949e;font-size:10px;font-weight:700;letter-spacing:.08em;border-bottom:1px solid #21262d}
    td{padding:8px 12px;border-bottom:1px solid #21262d22;vertical-align:top}
    tr:hover td{background:#21262d}
    .badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}
    .empty-msg{padding:40px 16px;text-align:center;color:#8b949e}
    .results-header{background:#161b26;border-bottom:1px solid #21262d;padding:14px 20px;display:flex;align-items:center;gap:12px}
    .back-btn{background:transparent;border:1px solid #21262d;border-radius:6px;padding:7px 14px;color:#8b949e;font-size:12px;cursor:pointer;font-family:monospace}
    .back-btn:hover{border-color:#8b949e;color:#e6edf3}
  </style>
</head>
<body>

<div id="app"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const PROXY = '/api/rentvine';

const TX_TYPE = {
  "1":"Charge","2":"Payment","3":"Transaction Fee","4":"Credit",
  "5":"Owner Contribution","6":"Owner Disbursement","7":"Bill Payment",
  "8":"Journal Entry","9":"NSF","10":"Refund"
};

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  screen: 'config', // config | loading | results
  startDate: '2026-04-01',
  endDate: '2026-04-30',
  bankFile: null,
  bankText: '',
  loadMsg: '',
  error: '',
  results: null,
  activeTab: 'unmatched',
  search: '',
  filterDir: 'all',
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ─── RENTVINE FETCH ───────────────────────────────────────────────────────────
async function rvFetch(path, params = {}) {
  const url = new URL(PROXY + path, window.location.origin);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error(`Rentvine ${path} → ${res.status} ${res.statusText}`);
  return res.json();
}

async function fetchAllPages(path, params = {}) {
  let page = 1, all = [];
  while (true) {
    const data = await rvFetch(path, { ...params, limit: 200, page });
    const rows = Array.isArray(data) ? data : (data?.data ?? []);
    all = all.concat(rows);
    if (rows.length < 200) break;
    page++;
  }
  return all;
}

async function fetchRentvineTransactions(startDate, endDate) {
  const raw = await fetchAllPages('/accounting/transactions/search', { startDate, endDate });
  return raw
    .filter(r => r.transaction?.isVoided !== '1')
    .map(r => {
      const tx = r.transaction ?? {};
      const typeId = String(tx.transactionTypeID ?? '');
      return {
        rvId: String(tx.transactionID ?? ''),
        type: TX_TYPE[typeId] ?? `Type ${typeId}`,
        typeId,
        amount: parseFloat(tx.amount ?? 0),
        date: (tx.datePosted ?? '').slice(0, 10),
        description: tx.description ?? '',
        owner: r.ledger?.name ?? '',
        property: r.property?.address ?? '',
        matched: false,
      };
    });
}

// ─── CSV PARSER ───────────────────────────────────────────────────────────────
function normalizeDate(d) {
  if (!d) return '';
  const s = String(d).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) {
    const y = m[3].length === 2 ? '20' + m[3] : m[3];
    return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  }
  return s;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const parseLine = line => {
    const fields = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') inQ = !inQ;
      else if (line[i] === ',' && !inQ) { fields.push(cur.trim()); cur = ''; }
      else cur += line[i];
    }
    fields.push(cur.trim());
    return fields;
  };
  const headers = parseLine(lines[0]);
  return lines.slice(1).map(line => {
    const vals = parseLine(line);
    const row = {};
    headers.forEach((h, i) => { row[h.trim()] = (vals[i] ?? '').replace(/^"|"$/g,'').trim(); });
    return row;
  }).filter(r => Object.values(r).some(v => v));
}

function parseBankFile(text) {
  const rows = parseCSV(text);
  return rows.map(r => {
    const date = normalizeDate(r['Post Date'] ?? r['Date'] ?? r['Transaction Date'] ?? '');
    const desc = (r['Description'] ?? r['Memo'] ?? '').trim();
    const debit = parseFloat((r['Debit'] ?? '').replace(/[$,]/g,'')) || 0;
    const credit = parseFloat((r['Credit'] ?? '').replace(/[$,]/g,'')) || 0;
    const amount = credit > 0 ? credit : debit;
    const direction = credit > 0 ? 'credit' : 'debit';
    if (!amount || !date) return null;
    return { date, description: desc, amount, direction };
  }).filter(Boolean);
}

// ─── MATCHING ─────────────────────────────────────────────────────────────────
function extractAchId(desc) {
  const m = (desc ?? '').match(/ACH-[A-Z0-9]{4}-[A-Z0-9]{5}/i);
  return m ? m[0].toUpperCase() : null;
}
function dateDiff(a, b) {
  if (!a || !b) return 999;
  return Math.abs((new Date(a) - new Date(b)) / 86400000);
}

function runMatching(bankTxns, rvTxns) {
  const pool = rvTxns.map(r => ({ ...r, matched: false }));
  const bank = bankTxns.map(b => ({ ...b, matched: false, rvMatch: null, matchType: null }));

  bank.forEach(b => {
    if (b.matched || b.direction !== 'credit') return;
    const achId = extractAchId(b.description);
    if (!achId) return;
    const rv = pool.find(r => !r.matched && r.rvId.includes(achId));
    if (rv) { b.matched = true; b.rvMatch = rv; b.matchType = 'ACH ID'; rv.matched = true; }
  });

  bank.forEach(b => {
    if (b.matched) return;
    const rv = pool.find(r => !r.matched && Math.abs(r.amount - b.amount) < 0.02 && dateDiff(r.date, b.date) <= 3);
    if (rv) { b.matched = true; b.rvMatch = rv; b.matchType = 'Amount + Date'; rv.matched = true; }
  });

  bank.forEach(b => {
    if (b.matched) return;
    const rv = pool.find(r => !r.matched && Math.abs(r.amount - b.amount) < 0.02 && dateDiff(r.date, b.date) <= 7);
    if (rv) { b.matched = true; b.rvMatch = rv; b.matchType = 'Amount (±7d)'; rv.matched = true; }
  });

  return {
    bankMatched: bank.filter(b => b.matched),
    bankUnmatched: bank.filter(b => !b.matched),
    rvUnmatched: pool.filter(r => !r.matched),
  };
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const fmt = n => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);

function badge(text, color) {
  return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${text}</span>`;
}

function getDisplayRows() {
  const { results, activeTab, search, filterDir } = state;
  if (!results) return [];
  const list = activeTab === 'unmatched' ? results.bankUnmatched
    : activeTab === 'matched' ? results.bankMatched
    : results.rvUnmatched;
  return list.filter(r => {
    if (filterDir !== 'all' && activeTab !== 'rv_missing' && r.direction !== filterDir) return false;
    if (!search) return true;
    const q = search.toLowerCase();
    return (r.description ?? '').toLowerCase().includes(q)
      || String(r.amount).includes(q)
      || (r.rvMatch?.description ?? '').toLowerCase().includes(q)
      || (r.owner ?? '').toLowerCase().includes(q)
      || (r.property ?? '').toLowerCase().includes(q);
  });
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
async function runRecon() {
  const { bankText, startDate, endDate } = state;
  if (!bankText) { setState({ error: 'Upload your bank CSV export first.' }); return; }
  setState({ error: '', screen: 'loading', loadMsg: 'Parsing bank file…' });
  try {
    const bankTxns = parseBankFile(bankText);
    if (!bankTxns.length) throw new Error('Could not parse transactions. Make sure the file is CSV with Post Date, Description, Debit, Credit columns.');

    setState({ loadMsg: `Fetching Rentvine transactions (${startDate} → ${endDate})…` });
    const rvTxns = await fetchRentvineTransactions(startDate, endDate);

    setState({ loadMsg: `Matching ${bankTxns.length} bank txns against ${rvTxns.length} Rentvine records…` });
    const matched = runMatching(bankTxns, rvTxns);
    setState({ results: { bankTxns, rvTxns, ...matched }, screen: 'results' });
  } catch (err) {
    setState({ error: err.message, screen: 'config' });
  }
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const { screen } = state;
  if (screen === 'loading') app.innerHTML = renderLoading();
  else if (screen === 'results') app.innerHTML = renderResults();
  else app.innerHTML = renderConfig();
  bindEvents();
}

function renderLoading() {
  return `
    <div class="header"><span style="font-size:20px">🏦</span><div><h1>ALOE RECON</h1><p>Bank ↔ Rentvine · Trust Account Reconciliation</p></div></div>
    <div class="loading">
      <div class="spinner"></div>
      <div class="load-msg">${state.loadMsg}</div>
      <div class="load-sub">Fetching from Rentvine & matching…</div>
    </div>`;
}

function renderConfig() {
  const { startDate, endDate, bankFile, error } = state;
  return `
    <div class="header"><span style="font-size:20px">🏦</span><div><h1>ALOE RECON</h1><p>Bank ↔ Rentvine · Trust Account Reconciliation</p></div></div>
    <div class="body">
      ${error ? `<div class="error-box">⚠ ${error}</div>` : ''}
      <div class="info-box"><strong>✓ Connected</strong> — calls Rentvine via server proxy. No credentials needed here.</div>
      <div class="card">
        <h2>📅 Statement Period</h2>
        <div class="grid2">
          <div class="field"><label>Start Date</label><input type="date" id="startDate" value="${startDate}"/></div>
          <div class="field"><label>End Date</label><input type="date" id="endDate" value="${endDate}"/></div>
        </div>
      </div>
      <div class="card">
        <h2>📂 Bank Export File</h2>
        <div class="dropzone ${bankFile ? 'has-file' : ''}" id="dropzone">
          <input type="file" id="fileInput" accept=".csv,.xls,.xlsx" style="display:none"/>
          ${bankFile ? `
            <div class="icon">✅</div>
            <div class="title" style="color:#3fb950">${bankFile.name}</div>
            <div class="sub">Click to replace</div>
          ` : `
            <div class="icon">📤</div>
            <div class="title">Drop bank export here or click to browse</div>
            <div class="sub">Export as CSV from Enterprise Bank online banking</div>
            <div class="hint">Needs columns: Post Date, Description, Debit, Credit</div>
          `}
        </div>
      </div>
      <div class="card" style="background:#0d1117;border-color:#21262d">
        <div style="font-size:10px;font-weight:700;color:#484f58;letter-spacing:.1em;margin-bottom:10px">RENTVINE DATA PULLED</div>
        <div class="what-grid">
          <div class="what-item"><span>💰</span><div><strong>Charges</strong><br><span>Rent, deposits, fees</span></div></div>
          <div class="what-item"><span>💸</span><div><strong>Payments</strong><br><span>Tenant payments received</span></div></div>
          <div class="what-item"><span>🔧</span><div><strong>Bill Payments</strong><br><span>Vendor payments out</span></div></div>
          <div class="what-item"><span>🏦</span><div><strong>Disbursements</strong><br><span>Owner payouts</span></div></div>
        </div>
      </div>
      <button class="btn" id="runBtn">RUN RECONCILIATION →</button>
    </div>`;
}

function renderResults() {
  const { results, activeTab, search, filterDir, bankFile, startDate, endDate } = state;
  const { bankTxns, rvTxns, bankMatched, bankUnmatched, rvUnmatched } = results;
  const matchRate = bankTxns.length ? ((bankMatched.length / bankTxns.length) * 100).toFixed(0) : 0;
  const unmatchedOut = bankUnmatched.filter(r => r.direction === 'debit').reduce((s,r) => s+r.amount, 0);
  const unmatchedIn = bankUnmatched.filter(r => r.direction === 'credit').reduce((s,r) => s+r.amount, 0);
  const rows = getDisplayRows();

  const tableRows = rows.length === 0
    ? `<tr><td colspan="6" class="empty-msg">${activeTab === 'unmatched' ? '🎉 All bank transactions matched!' : activeTab === 'rv_missing' ? 'All Rentvine records found in bank!' : 'No matched transactions yet.'}</td></tr>`
    : rows.map(r => {
        const dirColor = r.direction === 'credit' ? '#3fb950' : '#f85149';
        if (activeTab === 'rv_missing') {
          return `<tr>
            <td style="color:#8b949e;white-space:nowrap">${r.date}</td>
            <td style="max-width:260px;word-break:break-word;line-height:1.4">${r.description || '—'}</td>
            <td style="font-size:11px;color:#8b949e;max-width:180px"><div>${r.owner}</div><div style="font-size:10px;color:#484f58;margin-top:2px">${r.property}</div></td>
            <td style="text-align:right;font-weight:700;white-space:nowrap;color:#f0883e">−${fmt(r.amount)}</td>
            <td>${badge(r.type, '#f0883e')}</td>
          </tr>`;
        } else if (activeTab === 'matched') {
          return `<tr>
            <td style="color:#8b949e;white-space:nowrap">${r.date}</td>
            <td style="max-width:220px;word-break:break-word;line-height:1.4">${r.description || '—'}</td>
            <td style="text-align:right;font-weight:700;white-space:nowrap;color:${dirColor}">${r.direction==='debit'?'−':'+'}${fmt(r.amount)}</td>
            <td>${badge(r.direction==='credit'?'IN':'OUT', dirColor)}</td>
            <td style="font-size:11px;max-width:220px"><div style="color:#8b949e">${r.rvMatch?.description||'—'}</div>${r.rvMatch?.owner?`<div style="font-size:10px;color:#484f58;margin-top:2px">${r.rvMatch.owner}</div>`:''}</td>
            <td>${badge(r.matchType, '#58d4e7')}</td>
          </tr>`;
        } else {
          return `<tr>
            <td style="color:#8b949e;white-space:nowrap">${r.date}</td>
            <td style="max-width:300px;word-break:break-word;line-height:1.4">${r.description || '—'}</td>
            <td style="text-align:right;font-weight:700;white-space:nowrap;color:${dirColor}">${r.direction==='debit'?'−':'+'}${fmt(r.amount)}</td>
            <td>${badge(r.direction==='credit'?'IN':'OUT', dirColor)}</td>
          </tr>`;
        }
      }).join('');

  const thCols = activeTab === 'rv_missing'
    ? '<th>DATE</th><th>RENTVINE DESCRIPTION</th><th>OWNER / PROPERTY</th><th style="text-align:right">AMOUNT</th><th>TYPE</th>'
    : activeTab === 'matched'
    ? '<th>DATE</th><th>BANK DESCRIPTION</th><th style="text-align:right">AMOUNT</th><th>DIR</th><th>RENTVINE MATCH</th><th>HOW</th>'
    : '<th>DATE</th><th>BANK DESCRIPTION</th><th style="text-align:right">AMOUNT</th><th>DIR</th>';

  return `
    <div class="results-header">
      <span style="font-size:20px">🏦</span>
      <div style="flex:1">
        <div style="font-weight:700;font-size:14px">ALOE RECON — ${bankFile?.name||''}</div>
        <div style="font-size:11px;color:#8b949e;margin-top:2px">${startDate} → ${endDate} · ${bankTxns.length} bank txns · ${rvTxns.length} Rentvine records</div>
      </div>
      <button class="back-btn" id="backBtn">← New Run</button>
    </div>
    <div style="padding:16px 20px;max-width:1100px">
      <div class="stats">
        <div class="stat"><div class="stat-num" style="color:#3fb950">${matchRate}%</div><div class="stat-label">Match Rate</div></div>
        <div class="stat"><div class="stat-num" style="color:#58d4e7">${bankMatched.length}</div><div class="stat-label">Matched</div></div>
        <div class="stat"><div class="stat-num" style="color:#f0883e">${bankUnmatched.length}</div><div class="stat-label">Bank Unmatched</div></div>
        <div class="stat"><div class="stat-num" style="color:#f85149">${rvUnmatched.length}</div><div class="stat-label">Missing in Bank</div></div>
      </div>
      ${unmatchedOut > 0 || unmatchedIn > 0 ? `<div class="alert-row">
        ${unmatchedOut > 0 ? `<div class="alert" style="background:#1f1208;border:1px solid #f0883e44"><div class="alert-label" style="color:#f0883e">⚠ UNMATCHED PAYOUTS</div><div class="alert-amt" style="color:#f0883e">${fmt(unmatchedOut)}</div><div class="alert-sub" style="color:#8b949e">Debits in bank with no Rentvine record</div></div>` : ''}
        ${unmatchedIn > 0 ? `<div class="alert" style="background:#0d1f1f;border:1px solid #58d4e744"><div class="alert-label" style="color:#58d4e7">⚠ UNMATCHED DEPOSITS</div><div class="alert-amt" style="color:#58d4e7">${fmt(unmatchedIn)}</div><div class="alert-sub" style="color:#8b949e">Credits in bank with no Rentvine record</div></div>` : ''}
      </div>` : ''}
      <div class="results-card">
        <div class="tabs">
          <button class="tab ${activeTab==='unmatched'?'active':''}" data-tab="unmatched">🔶 Bank Unmatched (${bankUnmatched.length})</button>
          <button class="tab ${activeTab==='matched'?'active':''}" data-tab="matched">✅ Matched (${bankMatched.length})</button>
          <button class="tab ${activeTab==='rv_missing'?'active':''}" data-tab="rv_missing">🔴 Missing in Bank (${rvUnmatched.length})</button>
        </div>
        <div class="filters">
          <input class="search-input" id="searchInput" placeholder="Search description, owner, amount…" value="${search}"/>
          ${activeTab !== 'rv_missing' ? `<select class="dir-select" id="dirSelect"><option value="all">All</option><option value="debit" ${filterDir==='debit'?'selected':''}>Debits</option><option value="credit" ${filterDir==='credit'?'selected':''}>Credits</option></select>` : ''}
          <span class="row-count">${rows.length} rows</span>
        </div>
        <div class="table-wrap">
          <table><thead><tr>${thCols}</tr></thead><tbody>${tableRows}</tbody></table>
        </div>
      </div>
    </div>`;
}

function bindEvents() {
  const { screen } = state;
  if (screen === 'config') {
    document.getElementById('startDate')?.addEventListener('change', e => setState({ startDate: e.target.value }));
    document.getElementById('endDate')?.addEventListener('change', e => setState({ endDate: e.target.value }));
    document.getElementById('runBtn')?.addEventListener('click', runRecon);
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    dropzone?.addEventListener('click', () => fileInput?.click());
    dropzone?.addEventListener('dragover', e => e.preventDefault());
    dropzone?.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
    fileInput?.addEventListener('change', e => handleFile(e.target.files[0]));
  }
  if (screen === 'results') {
    document.getElementById('backBtn')?.addEventListener('click', () => setState({ screen: 'config', results: null }));
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => setState({ activeTab: btn.dataset.tab, search: '', filterDir: 'all' }));
    });
    document.getElementById('searchInput')?.addEventListener('input', e => setState({ search: e.target.value }));
    document.getElementById('dirSelect')?.addEventListener('change', e => setState({ filterDir: e.target.value }));
  }
}

async function handleFile(file) {
  if (!file) return;
  const text = await file.text();
  setState({ bankFile: file, bankText: text });
}

render();
</script>
</body>
</html>
