<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Activity — Aloe PM</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#1a2332;min-height:100vh;display:flex}.sidebar{width:220px;min-height:100vh;background:#F8FAFA;border-right:1px solid #E8EEEE;display:flex;flex-direction:column;padding:20px 0;flex-shrink:0}.sidebar-logo{padding:0 20px 24px;border-bottom:1px solid #E8EEEE;margin-bottom:16px}.logo-text{font-size:15px;font-weight:800}.logo-sub{font-size:11px;color:#8AA0A0}.nav-link{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;color:#4A6060;text-decoration:none}.nav-link:hover,.nav-link.active{background:#E8F8FC;color:#2A8FA6}.nav-icon{font-size:14px;width:18px}.sidebar-footer{margin-top:auto;padding:16px 20px;font-size:11px;color:#8AA0A0;border-top:1px solid #E8EEEE}.main{flex:1;display:flex;flex-direction:column}.topbar{padding:16px 28px;border-bottom:1px solid #E8EEEE;display:flex;align-items:center;justify-content:space-between}.topbar-title{font-size:18px;font-weight:700}.topbar-sub{font-size:12px;color:#8AA0A0}.content{padding:24px 28px;flex:1}.log-item{padding:12px 16px;border-radius:8px;background:#F8FAFA;border:1px solid #E8EEEE;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}.log-agent{font-size:11px;font-weight:700;color:#2A8FA6;min-width:60px}.log-text{font-size:13px;color:#1a2332;flex:1}.log-time{font-size:11px;color:#8AA0A0;white-space:nowrap}.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none}.btn-primary{background:#3CC3E1;color:#fff}</style></head>
<body><div class="sidebar"><div class="sidebar-logo"><div class="logo-text">🌿 Aloe PM</div><div class="logo-sub">Agent Hub</div></div><a href="/agents" class="nav-link"><span class="nav-icon">⬛</span>Overview</a><a href="/agents/activity" class="nav-link active"><span class="nav-icon">📋</span>Activity</a><a href="/agents/playbooks" class="nav-link"><span class="nav-icon">📝</span>Playbooks</a><a href="/agents/knowledge" class="nav-link"><span class="nav-icon">💡</span>Knowledge</a><a href="/agents/sops" class="nav-link"><span class="nav-icon">⚙️</span>SOPs</a><a href="/agents/jobs" class="nav-link"><span class="nav-icon">🕐</span>Jobs</a><a href="/agents/tools" class="nav-link"><span class="nav-icon">🛠️</span>Tools</a><div class="sidebar-footer">hub.aloepm.com</div></div>
<div class="main"><div class="topbar"><div><div class="topbar-title">Activity Feed</div><div class="topbar-sub">Recent agent actions</div></div><button class="btn btn-primary" onclick="load()">↺ Refresh</button></div>
<div class="content"><div id="log"><div style="color:#8AA0A0;font-size:13px">Loading...</div></div></div></div>
<script>async function load(){try{const r=await fetch('/api/agents/activity');const d=await r.json();const items=d.entries||d||[];if(!items.length){document.getElementById('log').innerHTML='<div style="color:#8AA0A0;font-size:13px">No activity yet.</div>';return;}document.getElementById('log').innerHTML=items.slice(0,50).map(e=>'<div class="log-item"><div class="log-agent">'+(e.agent||'?')+'</div><div class="log-text">'+(e.text||e.message||'')+'</div><div class="log-time">'+(e.time||e.timestamp||'')+'</div></div>').join('');}catch(e){document.getElementById('log').innerHTML='<div style="color:#EF4444">Error loading.</div>';}}load();setInterval(load,15000);</script></body></html>
