<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe PM — KPI Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --teal:#3CC3E1;--teal2:#2aa8c4;--teal-dim:rgba(60,195,225,0.08);
  --silver:#B4C3C3;--ink:#0d1a1a;--ink2:#243030;--ink3:#3a5050;
  --muted:#6b8585;--ghost:#94acac;--rule:rgba(180,200,200,0.18);
  --bg:#f4f7f7;--card:#ffffff;--card2:#f9fbfb;
  --green:#0fa86c;--green-d:#dcf5ec;
  --red:#e03e3e;--red-d:#fde8e8;
  --amber:#d4820a;--amber-d:#fef3dc;
  --blue:#2563eb;--blue-d:#dbeafe;
  --purple:#7c3aed;--purple-d:#ede9fe;
  --r:12px;--r2:8px;
}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:14px;line-height:1.5}
.topbar{background:var(--ink);color:#fff;padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:9px}
.logo-mark{width:28px;height:28px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink);letter-spacing:-0.5px}
.logo-name{font-weight:600;font-size:14px;color:#fff}
.logo-sep{color:rgba(255,255,255,0.2);font-size:16px}
.logo-page{font-size:13px;color:rgba(255,255,255,0.55);font-weight:400}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--teal);font-weight:500;font-family:'DM Mono',monospace}
.live-dot{width:5px;height:5px;background:var(--teal);border-radius:50%;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-ghost{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.12)}
.btn-ghost:hover{background:rgba(255,255,255,0.14);color:#fff}
.btn-teal{background:var(--teal);color:var(--ink);font-weight:600}
.btn-teal:hover{background:#4bd4f5}
.nav{background:var(--card);border-bottom:1px solid var(--rule);padding:0 28px;display:flex;gap:2px;overflow-x:auto}
.nav::-webkit-scrollbar{display:none}
.tab{padding:13px 16px;font-size:13px;font-weight:500;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--teal2);border-bottom-color:var(--teal);font-weight:600}
.tab:hover:not(.active){color:var(--ink2)}
.tab-icon{font-size:14px}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.spinner{width:32px;height:32px;border:2px solid var(--rule);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted)}
.error-wrap{margin:24px 28px;padding:14px 18px;background:var(--red-d);border:1px solid #fca5a5;border-radius:var(--r2);color:var(--red);font-size:13px}
.main{padding:24px 28px;max-width:1400px;margin:0 auto}
.page-header{margin-bottom:20px}
.page-title{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.4px}
.page-sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.kpi-grid{display:grid;gap:10px;margin-bottom:16px}
.kpi-grid.g3{grid-template-columns:repeat(3,1fr)}
.kpi-grid.g4{grid-template-columns:repeat(4,1fr)}
.kpi-grid.g5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.kpi-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kpi-value{font-size:30px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-0.03em}
.kpi-sub{font-size:11px;color:var(--ghost);margin-top:5px;font-family:'DM Mono',monospace}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:1fr 1fr 1fr}
.g-13{grid-template-columns:1.6fr 1fr}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.card-title-bar{width:3px;height:13px;border-radius:2px;flex-shrink:0}
.chart-wrap{position:relative}
.trend-section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.trend-section-label::after{content:'';flex:1;height:1px;background:var(--rule)}
.trend-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px}
.trend-card-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.trend-card-label-bar{width:3px;height:11px;border-radius:2px;flex-shrink:0}
.trend-card-value{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-0.03em;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-row-label{font-size:12px;color:var(--ink2);font-weight:500;width:160px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row-track{flex:1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.bar-row-fill{height:6px;border-radius:3px}
.bar-row-count{font-size:12px;font-weight:700;color:var(--ink);width:36px;text-align:right;flex-shrink:0;font-family:'DM Mono',monospace}
.legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.legend-item{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;font-weight:500}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.stat-row:last-child{border-bottom:none}
.stat-row-label{font-size:13px;color:var(--ink3)}
.stat-row-value{font-size:13px;font-weight:700;color:var(--ink);font-family:'DM Mono',monospace}
.occ-bar{height:18px;border-radius:9px;overflow:hidden;display:flex;margin:12px 0}
.occ-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.insp-wrap{display:flex;align-items:center;gap:20px}
.insp-ring{position:relative;flex-shrink:0}
.insp-ring svg{transform:rotate(-90deg)}
.insp-ring-bg{fill:none;stroke:var(--card2)}
.insp-ring-fill{fill:none;stroke-linecap:round}
.insp-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink)}
.insp-legend{flex:1}
.insp-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.insp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.insp-label{font-size:12px;color:var(--ink2)}
.insp-num{font-size:14px;font-weight:700;color:var(--ink);margin-left:auto;font-family:'DM Mono',monospace}
.data-note{margin-top:24px;padding:11px 16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r2);font-size:11px;color:var(--ghost);display:flex;gap:16px;font-family:'DM Mono',monospace;flex-wrap:wrap}
@media(max-width:900px){
  .kpi-grid.g5,.kpi-grid.g4{grid-template-columns:repeat(2,1fr)}
  .kpi-grid.g3{grid-template-columns:repeat(2,1fr)}
  .grid.g-2,.grid.g-3,.grid.g-13{grid-template-columns:1fr}
  .main{padding:16px}
  .topbar,.nav{padding:0 16px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <div class="logo-mark">A</div>
      <span class="logo-name">Aloe PM</span>
      <span class="logo-sep">·</span>
      <span class="logo-page">KPI Dashboard</span>
    </div>
    <div class="live-badge" id="live-badge" style="display:none">
      <span class="live-dot"></span>
      <span id="live-time">Live</span>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn btn-ghost" onclick="window.location.href='/'">← Hub</button>
    <button class="btn btn-teal" id="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</div>

<div class="nav">
  <button class="tab active" data-tab="trends" onclick="switchTab('trends')"><span class="tab-icon">📈</span>Trends</button>
  <button class="tab" data-tab="overview" onclick="switchTab('overview')"><span class="tab-icon">📊</span>Overview</button>
  <button class="tab" data-tab="occupancy" onclick="switchTab('occupancy')"><span class="tab-icon">🏠</span>Occupancy</button>
  <button class="tab" data-tab="leasing" onclick="switchTab('leasing')"><span class="tab-icon">📋</span>Leasing</button>
  <button class="tab" data-tab="pipeline" onclick="switchTab('pipeline')"><span class="tab-icon">🎯</span>Owner Pipeline</button>
  <button class="tab" data-tab="portfolio" onclick="switchTab('portfolio')"><span class="tab-icon">🏢</span>Portfolio Growth</button>
  <button class="tab" data-tab="maintenance" onclick="switchTab('maintenance')"><span class="tab-icon">🔧</span>Maintenance</button>
  <button class="tab" data-tab="retention" onclick="switchTab('retention')"><span class="tab-icon">🔄</span>Retention</button>
</div>

<div id="loading" class="loading-wrap">
  <div class="spinner"></div>
  <div class="loading-text">Loading live data from Rentvine + Aptly…</div>
</div>
<div id="error" class="error-wrap" style="display:none"></div>
<div id="app" style="display:none"></div>

<script>
let D = null, charts = {};
const C = { TEAL:'#3CC3E1',TEAL2:'#2aa8c4',GREEN:'#0fa86c',RED:'#e03e3e',AMBER:'#d4820a',BLUE:'#2563eb',PURPLE:'#7c3aed',GRAY:'#94acac' };
const CD = { responsive:true,maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{backgroundColor:'#0d1a1a',titleColor:'#fff',bodyColor:'rgba(255,255,255,0.7)',borderColor:'rgba(255,255,255,0.08)',borderWidth:1,padding:10,cornerRadius:8,mode:'index',intersect:false}} };

function mkBar(id, labels, datasets, h=160) {
  const el=document.getElementById(id); if(!el)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:datasets.map(d=>({...d,borderRadius:4,borderSkipped:false}))},options:{...CD,scales:{x:{ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{display:false},border:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{color:'rgba(180,200,200,0.12)'},border:{display:false}}}}});
  el.parentElement.style.height=h+'px';
}
function mkLine(id, labels, datasets, h=160) {
  const el=document.getElementById(id); if(!el)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(el,{type:'line',data:{labels,datasets:datasets.map(d=>({...d,borderWidth:2.5,pointRadius:3,pointHoverRadius:5,tension:0.35,fill:true,backgroundColor:d.borderColor+'14'}))},options:{...CD,scales:{x:{ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{display:false},border:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{color:'rgba(180,200,200,0.12)'},border:{display:false}}}}});
  el.parentElement.style.height=h+'px';
}
function mkBarColored(id, labels, data, colors, h=160) {
  const el=document.getElementById(id); if(!el)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:4,borderSkipped:false}]},options:{...CD,scales:{x:{ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{display:false},border:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{color:'rgba(180,200,200,0.12)'},border:{display:false}}}}});
  el.parentElement.style.height=h+'px';
}

const sm = yyyymm => { if(!yyyymm)return''; const[y,m]=yyyymm.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)-1]+' \''+y.slice(2); };
const fmt = (n,pre='',suf='') => n==null?'—':pre+Number(n).toLocaleString()+suf;
const sum = arr => (arr||[]).reduce((a,b)=>a+b,0);
const kpi = (label,value,sub,color) => `<div class="kpi"><div class="kpi-accent" style="background:${color}"></div><div class="kpi-label">${label}</div><div class="kpi-value">${value??'—'}</div>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`;
const statRow = (l,v) => `<div class="stat-row"><span class="stat-row-label">${l}</span><span class="stat-row-value">${v}</span></div>`;
const barRows = (items,color) => { if(!items||!items.length)return'<div style="color:var(--ghost);font-size:12px;padding:8px 0">No data</div>'; const max=Math.max(...items.map(i=>i.count||i.value||0),1); return items.slice(0,8).map(i=>`<div class="bar-row"><div class="bar-row-label" title="${i.reason||i.source||i.stage||i.label||'?'}">${i.reason||i.source||i.stage||i.label||'?'}</div><div class="bar-row-track"><div class="bar-row-fill" style="width:${Math.round(((i.count||i.value||0)/max)*100)}%;background:${color}"></div></div><div class="bar-row-count">${i.count||i.value||0}</div></div>`).join(''); };

// ─── TRENDS TAB ──────────────────────────────────────────────────────────────
function renderTrends() {
  const p=D.portfolio, l=D.leases, pipe=D.pipeline, em=D.endManagement, app=D.applications;
  const labels=(l.moveInsByMonth||[]).map(x=>sm(x.month));
  const moveIns=(l.moveInsByMonth||[]).map(x=>x.value);
  const moveOuts=(l.moveOutsByMonth||[]).map(x=>x.value);
  const expirations=(l.expirationsByMonth||[]).map(x=>x.value);
  const newLeads=(pipe.newLeadsByMonth||[]).map(x=>x.value);
  const signed=(pipe.signedByMonth||[]).map(x=>x.value);
  const endMgmt=(em.byMonth||[]).map(x=>x.value);
  const appsTotal=(app.byMonth||[]).map(x=>x.value);
  const appsApproved=(app.approvedByMonth||[]).map(x=>x.value);
  const propTrend=p.propTrend||[];
  const propLabels=propTrend.map(x=>sm(x.month));
  const propTotals=propTrend.map(x=>x.total);
  const propGained=propTrend.map(x=>x.gained);
  const netGrowth=signed.map((s,i)=>s-(endMgmt[i]||0));
  const netColors=netGrowth.map(v=>v>=0?C.GREEN+'cc':C.RED+'cc');

  document.getElementById('app').innerHTML=`
  <div class="main">
    <div class="page-header">
      <div class="page-title">Rolling 12-Month Trends</div>
      <div class="page-sub">All key metrics at a glance · ${labels[0]||''} → ${labels[labels.length-1]||''}</div>
    </div>

    <div class="trend-section-label">🏠 Resident Activity</div>
    <div class="grid g-3">
      <div class="trend-card">
        <div class="trend-card-label"><div class="trend-card-label-bar" style="background:${C.TEAL}"></div>Move-Ins</div>
        <div class="trend-card-value">${sum(moveIns)} <span style="font-size:13px;font-weight:400;color:var(--muted)">last 12 mo</span></div>
        <div class="chart-wrap" style="height:130px"><canvas id="tr-movein"></canvas></div>
      </div>
      <div class="trend-card">
        <div class="trend-card-label"><div class="trend-card-label-bar" style="background:${C.GRAY}"></div>Move-Outs</div>
        <div class="trend-card-value">${sum(moveOuts)} <span style="font-size:13px;font-weight:400;color:var(--muted)">last 12 mo</span></div>
        <div class="chart-wrap" style="height:130px"><canvas id="tr-moveout"></canvas></div>
      </div>
      <div class="trend-card">
        <div class="trend-card-label"><div class="trend-card-label-bar" style="background:${C.AMBER}"></div>Lease Expirations</div>
        <div class="trend-card-value">${sum(expirations)} <span style="font-size:13px;font-weight:400;color:var(--muted)">last 12 mo</span></div>
        <div class="chart-wrap" style="height:130px"><canvas id="tr-expiry"></canvas></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:${C.TEAL2}"></div>Move-Ins vs Move-Outs vs Expirations — Combined</div></div>
      <div class="chart-wrap" style="height:200px"><canvas id="tr-move-combined"></canvas></div>
      <div class="legend" style="margin-top:10px">
        <div class="legend-item"><div class="legend-dot" style="background:${C.TEAL}"></div>Move-Ins</div>
        <div class="legend-item"><div class="legend-dot" style="background:${C.GRAY}"></div>Move-Outs</div>
        <div class="legend-item"><div class="legend-dot" style="background:${C.AMBER}"></div>Expirations</div>
      </div>
    </div>

    <div class="trend-section-label">🎯 Owner Pipeline</div>
    <div class="grid g-3">
      <div class="trend-card">
        <div class="trend-card-label"><div class="trend-card-label-bar" style="background:${C.PURPLE}"></div>New Leads</div>
        <div class="trend-card-value">${sum(newLeads)} <span style="font-size:13px;font-weight:400;color:var(--muted)">last 12 mo</span></div>
        <div class="chart-wrap" style="height:130px"><canvas id="tr-leads"></canvas></div>
      </div>
      <div class="trend-card">
        <div class="trend-card-label"><div class="trend-card-label-bar" style="background:${C.GREEN}"></div>PMA Signed</div>
        <div class="trend-card-value">${sum(signed)} <span style="font-size:13px;font-weight:400;color:var(--muted)">last 12 mo</span></div>
        <div class="chart-wrap" style="height:130px"><canvas id="tr-signed"></canvas></div>
      </div>
      <div class="trend-card">
        <div class="trend-card-label"><div class="trend-card-label-bar" style="background:${C.RED}"></div>End Management</div>
        <div class="trend-card-value">${sum(endMgmt)} <span style="font-size:13px;font-weight:400;color:var(--muted)">last 12 mo</span></div>
        <div class="chart-wrap" style="height:130px"><canvas id="tr-end"></canvas></div>
      </div>
    </div>
    <div class="grid g-2" style="margin-bottom:14px">
      <div class="card">
        <div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:${C.PURPLE}"></div>Leads vs Signed vs Ended</div></div>
        <div class="chart-wrap" style="height:180px"><canvas id="tr-pipe-combined"></canvas></div>
        <div class="legend" style="margin-top:10px">
          <div class="legend-item"><div class="legend-dot" style="background:${C.PURPLE}"></div>New Leads</div>
          <div class="legend-item"><div class="legend-dot" style="background:${C.GREEN}"></div>PMA Signed</div>
          <div class="legend-item"><div class="legend-dot" style="background:${C.RED}"></div>End Management</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:${C.GREEN}"></div>Net Owner Growth (Signed − Ended)</div><span style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace">green=growing · red=shrinking</span></div>
        <div class="chart-wrap" style="height:180px"><canvas id="tr-net"></canvas></div>
      </div>
    </div>

    <div class="trend-section-label">🏢 Portfolio Size</div>
    <div class="grid g-2" style="margin-bottom:14px">
      <div class="card">
        <div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:${C.TEAL2}"></div>Properties Added — Monthly</div></div>
        <div class="chart-wrap" style="height:160px"><canvas id="tr-prop-gained"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:${C.TEAL2}"></div>Portfolio Total — Running Count</div></div>
        <div class="chart-wrap" style="height:160px"><canvas id="tr-prop-total"></canvas></div>
      </div>
    </div>

    <div class="trend-section-label">📋 Leasing Activity</div>
    <div class="card" style="margin-bottom:14px">
      <div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:${C.TEAL2}"></div>Applications Received vs Approved</div></div>
      <div class="chart-wrap" style="height:180px"><canvas id="tr-apps"></canvas></div>
      <div class="legend" style="margin-top:10px">

let activeTab='trends';
function switchTab(id){
  activeTab=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  if(D)TABS[id]();
}

async function loadData() {
  document.getElementById('loading').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('error').style.display='none';
  document.getElementById('live-badge').style.display='none';
  document.getElementById('refresh-btn').textContent='↻ Loading…';
  document.getElementById('refresh-btn').disabled=true;
  try {
    const r=await fetch('/api/metrics');
    if(!r.ok)throw new Error(`Server error ${r.status}: ${await r.text()}`);
    D=await r.json();
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('live-badge').style.display='flex';
    document.getElementById('live-time').textContent='Live · '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});
    charts={};
    TABS[activeTab]();
  } catch(e) {
    document.getElementById('loading').style.display='none';
    const errEl=document.getElementById('error');
    errEl.style.display='block';
    errEl.innerHTML=`⚠ Failed to load metrics: ${e.message}<br><small style="opacity:.7">Make sure /api/metrics is deployed. Visit <a href="/api/metrics/debug" target="_blank" style="color:var(--red)">/api/metrics/debug</a> to check board field names.</small>`;
  } finally {
    document.getElementById('refresh-btn').textContent='↻ Refresh';
    document.getElementById('refresh-btn').disabled=false;
  }
}
loadData();
</script>
</body>
</html>
