<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe PM - KPI Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --teal:#3CC3E1;--teal2:#2aa8c4;--teal-dim:rgba(60,195,225,0.08);
  --silver:#B4C3C3;--ink:#0d1a1a;--ink2:#243030;--ink3:#3a5050;
  --muted:#6b8585;--ghost:#94acac;--rule:rgba(180,200,200,0.18);
  --bg:#f4f7f7;--card:#ffffff;--card2:#f9fbfb;
  --green:#0fa86c;--green-d:#dcf5ec;
  --red:#e03e3e;--red-d:#fde8e8;
  --amber:#d4820a;--amber-d:#fef3dc;
  --blue:#2563eb;--blue-d:#dbeafe;
  --purple:#7c3aed;--purple-d:#ede9fe;
  --r:12px;--r2:8px;
}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:14px;line-height:1.5}
.topbar{background:var(--ink);color:#fff;padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:9px}
.logo-mark{width:28px;height:28px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink)}
.logo-name{font-weight:600;font-size:14px;color:#fff}
.logo-sep{color:rgba(255,255,255,0.2);font-size:16px}
.logo-page{font-size:13px;color:rgba(255,255,255,0.55);font-weight:400}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--teal);font-weight:500;font-family:'DM Mono',monospace}
.live-dot{width:5px;height:5px;background:var(--teal);border-radius:50%;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-ghost{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.12)}
.btn-ghost:hover{background:rgba(255,255,255,0.14);color:#fff}
.btn-teal{background:var(--teal);color:var(--ink);font-weight:600}
.btn-teal:hover{background:#4bd4f5}
.nav{background:var(--card);border-bottom:1px solid var(--rule);padding:0 28px;display:flex;gap:2px;overflow-x:auto}
.nav::-webkit-scrollbar{display:none}
.tab{padding:13px 16px;font-size:13px;font-weight:500;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--teal2);border-bottom-color:var(--teal);font-weight:600}
.tab:hover:not(.active){color:var(--ink2)}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.spinner{width:32px;height:32px;border:2px solid var(--rule);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted)}
.error-wrap{margin:24px 28px;padding:14px 18px;background:var(--red-d);border:1px solid #fca5a5;border-radius:var(--r2);color:var(--red);font-size:13px}
.main{padding:24px 28px;max-width:1400px;margin:0 auto}
.page-header{margin-bottom:20px}
.page-title{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.4px}
.page-sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.kpi-grid{display:grid;gap:10px;margin-bottom:16px}
.kpi-grid.g3{grid-template-columns:repeat(3,1fr)}
.kpi-grid.g4{grid-template-columns:repeat(4,1fr)}
.kpi-grid.g5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.kpi-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kpi-value{font-size:30px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-0.03em}
.kpi-sub{font-size:11px;color:var(--ghost);margin-top:5px;font-family:'DM Mono',monospace}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:1fr 1fr 1fr}
.g-13{grid-template-columns:1.6fr 1fr}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.card-title-bar{width:3px;height:13px;border-radius:2px;flex-shrink:0}
.chart-wrap{position:relative}
.trend-section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.trend-section-label::after{content:'';flex:1;height:1px;background:var(--rule)}
.trend-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px}
.trend-card-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.trend-card-label-bar{width:3px;height:11px;border-radius:2px;flex-shrink:0}
.trend-card-value{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-0.03em;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-row-label{font-size:12px;color:var(--ink2);font-weight:500;width:160px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row-track{flex:1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.bar-row-fill{height:6px;border-radius:3px}
.bar-row-count{font-size:12px;font-weight:700;color:var(--ink);width:36px;text-align:right;flex-shrink:0;font-family:'DM Mono',monospace}
.legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.legend-item{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;font-weight:500}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.stat-row:last-child{border-bottom:none}
.stat-row-label{font-size:13px;color:var(--ink3)}
.stat-row-value{font-size:13px;font-weight:700;color:var(--ink);font-family:'DM Mono',monospace}
.occ-bar{height:18px;border-radius:9px;overflow:hidden;display:flex;margin:12px 0}
.occ-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.insp-wrap{display:flex;align-items:center;gap:20px}
.insp-ring{position:relative;flex-shrink:0}
.insp-ring svg{transform:rotate(-90deg)}
.insp-ring-bg{fill:none;stroke:var(--card2)}
.insp-ring-fill{fill:none;stroke-linecap:round}
.insp-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink)}
.insp-legend{flex:1}
.insp-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.insp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.insp-label{font-size:12px;color:var(--ink2)}
.insp-num{font-size:14px;font-weight:700;color:var(--ink);margin-left:auto;font-family:'DM Mono',monospace}
.detail-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 12px;background:var(--card2);border:1px solid var(--rule);border-radius:8px;margin-top:10px;font-size:12px;font-weight:600;color:var(--ink2);user-select:none}
.detail-toggle:hover{background:#eef2f2}
.detail-list{display:none;margin-top:6px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;max-height:320px;overflow-y:auto}
.detail-list.open{display:block}
.detail-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 12px;font-size:12px;border-bottom:1px solid var(--rule)}
.detail-row:last-child{border-bottom:none}
.detail-row:nth-child(even){background:var(--card2)}
.detail-addr{color:var(--ink2);font-weight:500}
.detail-city{color:var(--muted);font-size:11px}
.detail-meta{color:var(--muted);font-size:11px;text-align:right;font-family:'DM Mono',monospace}
.detail-rent{font-weight:700;color:var(--ink);font-family:'DM Mono',monospace;text-align:right}
.detail-header{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:6px 12px;background:var(--ink);font-size:10px;font-weight:600;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:.06em}
.data-note{margin-top:24px;padding:11px 16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r2);font-size:11px;color:var(--ghost);display:flex;gap:16px;font-family:'DM Mono',monospace;flex-wrap:wrap}
@media(max-width:900px){
  .kpi-grid.g5,.kpi-grid.g4{grid-template-columns:repeat(2,1fr)}
  .kpi-grid.g3{grid-template-columns:repeat(2,1fr)}
  .grid.g-2,.grid.g-3,.grid.g-13{grid-template-columns:1fr}
  .main{padding:16px}
  .topbar,.nav{padding:0 16px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <div class="logo-mark">A</div>
      <span class="logo-name">Aloe PM</span>
      <span class="logo-sep">|</span>
      <span class="logo-page">KPI Dashboard</span>
    </div>
    <div class="live-badge" id="live-badge" style="display:none">
      <span class="live-dot"></span>
      <span id="live-time">Live</span>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn btn-ghost" onclick="window.location.href='/'">Back to Hub</button>
    <button class="btn btn-teal" id="refresh-btn" onclick="loadData()">Refresh</button>
    <button class="btn btn-ghost" id="force-btn" onclick="forceRefresh()">Live Refresh</button>
  </div>
</div>

<div class="nav">
  <button class="tab active" data-tab="trends" onclick="switchTab('trends')">Trends</button>
  <button class="tab" data-tab="overview" onclick="switchTab('overview')">Overview</button>
  <button class="tab" data-tab="occupancy" onclick="switchTab('occupancy')">Occupancy</button>
  <button class="tab" data-tab="leasing" onclick="switchTab('leasing')">Leasing</button>
  <button class="tab" data-tab="pipeline" onclick="switchTab('pipeline')">Owner Pipeline</button>
  <button class="tab" data-tab="renewals" onclick="switchTab('renewals')">Renewals</button>
  <button class="tab" data-tab="portfolio" onclick="switchTab('portfolio')">Portfolio Growth</button>
  <button class="tab" data-tab="maintenance" onclick="switchTab('maintenance')">Maintenance</button>
  <button class="tab" data-tab="retention" onclick="switchTab('retention')">Retention</button>
</div>

<div id="loading" class="loading-wrap">
  <div class="spinner"></div>
  <div class="loading-text">Loading data from Rentvine + Aptly...</div>
</div>
<div id="error" class="error-wrap" style="display:none"></div>
<div id="app" style="display:none"></div>

<script>
var D = null;
var charts = {};

var C = {
  TEAL:'#3CC3E1', TEAL2:'#2aa8c4',
  GREEN:'#0fa86c', RED:'#e03e3e',
  AMBER:'#d4820a', BLUE:'#2563eb',
  PURPLE:'#7c3aed', GRAY:'#94acac'
};

var MO_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function sm(yyyymm) {
  if (!yyyymm) return '';
  var parts = yyyymm.split('-');
  return MO_NAMES[parseInt(parts[1])-1] + " '" + parts[0].slice(2);
}

function fmt(n, pre, suf) {
  pre = pre || '';
  suf = suf || '';
  if (n == null) return '--';
  return pre + Number(n).toLocaleString() + suf;
}

function sum(arr) {
  return (arr || []).reduce(function(a,b){return a+b;}, 0);
}

function kpi(label, value, sub, color) {
  return '<div class="kpi"><div class="kpi-accent" style="background:'+color+'"></div>' +
    '<div class="kpi-label">'+label+'</div>' +
    '<div class="kpi-value">'+(value != null ? value : '--')+'</div>' +
    (sub ? '<div class="kpi-sub">'+sub+'</div>' : '') +
    '</div>';
}

function statRow(l, v) {
  return '<div class="stat-row"><span class="stat-row-label">'+l+'</span><span class="stat-row-value">'+v+'</span></div>';
}

function barRows(items, color) {
  if (!items || !items.length) return '<div style="color:var(--ghost);font-size:12px;padding:8px 0">No data</div>';
  var max = Math.max.apply(null, items.map(function(i){return i.count||i.value||0;}).concat([1]));
  return items.slice(0,8).map(function(i) {
    var label = i.reason || i.source || i.stage || i.label || '?';
    var count = i.count || i.value || 0;
    var pct = Math.round((count/max)*100);
    return '<div class="bar-row">' +
      '<div class="bar-row-label" title="'+label+'">'+label+'</div>' +
      '<div class="bar-row-track"><div class="bar-row-fill" style="width:'+pct+'%;background:'+color+'"></div></div>' +
      '<div class="bar-row-count">'+count+'</div>' +
    '</div>';
  }).join('');
}

function detailToggle(id, count) {
  return '<div class="detail-toggle" onclick="toggleDetail(\''+id+'\')">' +
    '<span>Show '+count+' properties</span><span>v</span>' +
  '</div>' +
  '<div class="detail-list" id="dl-'+id+'"></div>';
}

function toggleDetail(id) {
  var el = document.getElementById('dl-'+id);
  if (!el) return;
  el.classList.toggle('open');
}

function fillDetail(id, items) {
  var el = document.getElementById('dl-'+id);
  if (!el || !items || !items.length) return;
  var html = '<div class="detail-header"><span>Address</span><span>Info</span><span>Rent</span></div>';
  items.forEach(function(r) {
    html += '<div class="detail-row">' +
      '<div><div class="detail-addr">'+(r.address||'--')+'</div>' +
      '<div class="detail-city">'+(r.city||'')+'</div></div>' +
      '<div class="detail-meta">'+(r.meta||'')+'</div>' +
      '<div class="detail-rent">'+(r.rent?'$'+Number(r.rent).toLocaleString():'--')+'</div>' +
    '</div>';
  });
  el.innerHTML = html;
}

var CD = {
  responsive: true, maintainAspectRatio: false,
  plugins: {
    legend: {display:false},
    tooltip: {backgroundColor:'#0d1a1a',titleColor:'#fff',bodyColor:'rgba(255,255,255,0.7)',padding:10,cornerRadius:8,mode:'index',intersect:false}
  }
};

function mkBar(id, labels, datasets, h) {
  h = h || 160;
  var el = document.getElementById(id);
  if (!el) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, {
    type: 'bar',
    data: {labels: labels, datasets: datasets.map(function(d) {
      return Object.assign({}, d, {borderRadius:4, borderSkipped:false});
    })},
    options: Object.assign({}, CD, {scales:{
      x:{ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{display:false},border:{display:false}},
      y:{beginAtZero:true,ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{color:'rgba(180,200,200,0.12)'},border:{display:false}}
    }})
  });
  el.parentElement.style.height = h + 'px';
}

function mkBarColored(id, labels, data, colors, h) {
  h = h || 160;
  var el = document.getElementById(id);
  if (!el) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, {
    type: 'bar',
    data: {labels: labels, datasets: [{data:data, backgroundColor:colors, borderRadius:4, borderSkipped:false}]},
    options: Object.assign({}, CD, {scales:{
      x:{ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{display:false},border:{display:false}},
      y:{beginAtZero:true,ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{color:'rgba(180,200,200,0.12)'},border:{display:false}}
    }})
  });
  el.parentElement.style.height = h + 'px';
}

function mkLine(id, labels, datasets, h) {
  h = h || 160;
  var el = document.getElementById(id);
  if (!el) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, {
    type: 'line',
    data: {labels: labels, datasets: datasets.map(function(d) {
      return Object.assign({}, d, {borderWidth:2.5, pointRadius:3, pointHoverRadius:5, tension:0.35, fill:true, backgroundColor:d.borderColor+'14'});
    })},
    options: Object.assign({}, CD, {scales:{
      x:{ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{display:false},border:{display:false}},
      y:{beginAtZero:true,ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'},grid:{color:'rgba(180,200,200,0.12)'},border:{display:false}}
    }})
  });
  el.parentElement.style.height = h + 'px';
}

// ---- TRENDS TAB ----
function renderTrends() {
  var p=D.portfolio, l=D.leases, pipe=D.pipeline, em=D.endManagement, app=D.applications;
  var labels=(l.moveInsByMonth||[]).map(function(x){return sm(x.month);});
  var moveIns=(l.moveInsByMonth||[]).map(function(x){return x.value;});
  var moveOuts=(l.moveOutsByMonth||[]).map(function(x){return x.value;});
  var expirations=(l.expirationsByMonth||[]).map(function(x){return x.value;});
  var newLeads=(pipe.newLeadsByMonth||[]).map(function(x){return x.value;});
  var signed=(pipe.signedByMonth||[]).map(function(x){return x.value;});
  var endMgmt=(em.byMonth||[]).map(function(x){return x.value;});
  var appsTotal=(app.byMonth||[]).map(function(x){return x.value;});
  var appsApproved=(app.approvedByMonth||[]).map(function(x){return x.value;});
  var propTrend=p.propTrend||[];
  var propLabels=propTrend.map(function(x){return sm(x.month);});
  var propTotals=propTrend.map(function(x){return x.total;});
  var propGained=propTrend.map(function(x){return x.gained;});
  var netGrowth=signed.map(function(s,i){return s-(endMgmt[i]||0);});
  var netColors=netGrowth.map(function(v){return v>=0?C.GREEN+'cc':C.RED+'cc';});
  var renewalCounts=(l.renewalsByMonth||[]).map(function(x){return x.value;});
  var renLabels=(l.renewalsByMonth||[]).map(function(x){return sm(x.month);});
  var moMap={};
  (l.moveOutsByMonth||[]).forEach(function(x){moMap[x.month]=x.value;});
  var renMoCounts=(l.renewalsByMonth||[]).map(function(x){return moMap[x.month]||0;});

  var html = '<div class="main">' +
    '<div class="page-header"><div class="page-title">Rolling 12-Month Trends</div>' +
    '<div class="page-sub">All key metrics at a glance - '+labels[0]+' to '+labels[labels.length-1]+'</div></div>' +

    '<div class="trend-section-label">Resident Activity</div>' +
    '<div class="grid g-3">' +
      trendCard('tr-movein', 'Move-Ins', sum(moveIns), C.TEAL) +
      trendCard('tr-moveout', 'Move-Outs', sum(moveOuts), C.GRAY) +
      trendCard('tr-expiry', 'Lease Expirations', sum(expirations), C.AMBER) +
    '</div>' +
    '<div class="card" style="margin-bottom:14px"><div class="card-header"><div class="card-title">' +
    '<div class="card-title-bar" style="background:'+C.TEAL2+'"></div>Move-Ins vs Move-Outs vs Expirations</div></div>' +
    '<div class="chart-wrap" style="height:200px"><canvas id="tr-move-combined"></canvas></div>' +
    '<div class="legend">' +
    '<div class="legend-item"><div class="legend-dot" style="background:'+C.TEAL+'"></div>Move-Ins</div>' +
    '<div class="legend-item"><div class="legend-dot" style="background:'+C.GRAY+'"></div>Move-Outs</div>' +
    '<div class="legend-item"><div class="legend-dot" style="background:'+C.AMBER+'"></div>Expirations</div>' +
    '</div></div>' +

    '<div class="trend-section-label">Owner Pipeline</div>' +
    '<div class="grid g-3">' +
      trendCard('tr-leads', 'New Leads', sum(newLeads), C.PURPLE) +
      trendCard('tr-signed', 'PMA Signed', sum(signed), C.GREEN) +
      trendCard('tr-end', 'End Management', sum(endMgmt), C.RED) +
    '</div>' +
    '<div class="grid g-2" style="margin-bottom:14px">' +
      '<div class="card"><div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:'+C.PURPLE+'"></div>Leads vs Signed vs Ended</div></div>' +
      '<div class="chart-wrap" style="height:180px"><canvas id="tr-pipe-combined"></canvas></div>' +
      '<div class="legend"><div class="legend-item"><div class="legend-dot" style="background:'+C.PURPLE+'"></div>New Leads</div>' +

    mkBar('pipe-main', labels, [{label:'New Leads',data:leads,backgroundColor:C.PURPLE+'cc'},{label:'PMA Signed',data:signed,backgroundColor:C.GREEN+'cc'}], 220);
    mkBar('pipe-end', endLabels, [{label:'End Management',data:endData,backgroundColor:C.RED+'cc'}], 220);
  }, 50);
}

// ---- RENEWALS TAB ----
function renderRenewals() {
  var l=D.leases;
  var renewalsByMonth=l.renewalsByMonth||[];
  var moveOutsByMonth=l.moveOutsByMonth||[];
  var renewalsDetail=l.renewalsDetail||[];
  var months=renewalsByMonth.map(function(x){return x.month;});
  var renewalCounts=renewalsByMonth.map(function(x){return x.value;});
  var moMap={};
  moveOutsByMonth.forEach(function(x){moMap[x.month]=x.value;});
  var moveOutCounts=months.map(function(m){return moMap[m]||0;});
  var labels=months.map(function(m){return sm(m);});
  var thisMo=D.thisMonth||'';
  var thisMoRen=renewalsByMonth.find(function(x){return x.month===thisMo;});
  var thisMoCount=thisMoRen?thisMoRen.value:0;

  // Build upcoming months detail
  var byMonth={};
  renewalsDetail.forEach(function(r){
    if(!byMonth[r.monthKey]) byMonth[r.monthKey]=[];
    byMonth[r.monthKey].push(r);
  });
  var upcoming=Object.keys(byMonth).filter(function(k){return k>=thisMo;}).sort().slice(0,6);

  var upcomingHtml='';
  if(upcoming.length) {
    upcoming.forEach(function(mk) {
      var items=byMonth[mk]||[];
      var idx=months.indexOf(mk);
      var label=idx>=0?labels[idx]:mk;
      var rows='';
      items.forEach(function(r) {
        var dateStr=r.endDate?new Date(r.endDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'--';
        var rentStr=r.rent?'$'+Number(r.rent).toLocaleString():'--';
        rows+='<div class="detail-row"><div><div class="detail-addr">'+r.tenant+'</div><div class="detail-city">'+r.address+(r.city?', '+r.city:'')+'</div></div><div class="detail-meta">'+dateStr+'</div><div class="detail-rent">'+rentStr+'</div></div>';
      });
      upcomingHtml+='<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:var(--ink2);padding:6px 0">'+label+' - '+items.length+' expiring</div>' +
        '<div class="detail-list open" style="display:block"><div class="detail-header"><span>Tenant / Address</span><span>Lease End Date</span><span>Monthly Rent</span></div>'+rows+'</div></div>';
    });
  } else {
    upcomingHtml='<div style="color:var(--ghost);font-size:13px">No upcoming expirations in next 6 months</div>';
  }

  // Build full list
  var allRows='';
  renewalsDetail.slice(0,50).forEach(function(r) {
    var dateStr=r.endDate?new Date(r.endDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'--';
    var rentStr=r.rent?'$'+Number(r.rent).toLocaleString():'--';
    allRows+='<div class="detail-row"><div><div class="detail-addr">'+r.tenant+'</div><div class="detail-city">'+r.address+(r.city?', '+r.city:'')+'</div></div><div class="detail-meta">'+dateStr+'</div><div class="detail-rent">'+rentStr+'</div></div>';
  });
  var moreMsg=renewalsDetail.length>50?'<div style="padding:10px 12px;font-size:11px;color:var(--muted)">Showing 50 of '+renewalsDetail.length+' leases</div>':'';

  var estimated=renewalCounts.map(function(r,i){return Math.max(0,r-moveOutCounts[i]);});

  var html = '<div class="main">' +
    '<div class="page-header"><div class="page-title">Lease Renewals and Retention</div>' +
    '<div class="page-sub">Expirations by month vs move-outs</div></div>' +
    '<div class="kpi-grid g4">' +
      kpi('Expiring This Month', fmt(thisMoCount), 'leases up for renewal', C.AMBER) +
      kpi('Move-Outs This Month', fmt(moMap[thisMo]||0), 'actual move-outs', C.RED) +
      kpi('Expiring (90 days)', fmt(l.upcomingExpirations), 'need renewal action', C.AMBER) +
      kpi('Active Leases', fmt(l.active), 'currently occupied', C.GREEN) +
    '</div>' +
    '<div class="card" style="margin-bottom:14px"><div class="card-header"><div class="card-title">' +
    '<div class="card-title-bar" style="background:'+C.AMBER+'"></div>Expirations vs Move-Outs Month over Month</div></div>' +
    '<div class="chart-wrap" style="height:220px"><canvas id="ren-combined"></canvas></div>' +
    '<div class="legend">' +
    '<div class="legend-item"><div class="legend-dot" style="background:'+C.AMBER+'"></div>Lease Expirations</div>' +
    '<div class="legend-item"><div class="legend-dot" style="background:'+C.RED+'"></div>Move-Outs</div>' +
    '<div class="legend-item"><div class="legend-dot" style="background:'+C.GREEN+'"></div>Est. Renewals (Exp minus Move-Outs)</div>' +
    '</div></div>' +
    '<div class="trend-section-label">Upcoming Expirations - Next 6 Months</div>' +
    upcomingHtml +
    '<div class="trend-section-label">Full Renewal List</div>' +
    '<div class="card"><div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:'+C.AMBER+'"></div>All Active Leases by End Date</div>' +
    '<span style="font-size:11px;color:var(--muted)">'+renewalsDetail.length+' total</span></div>' +
    '<div style="max-height:400px;overflow-y:auto">' +
    '<div class="detail-header"><span>Tenant / Address</span><span>Lease End Date</span><span>Monthly Rent</span></div>' +
    allRows+moreMsg+'</div></div>' +
    '<div class="data-note"><span>Renewals estimated as Expirations minus Move-Outs per month</span></div>' +
    '</div>';

  document.getElementById('app').innerHTML = html;
  setTimeout(function() {
    mkBar('ren-combined', labels, [
      {label:'Expirations',data:renewalCounts,backgroundColor:C.AMBER+'cc'},
      {label:'Move-Outs',data:moveOutCounts,backgroundColor:C.RED+'cc'},
      {label:'Est. Renewals',data:estimated,backgroundColor:C.GREEN+'cc'}
    ], 220);
  }, 50);
}

// ---- PORTFOLIO TAB ----
function renderPortfolio() {
  var p=D.portfolio;
  var trend=p.propTrend||[];
  var labels=trend.map(function(x){return sm(x.month);});
  var totals=trend.map(function(x){return x.total;});
  var gained=trend.map(function(x){return x.gained;});

  var html = '<div class="main">' +
    '<div class="page-header"><div class="page-title">Portfolio Growth</div></div>' +
    '<div class="kpi-grid g4">' +
      kpi('Active Properties', fmt(p.activeProperties), 'currently managed', C.TEAL2) +
      kpi('Total Units', fmt(p.totalUnits), 'across all properties', C.TEAL) +
      kpi('Gained MTD', fmt(p.gainedMTD), 'new this month', C.GREEN) +
      kpi('Keyless Deadbolts', fmt(p.keylessDeadboltUnits), 'units enrolled', C.BLUE) +
    '</div>' +
    '<div class="card" style="margin-bottom:14px"><div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:'+C.TEAL2+'"></div>Portfolio Total Running Count</div></div>' +
    '<div class="chart-wrap" style="height:220px"><canvas id="port-total"></canvas></div></div>' +
    '<div class="grid g-2">' +
      '<div class="card"><div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:'+C.GREEN+'"></div>Properties Added Monthly</div></div>' +
      '<div class="chart-wrap" style="height:200px"><canvas id="port-gained"></canvas></div></div>' +
      '<div class="card"><div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:'+C.BLUE+'"></div>Technology Adoption</div></div>' +
      statRow('Keyless Deadbolt Units', fmt(p.keylessDeadboltUnits)) +
      statRow('Comp. Inspection Yes', fmt(D.comprehensiveInspections.yes)) +
      statRow('Comp. Inspection No', fmt(D.comprehensiveInspections.no)) +
      statRow('Opt-In Rate', D.comprehensiveInspections.optInRate+'%') +
      '</div>' +
    '</div>';

  // Add needs-updated-agreement section
  var needs = (D.endManagement && D.endManagement.needsUpdatedAgreement) || [];
  if (needs.length > 0) {
    var rows = needs.slice(0,30).map(function(p) {
      return '<div class="detail-row"><div><div class="detail-addr">'+p.address+'</div><div class="detail-city">'+p.city+'</div></div>' +
        '<div class="detail-meta">Expired '+new Date(p.dateContractEnds).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+'</div>' +
        '<div class="detail-rent" style="color:var(--amber);font-size:11px">Active</div></div>';
    }).join('');
    html += '<div class="card" style="margin-top:14px"><div class="card-header">' +
      '<div class="card-title"><div class="card-title-bar" style="background:'+C.AMBER+'"></div>Needs Updated Management Agreement</div>' +
      '<span style="font-size:11px;font-weight:700;padding:2px 9px;background:var(--amber-d);color:var(--amber);border-radius:20px">'+needs.length+' properties</span></div>' +
      '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Active properties with expired contract end date — agreement needs renewal</div>' +
      '<div class="detail-list open" style="display:block;max-height:320px;overflow-y:auto">' +
      '<div class="detail-header"><span>Property Address</span><span>Contract Expired</span><span>Status</span></div>' +
      rows + (needs.length > 30 ? '<div style="padding:8px 12px;font-size:11px;color:var(--muted)">Showing 30 of '+needs.length+'</div>' : '') +
      '</div></div>';
  }

  // Pre-tenancy cancellations section
  var preCancels = (D.portfolio && D.portfolio.preTenancyCancellations) || [];
  if (preCancels.length > 0) {
    var pcRows = preCancels.slice(0,30).map(function(p) {
      var begStr = p.dateContractBegins ? new Date(p.dateContractBegins).toLocaleDateString('en-US',{month:'short',year:'numeric'}) : '--';
      var endStr = p.dateContractEnds ? new Date(p.dateContractEnds).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '--';
      return '<div class="detail-row"><div><div class="detail-addr">'+p.address+'</div><div class="detail-city">'+p.city+'</div></div>' +
        '<div class="detail-meta">Onboarded '+begStr+'</div>' +
        '<div class="detail-rent" style="color:var(--red);font-size:11px">Ended '+endStr+'</div></div>';
    }).join('');
    html += '<div class="card" style="margin-top:14px"><div class="card-header">' +
      '<div class="card-title"><div class="card-title-bar" style="background:var(--red)"></div>Pre-Tenancy Cancellations</div>' +
      '<span style="font-size:11px;font-weight:700;padding:2px 9px;background:rgba(239,68,68,0.1);color:var(--red);border-radius:20px">'+preCancels.length+' properties</span></div>' +
      '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Properties that ended management before a tenant was ever placed</div>' +
      '<div class="detail-list open" style="display:block;max-height:320px;overflow-y:auto">' +
      '<div class="detail-header"><span>Property</span><span>Onboarded</span><span>Contract Ended</span></div>' +
      pcRows + (preCancels.length > 30 ? '<div style="padding:8px 12px;font-size:11px;color:var(--muted)">Showing 30 of '+preCancels.length+'</div>' : '') +
      '</div></div>';
  }

  html += '</div>';
  document.getElementById('app').innerHTML = html;
  setTimeout(function() {
    mkLine('port-total', labels, [{label:'Properties',data:totals,borderColor:C.TEAL2}], 220);
    mkBar('port-gained', labels, [{label:'Added',data:gained,backgroundColor:C.GREEN+'cc'}], 200);
  }, 50);
}

// ---- MAINTENANCE TAB ----
function renderMaintenance() {
  var wo=D.workOrders;
  var html = '<div class="main">' +
    '<div class="page-header"><div class="page-title">Maintenance</div></div>' +
    '<div class="kpi-grid g3">' +
      kpi('Open Work Orders', fmt(wo.openTotal), 'all active stages', C.AMBER) +
      kpi('Unassigned', fmt(wo.unassigned), 'no vendor assigned', wo.unassigned>0?C.RED:C.GREEN) +
      kpi('Assigned', fmt(wo.openTotal-wo.unassigned), 'vendor assigned', C.GREEN) +
    '</div>' +
    '<div class="card"><div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:'+C.AMBER+'"></div>Work Orders by Stage</div></div>' +
    ((wo.byStage||[]).length ? barRows((wo.byStage||[]).map(function(s){return {label:s.stage,count:s.count};}), C.AMBER) : '<div style="color:var(--ghost);font-size:13px">No open work orders</div>') +
    '</div></div>';

}

// ---- RETENTION TAB ----
function renderRetention() {
  var ci=D.comprehensiveInspections, em=D.endManagement, l=D.leases;
  var ciRadius = 42;
  var ciCirc = 2 * Math.PI * ciRadius;
  var ciDash = (ci.optInRate/100) * ciCirc;

  var html = '<div class="main">' +
    '<div class="page-header"><div class="page-title">Owner and Tenant Retention</div></div>' +
    '<div class="kpi-grid g4">' +
      kpi('Comp. Inspection Opt-In', ci.optInRate+'%', ci.yes+' yes, '+ci.no+' no', ci.optInRate>=50?C.GREEN:C.AMBER) +
      kpi('End Mgmt MTD', fmt(em.totalMTD), 'cancellations', em.totalMTD>0?C.RED:C.GREEN) +
      kpi('Move-Out Reasons', fmt(l.moveOutReasons.length), 'distinct reasons tracked', C.TEAL) +
      kpi('Expiring Leases (90d)', fmt(l.upcomingExpirations), 'need renewal action', C.AMBER) +
    '</div>' +
    '<div class="grid g-2">' +
      '<div class="card"><div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:'+C.GREEN+'"></div>Comprehensive Inspection Opt-In</div></div>' +
      '<div class="insp-wrap" style="padding:10px 0">' +
        '<div class="insp-ring" style="width:100px;height:100px">' +
          '<svg width="100" height="100" viewBox="0 0 100 100">' +
            '<circle class="insp-ring-bg" cx="50" cy="50" r="'+ciRadius+'" stroke-width="10"/>' +
            '<circle class="insp-ring-fill" cx="50" cy="50" r="'+ciRadius+'" stroke-width="10" stroke="'+(ci.optInRate>=50?C.GREEN:C.AMBER)+'" stroke-dasharray="'+ciDash+' '+ciCirc+'"/>' +
          '</svg>' +
          '<div class="insp-pct" style="font-size:20px">'+ci.optInRate+'%</div>' +
        '</div>' +
        '<div class="insp-legend">' +
          '<div class="insp-row"><div class="insp-dot" style="background:'+C.GREEN+'"></div><div class="insp-label">Yes Opted In</div><div class="insp-num">'+ci.yes+'</div></div>' +
          '<div class="insp-row"><div class="insp-dot" style="background:var(--red)"></div><div class="insp-label">No Opted Out</div><div class="insp-num">'+ci.no+'</div></div>' +
          '<div class="insp-row"><div class="insp-dot" style="background:var(--rule)"></div><div class="insp-label">Total Tracked</div><div class="insp-num">'+ci.total+'</div></div>' +
        '</div>' +
      '</div></div>' +
      '<div class="card"><div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:'+C.RED+'"></div>End Management Reasons</div></div>' +
      (em.reasons.length ? barRows(em.reasons.map(function(r){return {label:r.reason,count:r.count};}), C.RED) : '<div style="color:var(--ghost);font-size:12px">Reasons flow from Aptly Offboard board.</div>') +
      '</div>' +
    '</div>' +
    '<div class="card"><div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:'+C.RED+'"></div>Move-Out Reasons from Rentvine</div></div>' +
    (l.moveOutReasons.length ? barRows(l.moveOutReasons.map(function(r){return {label:r.reason,count:r.count};}), C.RED) : '<div style="color:var(--ghost);font-size:12px">Move-out reasons populate from the Rentvine vacateReason field on lease records.</div>') +
    '</div></div>';

  document.getElementById('app').innerHTML = html;
}

// ---- TAB SWITCHING ----
var TABS = {
  trends: renderTrends,
  overview: renderOverview,
  occupancy: renderOccupancy,
  leasing: renderLeasing,
  pipeline: renderPipeline,
  renewals: renderRenewals,
  portfolio: renderPortfolio,
  maintenance: renderMaintenance,
  retention: renderRetention
};

var activeTab = 'trends';

function switchTab(id) {
  activeTab = id;
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.tab === id);
  });
  if (D) TABS[id]();
}

// ---- DATA LOADING ----
async function forceRefresh() {
  document.getElementById('force-btn').textContent = 'Loading...';
  document.getElementById('force-btn').disabled = true;
  try { await fetch('/api/metrics/refresh'); } catch(e) {}
  await loadData();
  document.getElementById('force-btn').textContent = 'Live Refresh';
  document.getElementById('force-btn').disabled = false;
}

async function loadData() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('live-badge').style.display = 'none';
  document.getElementById('refresh-btn').textContent = 'Loading...';
  document.getElementById('refresh-btn').disabled = true;

  try {
    var r = await fetch('/api/metrics');
    if (!r.ok) throw new Error('Server error ' + r.status + ': ' + await r.text());
    D = await r.json();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('live-badge').style.display = 'flex';

    var genTime = D.generatedAt ? new Date(D.generatedAt) : new Date();
    var ageMin = Math.round((Date.now() - genTime.getTime()) / 60000);
    var ageLabel = ageMin < 1 ? 'just now' : ageMin === 1 ? '1 min ago' : ageMin + ' min ago';
    document.getElementById('live-time').textContent = 'Data from ' + ageLabel;

    Object.values(charts).forEach(function(c){try{c.destroy();}catch(e){}});
    charts = {};

    TABS[activeTab]();
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    var errEl = document.getElementById('error');
    errEl.style.display = 'block';
    errEl.innerHTML = 'Failed to load metrics: ' + e.message;
  } finally {
    document.getElementById('refresh-btn').textContent = 'Refresh';
    document.getElementById('refresh-btn').disabled = false;
  }
}

loadData();
</script>
