<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe PM — KPI Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --teal:#3CC3E1;--teal2:#2aa8c4;--teal-dim:rgba(60,195,225,0.08);
  --silver:#B4C3C3;--ink:#0d1a1a;--ink2:#243030;--ink3:#3a5050;
  --muted:#6b8585;--ghost:#94acac;--rule:rgba(180,200,200,0.18);
  --bg:#f4f7f7;--card:#ffffff;--card2:#f9fbfb;
  --green:#0fa86c;--green-d:#dcf5ec;
  --red:#e03e3e;--red-d:#fde8e8;
  --amber:#d4820a;--amber-d:#fef3dc;
  --blue:#2563eb;--blue-d:#dbeafe;
  --purple:#7c3aed;--purple-d:#ede9fe;
  --r:12px;--r2:8px;
}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:14px;line-height:1.5}

/* TOP BAR */
.topbar{background:var(--ink);color:#fff;padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:9px}
.logo-mark{width:28px;height:28px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink);letter-spacing:-0.5px}
.logo-name{font-weight:600;font-size:14px;color:#fff}
.logo-sep{color:rgba(255,255,255,0.2);font-size:16px}
.logo-page{font-size:13px;color:rgba(255,255,255,0.55);font-weight:400}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--teal);font-weight:500;font-family:'DM Mono',monospace}
.live-dot{width:5px;height:5px;background:var(--teal);border-radius:50%;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-ghost{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.12)}
.btn-ghost:hover{background:rgba(255,255,255,0.14);color:#fff}
.btn-teal{background:var(--teal);color:var(--ink);font-weight:600}
.btn-teal:hover{background:#4bd4f5}

/* NAV TABS */
.nav{background:var(--card);border-bottom:1px solid var(--rule);padding:0 28px;display:flex;gap:2px;overflow-x:auto}
.nav::-webkit-scrollbar{display:none}
.tab{padding:13px 16px;font-size:13px;font-weight:500;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--teal2);border-bottom-color:var(--teal);font-weight:600}
.tab:hover:not(.active){color:var(--ink2)}
.tab-icon{font-size:14px}

/* LOADING */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.spinner{width:32px;height:32px;border:2px solid var(--rule);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted)}

/* ERROR */
.error-wrap{margin:24px 28px;padding:14px 18px;background:var(--red-d);border:1px solid #fca5a5;border-radius:var(--r2);color:var(--red);font-size:13px}

/* MAIN LAYOUT */
.main{padding:24px 28px;max-width:1400px;margin:0 auto}
.page-header{margin-bottom:20px}
.page-title{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.4px}
.page-sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}

/* KPI GRID */
.kpi-grid{display:grid;gap:10px;margin-bottom:16px}
.kpi-grid.g4{grid-template-columns:repeat(4,1fr)}
.kpi-grid.g5{grid-template-columns:repeat(5,1fr)}
.kpi-grid.g6{grid-template-columns:repeat(6,1fr)}
.kpi-grid.g3{grid-template-columns:repeat(3,1fr)}

.kpi{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;transition:box-shadow .15s}
.kpi:hover{box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.kpi-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kpi-value{font-size:30px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-0.03em}
.kpi-sub{font-size:11px;color:var(--ghost);margin-top:5px;font-family:'DM Mono',monospace}
.kpi-change{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;margin-top:6px}
.up{background:#dcf5ec;color:#0a8a5a}
.down{background:#fde8e8;color:#c02020}

/* SECTION GRID */
.grid{display:grid;gap:14px;margin-bottom:14px}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:1fr 1fr 1fr}
.g-13{grid-template-columns:1.6fr 1fr}
.g-31{grid-template-columns:1fr 1.6fr}

/* CARD */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.card-title-bar{width:3px;height:13px;border-radius:2px;flex-shrink:0}
.card-badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;font-family:'DM Mono',monospace}

/* CHART WRAP */
.chart-wrap{position:relative}

/* BAR ROW (inline horizontal bar) */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-row-label{font-size:12px;color:var(--ink2);font-weight:500;width:160px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row-track{flex:1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.bar-row-fill{height:6px;border-radius:3px;transition:width .8s ease}
.bar-row-count{font-size:12px;font-weight:700;color:var(--ink);width:36px;text-align:right;flex-shrink:0;font-family:'DM Mono',monospace}

/* LEGEND */
.legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.legend-item{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;font-weight:500}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* STAT ROW */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.stat-row:last-child{border-bottom:none}
.stat-row-label{font-size:13px;color:var(--ink3)}
.stat-row-value{font-size:13px;font-weight:700;color:var(--ink);font-family:'DM Mono',monospace}

/* REASON LIST */
.reason-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;margin-bottom:5px;background:var(--card2)}
.reason-label{font-size:12px;color:var(--ink2);font-weight:500}
.reason-count{font-size:12px;font-weight:700;color:var(--ink);font-family:'DM Mono',monospace}

/* OCCUPANCY VIZ */
.occ-bar{height:18px;border-radius:9px;overflow:hidden;display:flex;margin:12px 0}
.occ-seg{height:100%;transition:width .8s ease;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}

/* INSPECTION RING */
.insp-wrap{display:flex;align-items:center;gap:20px}
.insp-ring{position:relative;width:80px;height:80px;flex-shrink:0}
.insp-ring svg{transform:rotate(-90deg)}
.insp-ring-bg{fill:none;stroke:var(--card2);stroke-width:8}
.insp-ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dasharray .8s ease}
.insp-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--ink)}
.insp-legend{flex:1}
.insp-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.insp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.insp-label{font-size:12px;color:var(--ink2)}
.insp-num{font-size:14px;font-weight:700;color:var(--ink);margin-left:auto;font-family:'DM Mono',monospace}

/* FOOTER NOTE */
.data-note{margin-top:24px;padding:11px 16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r2);font-size:11px;color:var(--ghost);display:flex;gap:16px;font-family:'DM Mono',monospace;flex-wrap:wrap}

/* RESPONSIVE */
@media(max-width:900px){
  .kpi-grid.g5,.kpi-grid.g6{grid-template-columns:repeat(3,1fr)}
  .kpi-grid.g4{grid-template-columns:repeat(2,1fr)}
  .grid.g-2,.grid.g-3,.grid.g-13,.grid.g-31{grid-template-columns:1fr}
  .main{padding:16px}
  .topbar{padding:0 16px}
  .nav{padding:0 16px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <div class="logo-mark">A</div>
      <span class="logo-name">Aloe PM</span>
      <span class="logo-sep">·</span>
      <span class="logo-page">KPI Dashboard</span>
    </div>
    <div class="live-badge" id="live-badge" style="display:none">
      <span class="live-dot"></span>
      <span id="live-time">Live</span>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn btn-ghost" onclick="window.location.href='/'">← Hub</button>
    <button class="btn btn-teal" id="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</div>

<div class="nav">
  <button class="tab active" data-tab="overview" onclick="switchTab('overview')"><span class="tab-icon">📊</span>Overview</button>
  <button class="tab" data-tab="occupancy" onclick="switchTab('occupancy')"><span class="tab-icon">🏠</span>Occupancy</button>
  <button class="tab" data-tab="leasing" onclick="switchTab('leasing')"><span class="tab-icon">📋</span>Leasing</button>
  <button class="tab" data-tab="pipeline" onclick="switchTab('pipeline')"><span class="tab-icon">🎯</span>Owner Pipeline</button>
  <button class="tab" data-tab="portfolio" onclick="switchTab('portfolio')"><span class="tab-icon">🏢</span>Portfolio Growth</button>
  <button class="tab" data-tab="maintenance" onclick="switchTab('maintenance')"><span class="tab-icon">🔧</span>Maintenance</button>
  <button class="tab" data-tab="retention" onclick="switchTab('retention')"><span class="tab-icon">🔄</span>Retention</button>
</div>

<div id="loading" class="loading-wrap">
  <div class="spinner"></div>
  <div class="loading-text">Loading live data from Rentvine + Aptly…</div>
</div>

<div id="error" class="error-wrap" style="display:none"></div>
<div id="app" style="display:none"></div>

<script>
// ─── State ─────────────────────────────────────────────────────────────────
let D = null; // metrics data
let charts = {}; // chart instances

// ─── Chart defaults ─────────────────────────────────────────────────────────
const C = {
  TEAL: '#3CC3E1', TEAL2: '#2aa8c4',
  GREEN: '#0fa86c', RED: '#e03e3e',
  AMBER: '#d4820a', BLUE: '#2563eb',
  PURPLE: '#7c3aed', GRAY: '#94acac',
  ORANGE: '#ea6c1e',
};

const chartDefaults = {
  responsive: true, maintainAspectRatio: false,
  plugins: {
    legend: { display: false },
    tooltip: {
      backgroundColor: '#0d1a1a', titleColor: '#fff', bodyColor: 'rgba(255,255,255,0.7)',
      borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1,
      padding: 10, cornerRadius: 8, mode: 'index', intersect: false,
    }
  },
};

function mkBar(canvasId, labels, datasets, height = 160, stacked = false) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  if (charts[canvasId]) charts[canvasId].destroy();
  charts[canvasId] = new Chart(el, {
    type: 'bar',
    data: { labels, datasets: datasets.map(d => ({
      ...d, borderRadius: 4, borderSkipped: false,
      stack: stacked ? 'stack' : undefined,
    }))},
    options: { ...chartDefaults, scales: {
      x: { stacked, ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'}, grid:{display:false}, border:{display:false} },
      y: { stacked, ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'}, grid:{color:'rgba(180,200,200,0.12)'}, border:{display:false} }
    }}
  });
  el.parentElement.style.height = height + 'px';
}

function mkLine(canvasId, labels, datasets, height = 160) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  if (charts[canvasId]) charts[canvasId].destroy();
  charts[canvasId] = new Chart(el, {
    type: 'line',
    data: { labels, datasets: datasets.map((d, i) => ({
      ...d, borderWidth: 2, pointRadius: 3, pointHoverRadius: 5, tension: 0.4,
      fill: datasets.length === 1, backgroundColor: d.borderColor + '14',
    }))},
    options: { ...chartDefaults, scales: {
      x: { ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'}, grid:{display:false}, border:{display:false} },
      y: { ticks:{font:{size:10,family:'DM Mono'},color:'#94acac'}, grid:{color:'rgba(180,200,200,0.12)'}, border:{display:false} }
    }}
  });
  el.parentElement.style.height = height + 'px';
}

function shortMonth(yyyymm) {
  if (!yyyymm) return '';
  const [y, m] = yyyymm.split('-');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[parseInt(m)-1] + ' \'' + y.slice(2);
}

function fmt(n, prefix = '', suffix = '') {
  if (n == null || n === undefined) return '—';
  return prefix + Number(n).toLocaleString() + suffix;
}

function kpi(label, value, sub, accentColor, change) {
  const changeHtml = change != null
    ? `<div class="kpi-change ${change >= 0 ? 'up' : 'down'}">${change >= 0 ? '▲' : '▼'} ${Math.abs(change)}%</div>`
    : '';
  return `<div class="kpi">
    <div class="kpi-accent" style="background:${accentColor}"></div>
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value ?? '—'}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
    ${changeHtml}
  </div>`;
}

function barRows(items, color, maxVal) {
  if (!items || items.length === 0) return '<div style="color:var(--ghost);font-size:12px;padding:8px 0">No data</div>';
  const max = maxVal || Math.max(...items.map(i => i.count || i.value || 0), 1);
  return items.slice(0, 8).map(item => {
    const label = item.reason || item.source || item.stage || item.label || '?';
    const count = item.count || item.value || 0;
    const pct = Math.round((count / max) * 100);
    return `<div class="bar-row">
      <div class="bar-row-label" title="${label}">${label}</div>
      <div class="bar-row-track"><div class="bar-row-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="bar-row-count">${count}</div>
    </div>`;
  }).join('');
}

function statRow(label, value) {
  return `<div class="stat-row"><span class="stat-row-label">${label}</span><span class="stat-row-value">${value}</span></div>`;
}

// ─── TAB RENDERER ───────────────────────────────────────────────────────────
function renderOverview() {
  const p = D.portfolio, l = D.leases, pipe = D.pipeline, em = D.endManagement;
  const labels = (l.moveInsByMonth || []).map(x => shortMonth(x.month));
  const moveIns = (l.moveInsByMonth || []).map(x => x.value);
  const moveOuts = (l.moveOutsByMonth || []).map(x => x.value);
  const signed = (pipe.signedByMonth || []).map(x => x.value);
  const leads = (pipe.newLeadsByMonth || []).map(x => x.value);

  document.getElementById('app').innerHTML = `
  <div class="main">
    <div class="page-header">
      <div class="page-title">Operations Overview</div>
      <div class="page-sub">Live · ${new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>
    </div>

    <div class="kpi-grid g5">
      ${kpi('Active Properties', fmt(p.activeProperties), `${p.totalUnits} total units`, C.TEAL2)}
      ${kpi('Occupancy Rate', `${p.occupancyRate}%`, `${p.occupiedUnits} occupied · ${p.vacantUnits} vacant`, p.occupancyRate >= 95 ? C.GREEN : C.AMBER)}
      ${kpi('Open Work Orders', fmt(D.workOrders.openTotal), `${D.workOrders.unassigned} unassigned`, C.AMBER)}
      ${kpi('PMA Signed MTD', fmt(pipe.signedMTD), 'management agreements', C.PURPLE)}
      ${kpi('End Mgmt MTD', fmt(em.totalMTD), 'cancellations this month', em.totalMTD > 0 ? C.RED : C.GREEN)}
    </div>

    <div class="grid g-2">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><div class="card-title-bar" style="background:${C.TEAL2}"></div>Move Activity — Monthly</div>
        </div>
        <div class="chart-wrap" style="height:200px"><canvas id="ov-move"></canvas></div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:${C.TEAL}"></div>Move-Ins</div>
          <div class="legend-item"><div class="legend-dot" style="background:${C.GRAY}"></div>Move-Outs</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title"><div class="card-title-bar" style="background:${C.PURPLE}"></div>Owner Pipeline — Monthly</div>
        </div>
        <div class="chart-wrap" style="height:200px"><canvas id="ov-pipe"></canvas></div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:${C.PURPLE}"></div>New Leads</div>
          <div class="legend-item"><div class="legend-dot" style="background:${C.GREEN}"></div>PMA Signed</div>
        </div>
      </div>
    </div>

    <div class="grid g-3">
      <div class="card">
        <div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:${C.GREEN}"></div>Occupancy</div></div>
        <div class="kpi-value" style="font-size:42px;color:${p.occupancyRate >= 95 ? C.GREEN : C.AMBER}">${p.occupancyRate}%</div>
        <div class="occ-bar" style="margin-top:14px">
          <div class="occ-seg" style="width:${p.occupancyRate}%;background:${C.GREEN}">Occ</div>
          <div class="occ-seg" style="flex:1;background:var(--red);"></div>
        </div>
        ${statRow('Occupied', fmt(p.occupiedUnits))}
        ${statRow('Vacant', fmt(p.vacantUnits))}
        ${statRow('Total Units', fmt(p.totalUnits))}
        ${statRow('Vacancy Loss/mo', fmt(p.vacancyLoss, '$'))}
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:${C.AMBER}"></div>Leasing KPIs</div></div>
        ${statRow('Move-Ins MTD', fmt(l.moveInsMTD))}
        ${statRow('Move-Outs MTD', fmt(l.moveOutsMTD))}
        ${statRow('Expiring (90d)', fmt(l.upcomingExpirations))}
        ${statRow('Avg Days to Lease', l.avgDaysToLease != null ? l.avgDaysToLease + ' days' : '—')}
        ${statRow('Listings Over 45d', fmt(p.listingsOver45Days))}
        ${statRow('Listings Over 90d', fmt(p.listingsOver90Days))}
        ${statRow('Active Listings', fmt(p.activeListings))}
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title"><div class="card-title-bar" style="background:${C.TEAL}"></div>Tech &amp; Ops</div></div>
        ${statRow('Keyless Deadbolts', fmt(p.keylessDeadboltUnits))}
        ${statRow('Comp. Inspections (Yes)', fmt(D.comprehensiveInspections.yes))}
        ${statRow('Comp. Inspections (No)', fmt(D.comprehensiveInspections.no))}
        ${statRow('Insp. Opt-In Rate', D.comprehensiveInspections.optInRate + '%')}
        ${statRow('New Leads MTD', fmt(pipe.newLeadsMTD))}
        ${statRow('Apps Received MTD', fmt(D.applications.totalMTD))}
        ${statRow('Apps Approved MTD', fmt(D.applications.approvedMTD))}
      </div>
    </div>

    <div class="data-note">
      <span>🏠 ${p.activeProperties} properties</span>
      <span>📋 ${D.applications.totalMTD} apps MTD</span>
      <span>🔧 ${D.workOrders.openTotal} open WOs</span>
      <span>⏱ Updated ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span>
    </div>
  </div>`;

  setTimeout(() => {
    mkBar('ov-move', labels, [
      { label: 'Move-Ins', data: moveIns, backgroundColor: C.TEAL + 'cc' },
      { label: 'Move-Outs', data: moveOuts, backgroundColor: C.GRAY + 'cc' },
    ], 200);
    mkBar('ov-pipe', labels, [
      { label: 'New Leads', data: leads, backgroundColor: C.PURPLE + 'cc' },
      { label: 'PMA Signed', data: signed, backgroundColor: C.GREEN + 'cc' },
    ], 200);
  }, 50);
}

function renderOccupancy() {
  const p = D.portfolio, l = D.leases;
  const labels = (l.moveInsByMonth || []).map(x => shortMonth(x.month));
  const moveIns = (l.moveInsByMonth || []).map(x => x.value);
  const moveOuts = (l.moveOutsByMonth || []).map(x => x.value);

let activeTab = 'overview';
function switchTab(id) {
  activeTab = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  if (D) TABS[id]();
}

// ─── DATA LOADING ───────────────────────────────────────────────────────────
async function loadData() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('live-badge').style.display = 'none';
  document.getElementById('refresh-btn').textContent = '↻ Loading…';
  document.getElementById('refresh-btn').disabled = true;

  try {
    const r = await fetch('/api/metrics');
    if (!r.ok) throw new Error(`Server error ${r.status}: ${await r.text()}`);
    D = await r.json();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('live-badge').style.display = 'flex';
    document.getElementById('live-time').textContent =
      'Live · ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

    // Destroy all old charts
    Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
    charts = {};

    TABS[activeTab]();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    const errEl = document.getElementById('error');
    errEl.style.display = 'block';
    errEl.innerHTML = `⚠ Failed to load metrics: ${e.message}<br><small style="opacity:.7">Make sure /api/metrics is deployed on your Render server. Visit <a href="/api/metrics/debug" target="_blank" style="color:var(--red)">/api/metrics/debug</a> to check board field names.</small>`;
  } finally {
    document.getElementById('refresh-btn').textContent = '↻ Refresh';
    document.getElementById('refresh-btn').disabled = false;
  }
}

loadData();
</script>
