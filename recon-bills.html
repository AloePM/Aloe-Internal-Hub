<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe PM · Bills Recon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F8FAFC;--surface:#fff;--s2:#EFF8FC;--border:#D6EEF5;--border2:#B4C3C3;
    --teal:#3CC3E1;--teal-dk:#4BB4D2;--silver:#B4C3C3;
    --red:#C0392B;--rbg:#FDF0EF;--rborder:#E8A09A;
    --amber:#B7770D;--abg:#FEF7E8;--aborder:#F0C36D;
    --green:#27AE60;--gbg:#EAF7EE;--gborder:#82D8A0;
    --muted:#8AA5AD;--text:#1A2E35;--text2:#4A6570;
    --match-bg:#EAF7EE;--match-border:#82D8A0;
    --near-bg:#FFFBEB;--near-border:#FCD34D;
  }
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;font-size:13px}
  ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

  .hdr{background:#fff;border-bottom:1px solid var(--border);border-top:3px solid var(--teal);padding:0 20px;height:48px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
  .hdr-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--text)}
  .hdr-sub{font-size:11px;color:var(--muted);margin-left:4px}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn-sm{background:none;border:1px solid var(--border2);border-radius:6px;padding:4px 10px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s}
  .btn-sm:hover{border-color:var(--teal);color:var(--teal)}

  .body{padding:16px 20px;max-width:900px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:16px;margin-bottom:12px}
  .card-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .info{background:var(--s2);border:1px solid var(--teal);border-radius:7px;padding:8px 13px;font-size:11px;color:var(--teal-dk);margin-bottom:12px;line-height:1.6}
  .err{background:var(--rbg);border:1px solid var(--rborder);border-radius:7px;padding:8px 13px;font-size:11px;color:var(--red);margin-bottom:12px}

  .drop{border:1.5px dashed var(--border2);border-radius:8px;padding:18px 14px;text-align:center;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70px}
  .drop:hover,.drop.over,.drop.filled{border-color:var(--teal);background:var(--s2)}
  .drop-icon{font-size:18px;margin-bottom:4px}
  .drop-title{font-size:12px;font-weight:500;margin-bottom:2px}
  .drop-sub{font-size:10px;color:var(--muted);line-height:1.4}

  .btn-run{background:var(--teal);border:none;border-radius:7px;padding:11px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;transition:background .15s;margin-top:12px}
  .btn-run:hover{background:var(--teal-dk)}
  .btn-run:disabled{background:var(--s2);color:var(--muted);cursor:not-allowed;border:1px solid var(--border2)}

  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:12px}
  .spinner{width:30px;height:30px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-msg{font-family:'IBM Plex Mono',monospace;color:var(--teal);font-size:11px;font-weight:500}

  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px}
  .stat-n{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500;line-height:1}
  .stat-l{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:3px}

  /* ALERT */
  .alert-banner{border-radius:7px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--rborder);background:var(--rbg)}
  .alert-banner .al{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
  .alert-banner .aa{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:500;color:var(--red)}
  .alert-banner .as{font-size:11px;color:#7A1F1F;margin-top:2px}

  /* EXCEL TABLE */
  .xl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:12px}
  .xl-toolbar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--s2);align-items:center;flex-wrap:wrap}
  .srch{background:#fff;border:1px solid var(--border2);border-radius:5px;padding:4px 9px;color:var(--text);font-size:11px;font-family:'IBM Plex Mono',monospace;width:180px}
  .srch:focus{outline:1.5px solid var(--teal);outline-offset:1px}
  .fsel{background:#fff;border:1px solid var(--border2);border-radius:5px;padding:4px 9px;color:var(--text);font-size:11px;font-family:'IBM Plex Mono',monospace}
  .row-ct{margin-left:auto;font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
  .xl-scroll{overflow:auto;max-height:560px}

  /* TABLE HEADER */
  .xl-table{width:100%;border-collapse:collapse;font-size:12px}
  .xl-table th{
    position:sticky;top:0;z-index:10;
    background:#EFF8FC;border-bottom:2px solid var(--teal);border-right:1px solid var(--border);
    padding:7px 10px;text-align:left;
    font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-dk);
    white-space:nowrap;cursor:pointer;user-select:none;
  }
  .xl-table th:hover{background:var(--s2)}
  .xl-table th.sort-asc::after{content:' ↑'}
  .xl-table th.sort-desc::after{content:' ↓'}
  .xl-table th:last-child{border-right:none}

  /* TABLE ROWS */
  .xl-table td{
    padding:6px 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);
    vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;
  }
  .xl-table td:last-child{border-right:none}
  .xl-table tr:last-child td{border-bottom:none}

  /* ROW COLOR STATES */
  .xl-table tr.row-matched td{background:var(--match-bg)}
  .xl-table tr.row-matched:hover td{background:#D4EFD8}
  .xl-table tr.row-near td{background:var(--near-bg)}
  .xl-table tr.row-near:hover td{background:#FEF3C7}
  .xl-table tr.row-unmatched td{background:#fff}
  .xl-table tr.row-unmatched:hover td{background:#F9FAFB}

  /* CELLS */
  .mono{font-family:'IBM Plex Mono',monospace}
  .amt{font-family:'IBM Plex Mono',monospace;font-weight:500}
  .amt.neg{color:var(--red)}
  .match-badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:600;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
  .mb-exact{background:var(--match-bg);color:var(--green);border:1px solid var(--gborder)}
  .mb-near{background:var(--near-bg);color:#92400E;border:1px solid var(--near-border)}
  .mb-desc{background:#EFF8FC;color:var(--teal-dk);border:1px solid var(--teal)}
  .mb-none{background:#F9FAFB;color:var(--muted);border:1px solid var(--border2)}

  .rv-ref{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}
  .suggest-cell{font-size:10px;color:var(--amber);max-width:260px;white-space:normal;line-height:1.3}
  .suggest-cell.action{color:var(--red);font-weight:600}
  .date-diff{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}

  /* LEGEND */
  .legend{display:flex;gap:14px;padding:7px 12px;border-top:1px solid var(--border);background:var(--s2);flex-wrap:wrap}
  .leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
  .leg-dot{width:12px;height:12px;border-radius:2px;flex-shrink:0;border:1px solid}

  /* EXPORT */
  .xl-footer{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--border);background:var(--s2);justify-content:space-between;align-items:center}
  .xl-footer-left{font-size:10px;color:var(--muted)}
  .empty-row td{padding:32px;text-align:center;color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let S = {
  screen: 'config',
  csvFile: null, csvText: '',
  loadMsg: '',
  error: '',
  results: null,
  search: '', filter: 'all',
  sortCol: 'chase_date', sortDir: 'asc',
};
function set(p) { Object.assign(S, p); render(); }

// ─────────────────────────────────────────────────────────────────────────────
// CSV PARSER — Chase format
// ─────────────────────────────────────────────────────────────────────────────
function pl(line) {
  const f=[]; let c='',q=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"')q=!q;
    else if(line[i]===','&&!q){f.push(c.trim());c='';}
    else c+=line[i];
  }
  f.push(c.trim()); return f;
}
function pd(d){
  if(!d) return '';
  const s=String(d).trim().replace(/^"|"$/g,'');
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  return s;
}
function parseChase(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const headers=pl(lines[0]);
  const hi=k=>headers.findIndex(h=>h.toLowerCase().includes(k.toLowerCase()));
  const iDate=hi('Transaction Date'), iDesc=hi('Description'), iAmt=hi('Amount'), iType=hi('Type'), iCard=hi('Card');
  return lines.slice(1).map(l=>{
    const v=pl(l);
    const type=(v[iType]||'').trim();
    const rawAmt=parseFloat((v[iAmt]||'').replace(/[$,]/g,''))||0;
    if(!rawAmt) return null;
    const isSale=type==='Sale'||rawAmt<0;
    if(!isSale) return null;
    const date=pd(v[iDate]);
    const desc=(v[iDesc]||'').trim();
    const amount=Math.abs(rawAmt);
    if(!date||!amount) return null;
    return {date,description:desc,amount,card:(v[iCard]||'').trim()};
  }).filter(Boolean);
}

// ─────────────────────────────────────────────────────────────────────────────
// FETCH RV BILLS — via Render proxy (Basic Auth)
// ─────────────────────────────────────────────────────────────────────────────
async function fetchRVBills(csvStart, csvEnd){
  // 90 days back from the CSV's latest date, forward to CSV end
  // This drops outlier dates (e.g. a stray 2024 row in a 2025-2026 file)
  const windowStart = shiftDate(csvEnd, -90);
  const windowEnd   = shiftDate(csvEnd, +30);
  const VENDOR=/aloe property management.*reimburs/i;
  let all=[], page=1;
  while(true){
    const r=await fetch(`/api/rentvine/accounting/bills?page=${page}&pageSize=200`);
    if(!r.ok) throw new Error(`Rentvine bills API returned ${r.status}`);
    const d=await r.json();
    const rows=Array.isArray(d)?d:(d?.data??[]);
    if(!rows.length) break;
    rows.forEach(row=>{
      const b=row.bill, name=row.contact?.name||'';
      if(!b||!VENDOR.test(name)) return;
      const date=(b.billDate||b.dateDue||'').slice(0,10);
      // Only include bills within the expanded window
      if(date && (date < windowStart || date > windowEnd)) return;
      all.push({
        billID:    b.billID,
        date,
        reference: (b.reference||'').trim(),
        memo:      (b.paymentMemo||b.description||'').trim(),
        vendor:    name,
        workOrderID: b.workOrderID||'',
        matched:   false,
      });
    });
    if(rows.length<200) break;
    page++;
  }
  return all;
}

// ─────────────────────────────────────────────────────────────────────────────
// MATCHING — amount + date (±45 days) primary, description similarity fallback
// ─────────────────────────────────────────────────────────────────────────────
function daysDiff(a, b){
  try{ return Math.abs((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000); }
  catch(e){ return 999; }
}

// Simple description similarity — tokenize and find common words
function descSimilarity(a, b){
  const tok=s=>(s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
  const ta=new Set(tok(a)), tb=new Set(tok(b));
  const inter=[...ta].filter(w=>tb.has(w));
  const union=new Set([...ta,...tb]);
  return union.size>0?inter.length/union.size:0;
}

// Check if reference# appears in description
function refInDesc(ref, desc){
  if(!ref||!desc) return false;
  return desc.toLowerCase().includes(ref.toLowerCase())||
         ref.toLowerCase().includes(desc.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,6));
}

function matchBills(csvRows, rvBills){
  const pool=rvBills.map(b=>({...b,matched:false}));
  // We'll produce one output row per Chase charge
  const rows=csvRows.map(c=>({
    chase:c,
    rv:null,
    matchType:null,    // 'exact'|'near'|'desc'|'ref'|null
    dateDiff:null,
    amtDiff:null,
    descScore:null,
    suggestion:null,
  }));

  // Pass 1: Reference# in Chase description + amount within $0.02
  rows.forEach(row=>{
    if(row.rv) return;
    const c=row.chase;
    const rv=pool.find(b=>{
      if(b.matched) return false;
      if(!refInDesc(b.reference,c.description)) return false;
      return Math.abs(b.amount||c.amount-c.amount)<0.02; // ref match overrides amount
    });
    if(rv){row.rv=rv;row.matchType='ref';row.dateDiff=daysDiff(c.date,rv.date);rv.matched=true;}
  });

  // Pass 2: Exact amount (±$0.02) + date within 45 days
  rows.forEach(row=>{
    if(row.rv) return;
    const c=row.chase;
    const rv=pool.find(b=>{
      if(b.matched) return false;
      if(Math.abs(c.amount-(b._amount||c.amount))>0.02) return false; // need amount on rv side
      // Since RV bills don't have amount, we can't exact-match by amount alone
      // BUT: if ref# matches chase desc it already caught above
      return false; // placeholder — handled below via description similarity
    });
    if(rv){row.rv=rv;row.matchType='exact';row.dateDiff=daysDiff(c.date,rv.date);row.amtDiff=0;rv.matched=true;}
  });

  // Pass 3: Description similarity (score > 0.25) + date within 45 days
  rows.forEach(row=>{
    if(row.rv) return;
    const c=row.chase;
    let bestScore=0.25,bestRV=null;
    pool.forEach(b=>{
      if(b.matched) return;
      const dd=daysDiff(c.date,b.date);
      if(dd>45) return;
      // Try similarity between Chase desc and RV reference or memo
      const scoreRef=refInDesc(b.reference,c.description)?0.9:0;
      const scoreMemo=descSimilarity(c.description,b.memo);
      const scoreRef2=descSimilarity(c.description,b.reference);
      const score=Math.max(scoreRef,scoreMemo,scoreRef2);
      if(score>bestScore){bestScore=score;bestRV=b;}
    });
    if(bestRV){
      row.rv=bestRV;
      row.matchType=bestScore>=0.9?'ref':bestScore>=0.5?'near':'desc';
      row.dateDiff=daysDiff(c.date,bestRV.date);
      row.descScore=Math.round(bestScore*100);
      bestRV.matched=true;
    }
  });

  // Suggestions for unmatched
  rows.forEach(row=>{
    if(row.rv) return;
    row.suggestion='⚠ Add bill to Rentvine — '+fmt(row.chase.amount)+' not entered';
  });

  // Collect RV-only bills (in RV but no Chase charge matched)
  const rvOnly=pool.filter(b=>!b.matched);

  return {rows, rvOnly};
}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function shiftDate(dateStr, days){
  try{
    const d=new Date(dateStr+'T12:00:00');
    d.setDate(d.getDate()+days);
    return d.toISOString().slice(0,10);
  }catch(e){return dateStr;}
}
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
function fmtDate(d){
  if(!d) return '';
  try{const dt=new Date(d+'T12:00:00');return (dt.getMonth()+1)+'/'+dt.getDate()+'/'+dt.getFullYear();}
  catch(e){return d;}
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─────────────────────────────────────────────────────────────────────────────
// RUN
// ─────────────────────────────────────────────────────────────────────────────
async function run(){
  if(!S.csvText){set({error:'Upload your Chase CSV first.'});return;}
  set({error:'',screen:'loading',loadMsg:'Parsing Chase CSV…'});
  try{
    const csvRows=parseChase(S.csvText);
    if(!csvRows.length) throw new Error('No charge rows found — check CSV format');
    set({loadMsg:'Fetching Aloe PM Reimbursement bills from Rentvine…'});
    // Derive date range from CSV
    const allCsvDates=csvRows.map(r=>r.date).filter(Boolean).sort();
    const csvEnd=allCsvDates[allCsvDates.length-1]||new Date().toISOString().slice(0,10);
    // Ignore Chase rows older than 90 days before the latest date (drops stray old transactions)
    const cutoff=shiftDate(csvEnd,-90);
    const filteredCsvRows=csvRows.filter(r=>r.date>=cutoff);
    const csvDates=filteredCsvRows.map(r=>r.date).sort();
    const csvStart=csvDates[0]||cutoff;
    // Replace csvRows with filtered version
    csvRows.length=0; filteredCsvRows.forEach(r=>csvRows.push(r));
    set({loadMsg:`CSV: ${fmtDate(csvStart)} → ${fmtDate(csvEnd)} (90-day window) · fetching RV bills…`});
    const rvBills=await fetchRVBills(csvStart, csvEnd);
    if(!rvBills.length) throw new Error('No Aloe PM Reimbursement bills found in Rentvine for this date range. Try a different statement period.');
    set({loadMsg:`Matching ${csvRows.length} charges against ${rvBills.length} RV bills…`});
    const {rows,rvOnly}=matchBills(csvRows,rvBills);
    set({results:{csvRows,rvBills,rows,rvOnly,csvStart,csvEnd},screen:'results',search:'',filter:'all',sortCol:'chase_date',sortDir:'asc'});
  }catch(e){set({error:e.message,screen:'config'});}
}

// ─────────────────────────────────────────────────────────────────────────────
// SORT + FILTER
// ─────────────────────────────────────────────────────────────────────────────
function sortedFilteredRows(){
  if(!S.results) return [];
  let rows=[...S.results.rows];
  const q=S.search.toLowerCase();

  // Filter
  if(S.filter==='matched') rows=rows.filter(r=>r.rv&&r.matchType!=='desc');
  else if(S.filter==='unmatched') rows=rows.filter(r=>!r.rv);
  else if(S.filter==='needsEntry') rows=rows.filter(r=>!r.rv);
  else if(S.filter==='partial') rows=rows.filter(r=>r.rv&&r.matchType==='desc');

  // Search
  if(q) rows=rows.filter(r=>
    (r.chase.description||'').toLowerCase().includes(q)||
    fmt(r.chase.amount).includes(q)||
    (r.rv?.reference||'').toLowerCase().includes(q)||
    (r.rv?.memo||'').toLowerCase().includes(q)||
    fmtDate(r.chase.date).includes(q)
  );

  // Sort
  const {sortCol,sortDir}=S;
  const dir=sortDir==='asc'?1:-1;
  rows.sort((a,b)=>{
    let va,vb;
    if(sortCol==='chase_date'){va=a.chase.date;vb=b.chase.date;}
    else if(sortCol==='chase_amt'){va=a.chase.amount;vb=b.chase.amount;}
    else if(sortCol==='chase_desc'){va=a.chase.description;vb=b.chase.description;}
    else if(sortCol==='rv_date'){va=a.rv?.date||'';vb=b.rv?.date||'';}
    else if(sortCol==='rv_ref'){va=a.rv?.reference||'';vb=b.rv?.reference||'';}
    else if(sortCol==='match'){va=a.matchType||'z';vb=b.matchType||'z';}
    else if(sortCol==='days'){va=a.dateDiff??999;vb=b.dateDiff??999;}
    else{va='';vb='';}
    if(typeof va==='number') return dir*(va-vb);
    return dir*(va<vb?-1:va>vb?1:0);
  });
  return rows;
}

function thSort(col,label){
  const {sortCol,sortDir}=S;
  const cls=sortCol===col?(sortDir==='asc'?' sort-asc':' sort-desc'):'';
  return `<th class="${cls}" data-col="${col}">${label}</th>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML=
    S.screen==='loading'?rLoad():
    S.screen==='results'?rResults():
    rConfig();
  bind();
}

function rLoad(){
  return `<div class="hdr"><span class="hdr-title">ALOE RECON · BILLS</span></div>
  <div class="loading-wrap"><div class="spinner"></div><div class="load-msg">${S.loadMsg}</div></div>`;
}

function rConfig(){
  const {csvFile,error}=S;
  return `<div class="hdr">
    <span class="hdr-title">ALOE RECON · BILLS</span>
    <span class="hdr-sub">Chase card ↔ Rentvine Reimbursement bills</span>
  </div>
  <div class="body">
    ${error?`<div class="err">⚠ ${error}</div>`:''}
    <div class="info">
      <strong>Matching logic:</strong> Matches Chase card charges against Rentvine <em>Aloe PM - REIMBURSEMENTS</em> bills.<br>
      <strong>Pass 1:</strong> Reference # from RV bill found in Chase description<br>
      <strong>Pass 2:</strong> Description similarity + date within 45 days<br>
      🟩 <strong>Matched</strong> — found in Rentvine &nbsp;·&nbsp; 🟨 <strong>Partial</strong> — weak match, verify &nbsp;·&nbsp; ⬜ <strong>Not entered</strong> — add to Rentvine
    </div>
    <div class="card">
      <div class="card-title">Upload Chase card CSV</div>
      <div class="drop ${csvFile?'filled':''}" id="drop">
        <input type="file" id="fi" accept=".csv" style="display:none"/>
        ${csvFile
          ?`<div class="drop-title" style="color:var(--teal)">✓ ${esc(csvFile.name)}</div><div class="drop-sub">Click to replace</div>`
          :`<div class="drop-icon">💳</div><div class="drop-title">Drop Chase CSV or click to browse</div>
            <div class="drop-sub">Chase → Account Activity → Download → CSV<br>Needs: Transaction Date, Description, Amount, Type</div>`}
      </div>
      <button class="btn-run" id="runBtn" ${!csvFile?'disabled':''}>Check bills →</button>
    </div>
    <div style="font-size:10px;color:var(--muted);text-align:center;margin-top:-4px">Pulls bills directly from Rentvine via the Aloe Assistant server</div>
  </div>`;
}

function rResults(){
  const {results,search,filter,csvFile}=S;
  const {csvRows,rvBills,rows,rvOnly}=results;
  const matched=rows.filter(r=>r.rv&&r.matchType==='ref');
  const nearMatch=rows.filter(r=>r.rv&&r.matchType!=='ref');
  const unmatched=rows.filter(r=>!r.rv);
  const unmatchedAmt=unmatched.reduce((s,r)=>s+r.chase.amount,0);

  const viewRows=sortedFilteredRows();

  const tableRows=viewRows.length===0
    ?`<tr class="empty-row"><td colspan="8">No rows match the current filter.</td></tr>`
    :viewRows.map(row=>{
        const c=row.chase,rv=row.rv;
        const mt=row.matchType;
        const rowCls=mt==='ref'?'row-matched':mt?'row-near':'row-unmatched';

        // Match badge
        let badge='';
        if(mt==='ref') badge=`<span class="match-badge mb-exact">✓ Ref match</span>`;
        else if(mt==='near') badge=`<span class="match-badge mb-near">≈ Near match</span>`;
        else if(mt==='desc') badge=`<span class="match-badge mb-desc">~ Desc match</span>`;
        else badge=`<span class="match-badge mb-none">— Not found</span>`;

        const dateDiffCell=row.dateDiff!=null
          ?`<span class="date-diff">${row.dateDiff===0?'same day':row.dateDiff+'d apart'}</span>`
          :'';

        const rvDateCell=rv?`<span class="mono">${fmtDate(rv.date)}</span>`:'';
        const rvRefCell=rv?`<span class="rv-ref">${esc(rv.reference)||'—'}</span>`:'';
        const rvMemoCell=rv?esc(rv.memo||rv.vendor||''):'';
        const rvWoCell=rv&&rv.workOrderID?`<span class="rv-ref">WO#${rv.workOrderID}</span>`:'';

        const suggestCell=!rv?`<span class="suggest-cell action">Add bill to Rentvine</span>`
          :mt==='desc'?`<span class="suggest-cell">Verify match — low confidence</span>`:'';

        return `<tr class="${rowCls}">
          <td><span class="mono">${fmtDate(c.date)}</span></td>
          <td title="${esc(c.description)}">${esc(c.description)}</td>
          <td><span class="amt neg">−${fmt(c.amount)}</span></td>
          <td>${badge}</td>
          <td>${dateDiffCell}</td>
          <td>${rvDateCell}</td>
          <td>${rvRefCell}${rvWoCell?'<br>'+rvWoCell:''}</td>
          <td>${suggestCell||rvMemoCell}</td>
        </tr>`;
      }).join('');

  // RV-only section (in RV but not matched to any Chase charge)
  const rvOnlyRows=rvOnly.map(b=>`<tr class="row-unmatched">
    <td colspan="3" style="color:var(--muted);font-style:italic">— not in Chase statement</td>
    <td><span class="match-badge mb-none">RV only</span></td>
    <td></td>
    <td><span class="mono">${fmtDate(b.date)}</span></td>
    <td><span class="rv-ref">${esc(b.reference)||'—'}</span></td>
    <td style="color:var(--muted);font-size:10px">Bill in Rentvine, no matching card charge</td>
  </tr>`).join('');

  const filterOpts=[
    ['all','All rows'],['matched','✓ Matched'],['partial','~ Partial'],['needsEntry','⬜ Not entered'],
  ];
  const filterBtns=filterOpts.map(([v,l])=>
    `<button class="btn-sm ${filter===v?'active-filter':''}" data-filter="${v}" style="${filter===v?'border-color:var(--teal);color:var(--teal);':''}">${l}</button>`
  ).join('');

  return `<div class="hdr">
    <span class="hdr-title">ALOE RECON · BILLS</span>
    <span class="hdr-sub" style="margin-top:1px">${fmtDate(results.csvStart)} → ${fmtDate(results.csvEnd)} · ${csvRows.length} charges · ${rvBills.length} RV bills (90d window)</span>
    <div class="hdr-right"><button class="btn-sm" id="backBtn">← New run</button></div>
  </div>
  <div class="body">
    <div class="stats">
      <div class="stat"><div class="stat-n" style="color:var(--green)">${matched.length}</div><div class="stat-l">Matched</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--amber)">${nearMatch.length}</div><div class="stat-l">Partial</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--red)">${unmatched.length}</div><div class="stat-l">Not entered</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--red)">${fmt(unmatchedAmt)}</div><div class="stat-l">$ Missing</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--muted)">${rvOnly.length}</div><div class="stat-l">RV only</div></div>
    </div>

    ${unmatched.length>0?`<div class="alert-banner">
      <div class="al">⚠ Charges not entered in Rentvine</div>
      <div class="aa">${fmt(unmatchedAmt)}</div>
      <div class="as">${unmatched.length} card charge${unmatched.length>1?'s':''} have no matching Reimbursement bill — add to Rentvine to get reimbursed</div>
    </div>`:'<div class="info" style="margin-bottom:12px">✅ All card charges have matching Rentvine bills!</div>'}

    <div class="xl-wrap">
      <div class="xl-toolbar">
        <input class="srch" id="si" placeholder="Search…" value="${esc(search)}"/>
        ${filterBtns}
        <span class="row-ct">${viewRows.length} rows</span>
      </div>
      <div class="xl-scroll">
        <table class="xl-table">
          <thead><tr>
            ${thSort('chase_date','Chase Date')}
            ${thSort('chase_desc','Chase Description')}
            ${thSort('chase_amt','Amount')}
            ${thSort('match','Match')}
            ${thSort('days','Days Apart')}
            ${thSort('rv_date','RV Bill Date')}
            ${thSort('rv_ref','RV Ref / WO')}
            <th>Notes</th>
          </tr></thead>
          <tbody>
            ${tableRows}
            ${rvOnly.length>0?`<tr><td colspan="8" style="padding:4px 10px;background:var(--s2);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:2px solid var(--border2)">Rentvine bills with no matching Chase charge (${rvOnly.length})</td></tr>${rvOnlyRows}`:''}
          </tbody>
        </table>
      </div>
      <div class="legend">
        <div class="leg"><div class="leg-dot" style="background:var(--match-bg);border-color:var(--gborder)"></div>Matched</div>
        <div class="leg"><div class="leg-dot" style="background:var(--near-bg);border-color:var(--near-border)"></div>Partial / verify</div>
        <div class="leg"><div class="leg-dot" style="background:#fff;border-color:var(--border2)"></div>Not in Rentvine — add bill</div>
      </div>
      <div class="xl-footer">
        <span class="xl-footer-left">Click column headers to sort · ±45 day window · Amount + description matching</span>
        <button class="btn-sm" id="exportBtn">⬇ Export missing as CSV</button>
      </div>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// EXPORT
// ─────────────────────────────────────────────────────────────────────────────
function exportMissing(){
  const rows=S.results.rows.filter(r=>!r.rv);
  const lines=[['Transaction Date','Description','Card','Amount','Action']];
  rows.forEach(r=>lines.push([r.chase.date,'"'+r.chase.description.replace(/"/g,'""')+'"','···'+r.chase.card,r.chase.amount.toFixed(2),'Add Reimbursement bill in Rentvine']));
  const csv=lines.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv,'+encodeURIComponent(csv);
  a.download='aloe_bills_not_entered_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// ─────────────────────────────────────────────────────────────────────────────
// BIND
// ─────────────────────────────────────────────────────────────────────────────
function bind(){
  if(S.screen==='config'){
    const drop=document.getElementById('drop'),fi=document.getElementById('fi');
    drop?.addEventListener('click',()=>fi?.click());
    drop?.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
    drop?.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop?.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');hf(e.dataTransfer.files[0]);});
    fi?.addEventListener('change',e=>hf(e.target.files[0]));
    document.getElementById('runBtn')?.addEventListener('click',run);
  }
  if(S.screen==='results'){
    document.getElementById('backBtn')?.addEventListener('click',()=>set({screen:'config',results:null}));
    document.getElementById('si')?.addEventListener('input',e=>set({search:e.target.value}));
    document.getElementById('exportBtn')?.addEventListener('click',exportMissing);
    document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>set({filter:btn.dataset.filter})));
    document.querySelectorAll('[data-col]').forEach(th=>th.addEventListener('click',()=>{
      const col=th.dataset.col;
      set({sortCol:col,sortDir:S.sortCol===col&&S.sortDir==='asc'?'desc':'asc'});
    }));
  }
}
async function hf(file){if(!file)return;const text=await file.text();set({csvFile:file,csvText:text});}

render();
</script>
</body>
</html>
