<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe PM · Bills Recon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F8FAFC;--surface:#fff;--s2:#EFF8FC;--border:#D6EEF5;--border2:#B4C3C3;
    --teal:#3CC3E1;--teal-dk:#4BB4D2;--silver:#B4C3C3;
    --red:#C0392B;--rbg:#FDF0EF;--rborder:#E8A09A;
    --amber:#B7770D;--abg:#FEF7E8;--aborder:#F0C36D;
    --green:#27AE60;--gbg:#EAF7EE;--gborder:#82D8A0;
    --muted:#8AA5AD;--text:#1A2E35;--text2:#4A6570;
    --match-bg:#EAF7EE;--near-bg:#FFFBEB;
  }
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;font-size:13px}
  ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

  .hdr{background:#fff;border-bottom:1px solid var(--border);border-top:3px solid var(--teal);padding:0 20px;height:48px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
  .hdr-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.06em}
  .hdr-sub{font-size:11px;color:var(--muted);margin-left:4px}
  .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn-sm{background:none;border:1px solid var(--border2);border-radius:6px;padding:4px 10px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s}
  .btn-sm:hover{border-color:var(--teal);color:var(--teal)}
  .btn-sm.active-f{border-color:var(--teal);color:var(--teal);background:var(--s2)}

  .body{padding:16px 20px;max-width:1200px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:16px;margin-bottom:12px}
  .card-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .info{background:var(--s2);border:1px solid var(--teal);border-radius:7px;padding:8px 13px;font-size:11px;color:var(--teal-dk);margin-bottom:12px;line-height:1.7}
  .err{background:var(--rbg);border:1px solid var(--rborder);border-radius:7px;padding:8px 13px;font-size:11px;color:var(--red);margin-bottom:12px}

  /* DROP ZONES */
  .drop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:0}
  .drop-wrap label{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .drop{border:1.5px dashed var(--border2);border-radius:8px;padding:16px 12px;text-align:center;cursor:pointer;transition:all .18s;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .drop:hover,.drop.over,.drop.filled{border-color:var(--teal);background:var(--s2)}
  .drop-icon{font-size:18px;margin-bottom:4px}
  .drop-title{font-size:11px;font-weight:500;margin-bottom:2px}
  .drop-sub{font-size:10px;color:var(--muted);line-height:1.4}

  .btn-run{background:var(--teal);border:none;border-radius:7px;padding:11px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;transition:background .15s;margin-top:12px}
  .btn-run:hover{background:var(--teal-dk)}
  .btn-run:disabled{background:var(--s2);color:var(--muted);cursor:not-allowed;border:1px solid var(--border2)}

  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:12px}
  .spinner{width:30px;height:30px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-msg{font-family:'IBM Plex Mono',monospace;color:var(--teal);font-size:11px;font-weight:500}

  /* STATS ROW */
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px 12px}
  .stat-n{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;line-height:1}
  .stat-l{font-size:9px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}

  /* ALERT */
  .alert-banner{border-radius:7px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--rborder);background:var(--rbg);display:flex;align-items:center;gap:14px}
  .alert-banner .aa{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;color:var(--red);flex-shrink:0}
  .alert-banner .al{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
  .alert-banner .as{font-size:11px;color:#7A1F1F}

  /* TABS */
  .view-tabs{display:flex;gap:0;margin-bottom:0;border-bottom:2px solid var(--border)}
  .view-tab{padding:8px 16px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .12s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
  .view-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
  .view-tab:hover:not(.active){color:var(--text)}

  /* EXCEL TABLE */
  .xl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:12px}
  .xl-toolbar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--s2);align-items:center;flex-wrap:wrap}
  .srch{background:#fff;border:1px solid var(--border2);border-radius:5px;padding:4px 9px;color:var(--text);font-size:11px;font-family:'IBM Plex Mono',monospace;width:190px}
  .srch:focus{outline:1.5px solid var(--teal);outline-offset:1px}
  .row-ct{margin-left:auto;font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
  .xl-scroll{overflow:auto;max-height:540px}

  .xl-table{width:100%;border-collapse:collapse;font-size:11px}
  .xl-table th{
    position:sticky;top:0;z-index:10;
    background:#EFF8FC;border-bottom:2px solid var(--teal);border-right:1px solid var(--border);
    padding:6px 10px;text-align:left;
    font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--teal-dk);
    white-space:nowrap;cursor:pointer;user-select:none;
  }
  .xl-table th:hover{background:#D6EEF5}
  .xl-table th.sa::after{content:' ↑'}
  .xl-table th.sd::after{content:' ↓'}
  .xl-table th:last-child{border-right:none}

  .xl-table td{
    padding:5px 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);
    vertical-align:middle;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .xl-table td:last-child{border-right:none}
  .xl-table tr:last-child td{border-bottom:none}
  .xl-table tr.r-match td{background:var(--match-bg)}
  .xl-table tr.r-match:hover td{background:#D4EFD8}
  .xl-table tr.r-near td{background:var(--near-bg)}
  .xl-table tr.r-near:hover td{background:#FEF3C7}
  .xl-table tr.r-none td{background:#fff}
  .xl-table tr.r-none:hover td{background:#F9FAFB}
  .xl-table tr.r-rvonly td{background:#F9FAFB}
  .xl-table tr.r-rvonly:hover td{background:#F0F4F8}

  .mono{font-family:'IBM Plex Mono',monospace}
  .amt{font-family:'IBM Plex Mono',monospace;font-weight:500}
  .amt-red{color:var(--red)}
  .amt-green{color:var(--green)}
  .badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:600;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
  .b-match{background:var(--match-bg);color:var(--green);border:1px solid var(--gborder)}
  .b-near{background:var(--near-bg);color:#92400E;border:1px solid var(--aborder)}
  .b-none{background:#F9FAFB;color:var(--muted);border:1px solid var(--border2)}
  .b-rvonly{background:var(--s2);color:var(--teal-dk);border:1px solid var(--teal)}
  .note{font-size:10px;color:var(--amber);white-space:normal;line-height:1.3;max-width:220px}
  .note.action{color:var(--red);font-weight:600}
  .muted{color:var(--muted)}

  /* SECTION DIVIDER ROW */
  .xl-table tr.section-hdr td{background:var(--s2);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:2px solid var(--border2);padding:5px 10px}

  /* LEGEND */
  .legend{display:flex;gap:14px;padding:6px 12px;border-top:1px solid var(--border);background:var(--s2);flex-wrap:wrap}
  .leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
  .leg-dot{width:12px;height:12px;border-radius:2px;flex-shrink:0;border:1px solid}

  .xl-footer{display:flex;gap:8px;padding:7px 12px;border-top:1px solid var(--border);background:var(--s2);justify-content:space-between;align-items:center}
  .xl-footer-info{font-size:10px;color:var(--muted)}
  .empty-row td{padding:28px;text-align:center;color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let S={
  screen:'config',
  chaseFile:null, chaseText:'',
  rvFile:null, rvText:'',
  error:'',
  results:null,
  view:'matched',    // 'matched'|'rv'|'chase'
  search:'', filter:'all',
  sortCol:'rv_date', sortDir:'desc',
};
function set(p){Object.assign(S,p);render();}

// ─── PARSERS ──────────────────────────────────────────────────────────────────
function pl(line){
  const f=[];let c='',q=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"')q=!q;
    else if(line[i]===','&&!q){f.push(c.trim());c='';}
    else c+=line[i];
  }
  f.push(c.trim());return f;
}
function pd(d){
  if(!d) return '';
  const s=String(d).trim().replace(/^"|"$/g,'').replace(/&amp;/g,'&');
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // MM-DD-YYYY (Rentvine export format)
  let m=s.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if(m) return `${m[3]}-${m[1]}-${m[2]}`;
  // M/D/YYYY or MM/DD/YYYY
  m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  return s;
}
function pamt(s){return Math.abs(parseFloat((s||'').replace(/[$,\s]/g,'')))||0;}

// Parse Chase credit card CSV
function parseChase(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const h=pl(lines[0]);
  const hi=k=>h.findIndex(x=>x.toLowerCase().includes(k.toLowerCase()));
  const iDate=hi('Transaction Date'),iDesc=hi('Description'),iAmt=hi('Amount'),iType=hi('Type'),iCard=hi('Card');
  return lines.slice(1).map(l=>{
    const v=pl(l);
    const type=(v[iType]||'').trim();
    const rawAmt=parseFloat((v[iAmt]||'').replace(/[$,]/g,''))||0;
    if(!rawAmt) return null;
    if(type!=='Sale'&&rawAmt>=0) return null; // skip payments/returns
    const date=pd(v[iDate]);
    const desc=(v[iDesc]||'').replace(/&amp;/g,'&').trim();
    const amount=Math.abs(rawAmt);
    if(!date||!amount) return null;
    return {date,description:desc,amount,card:(v[iCard]||'').trim()};
  }).filter(Boolean);
}

// Parse Rentvine Payables CSV export
// Format: skip header rows until we find "Date Posted" header line
function parseRVPayables(text){
  const lines=text.trim().split(/\r?\n/);
  // Find the data header row
  let headerIdx=-1;
  for(let i=0;i<lines.length;i++){
    if(lines[i].includes('Date Posted')&&lines[i].includes('Charge Amount')){
      headerIdx=i; break;
    }
  }
  if(headerIdx<0) throw new Error('Could not find "Date Posted" header in Rentvine CSV — make sure you exported from Reports → Payables');

  const headers=pl(lines[headerIdx]);
  const hi=k=>headers.findIndex(h=>h.toLowerCase().replace(/"/g,'').trim().includes(k.toLowerCase()));
  const iDate=hi('Date Posted'), iLedger=hi('Ledger'), iUnit=hi('Unit');
  const iAcct=hi('Charge Account'), iAmt=hi('Charge Amount'), iPaid=hi('Amount Paid');
  const iUnpaid=hi('Amount Unpaid'), iDesc=hi('Description'), iPayee=hi('Payee'), iVoided=hi('Voided');

  return lines.slice(headerIdx+1).map(l=>{
    if(!l.trim()) return null;
    const v=pl(l);
    const payee=(v[iPayee]||'').replace(/^"|"$/g,'').trim();
    if(!payee||payee.toLowerCase()==='totals') return null;
    const date=pd(v[iDate]);
    const amount=pamt(v[iAmt]);
    if(!date||!amount) return null;
    return {
      date,
      ledger:(v[iLedger]||'').replace(/^"|"$/g,'').trim(),
      unit:(v[iUnit]||'').replace(/^"|"$/g,'').trim(),
      account:(v[iAcct]||'').replace(/^"|"$/g,'').trim(),
      amount,
      amountPaid:pamt(v[iPaid]),
      amountUnpaid:pamt(v[iUnpaid]),
      description:(v[iDesc]||'').replace(/^"|"$/g,'').trim(),
      payee,
      voided:(v[iVoided]||'').toLowerCase()==='yes',
    };
  }).filter(Boolean).filter(r=>!r.voided);
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function shiftDate(d,days){
  try{const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()+days);return dt.toISOString().slice(0,10);}
  catch(e){return d;}
}
function daysDiff(a,b){
  try{return Math.abs((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000);}
  catch(e){return 999;}
}
function descSim(a,b){
  const tok=s=>(s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
  const ta=new Set(tok(a)),tb=new Set(tok(b));
  const inter=[...ta].filter(w=>tb.has(w));
  const union=new Set([...ta,...tb]);
  return union.size>0?inter.length/union.size:0;
}
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
function fmtDate(d){
  if(!d) return '';
  try{const dt=new Date(d+'T12:00:00');return (dt.getMonth()+1)+'/'+dt.getDate()+'/'+dt.getFullYear();}
  catch(e){return d;}
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─── MATCHING ─────────────────────────────────────────────────────────────────
// RV bill is the source of truth — we try to find a Chase charge for each RV bill
// Match: amount within $0.02 AND date within 45 days, OR description similarity
function matchBills(chaseRows,rvBills){
  const pool=chaseRows.map(c=>({...c,matched:false}));
  const rows=rvBills.map(rv=>({rv,chase:null,matchType:null,dateDiff:null,descScore:null}));

  rows.forEach(row=>{
    const rv=row.rv;

    // Pass 1: Exact amount (±$0.02) + date within 45 days
    let best=null,bestDiff=999;
    pool.forEach(c=>{
      if(c.matched) return;
      if(Math.abs(c.amount-rv.amount)>0.02) return;
      const dd=daysDiff(c.date,rv.date);
      if(dd<=45&&dd<bestDiff){bestDiff=dd;best=c;}
    });
    if(best){row.chase=best;row.matchType='exact';row.dateDiff=bestDiff;best.matched=true;return;}

    // Pass 2: Description similarity + date within 45 days (amount can differ slightly)
    let bestScore=0.3,bestC=null,bestDD=999;
    pool.forEach(c=>{
      if(c.matched) return;
      const dd=daysDiff(c.date,rv.date);
      if(dd>45) return;
      const score=Math.max(
        descSim(c.description,rv.description),
        descSim(c.description,rv.account),
        descSim(c.description,rv.ledger)
      );
      if(score>bestScore||(score===bestScore&&dd<bestDD)){bestScore=score;bestC=c;bestDD=dd;}
    });
    if(bestC){row.chase=bestC;row.matchType='desc';row.dateDiff=bestDD;row.descScore=Math.round(bestScore*100);bestC.matched=true;}
  });

  const chaseUnmatched=pool.filter(c=>!c.matched);
  return {rows,chaseUnmatched};
}

// ─── RUN ──────────────────────────────────────────────────────────────────────
async function run(){
  if(!S.chaseText){set({error:'Upload your Chase card CSV.'});return;}
  if(!S.rvText){set({error:'Upload your Rentvine Payables CSV export.'});return;}
  set({error:'',screen:'loading'});

  try{
    // Parse Chase — filter to 90-day window from latest date
    const allChase=parseChase(S.chaseText);
    if(!allChase.length) throw new Error('Could not parse Chase CSV — needs: Transaction Date, Description, Amount, Type');
    const chaseDates=allChase.map(r=>r.date).filter(Boolean).sort();
    const chaseEnd=chaseDates[chaseDates.length-1];
    const cutoff=shiftDate(chaseEnd,-90);
    const chaseRows=allChase.filter(r=>r.date>=cutoff);

    // Parse RV Payables
    const rvBills=parseRVPayables(S.rvText);
    if(!rvBills.length) throw new Error('Could not parse Rentvine CSV — export from Reports → Payables → Download CSV');

    const rvStart=rvBills.map(r=>r.date).sort()[0];
    const rvEnd=rvBills.map(r=>r.date).sort().reverse()[0];

    const {rows,chaseUnmatched}=matchBills(chaseRows,rvBills);

    set({
      results:{chaseRows,rvBills,rows,chaseUnmatched,chaseEnd,cutoff,rvStart,rvEnd},
      screen:'results',view:'rv',search:'',filter:'all',sortCol:'rv_date',sortDir:'desc',
    });
  }catch(e){set({error:e.message,screen:'config'});}
}

// ─── FILTERED + SORTED ROWS ───────────────────────────────────────────────────
function getViewRows(){
  if(!S.results) return [];
  const {rows,chaseUnmatched}=S.results;
  const q=S.search.toLowerCase();
  const {sortCol,sortDir,filter,view}=S;

  let viewRows=[];

  if(view==='rv'||view==='matched'){
    // RV-centric view — one row per RV bill
    let r=[...rows];
    if(filter==='matched') r=r.filter(x=>x.chase&&x.matchType==='exact');
    else if(filter==='partial') r=r.filter(x=>x.chase&&x.matchType==='desc');
    else if(filter==='unmatched') r=r.filter(x=>!x.chase);
    else if(filter==='unpaid') r=r.filter(x=>x.rv.amountUnpaid>0);

    if(q) r=r.filter(x=>JSON.stringify(x).toLowerCase().includes(q));

    // Sort
    r.sort((a,b)=>{
      let va,vb;
      if(sortCol==='rv_date'){va=a.rv.date;vb=b.rv.date;}
      else if(sortCol==='rv_amt'){va=a.rv.amount;vb=b.rv.amount;}
      else if(sortCol==='rv_ledger'){va=a.rv.ledger;vb=b.rv.ledger;}
      else if(sortCol==='rv_acct'){va=a.rv.account;vb=b.rv.account;}
      else if(sortCol==='match'){va=a.matchType||'z';vb=b.matchType||'z';}
      else if(sortCol==='chase_date'){va=a.chase?.date||'';vb=b.chase?.date||'';}
      else if(sortCol==='chase_amt'){va=a.chase?.amount||0;vb=b.chase?.amount||0;}
      else{va='';vb='';}
      if(typeof va==='number') return sortDir==='asc'?va-vb:vb-va;
      return sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    });
    viewRows=r;
  } else {
    // Chase-only view — unmatched Chase charges
    let r=[...chaseUnmatched];
    if(q) r=r.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
    r.sort((a,b)=>sortDir==='asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));
    return r; // different shape
  }
  return viewRows;
}

function thSort(col,label){
  const{sortCol,sortDir}=S;
  const cls=sortCol===col?(sortDir==='asc'?' sa':' sd'):'';
  return `<th class="${cls}" data-col="${col}">${label}</th>`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML=
    S.screen==='loading'?rLoad():
    S.screen==='results'?rResults():
    rConfig();
  bind();
}

function rLoad(){
  return `<div class="hdr"><span class="hdr-title">ALOE RECON · BILLS</span></div>
  <div class="loading-wrap"><div class="spinner"></div><div class="load-msg">Parsing and matching…</div></div>`;
}

function rConfig(){
  const{chaseFile,rvFile,error}=S;
  return `<div class="hdr">
    <span class="hdr-title">ALOE RECON · BILLS</span>
    <span class="hdr-sub">Chase card ↔ Rentvine Payables · Aloe PM Reimbursements</span>
  </div>
  <div class="body">
    ${error?`<div class="err">⚠ ${error}</div>`:''}
    <div class="info">
      <strong>Two CSV uploads required:</strong><br>
      💳 <strong>Chase CSV</strong> — Chase → Account Activity → Download → CSV<br>
      📋 <strong>Rentvine Payables CSV</strong> — Reports → Payables → filter Payee = Aloe PM Reimbursements → Export → CSV<br><br>
      The tool shows <strong>all Rentvine bills</strong> so you can verify everything is there, then matches each against a Chase charge by amount (±$0.02) within 45 days, with description similarity as fallback.
    </div>
    <div class="card">
      <div class="card-title">Upload both files</div>
      <div class="drop-grid">
        <div class="drop-wrap">
          <label>💳 Chase card CSV</label>
          <div class="drop ${chaseFile?'filled':''}" id="drop-chase">
            <input type="file" id="fi-chase" accept=".csv" style="display:none"/>
            ${chaseFile
              ?`<div class="drop-title" style="color:var(--teal)">✓ ${esc(chaseFile.name)}</div><div class="drop-sub">Click to replace</div>`
              :`<div class="drop-icon">💳</div><div class="drop-title">Drop Chase CSV here</div><div class="drop-sub">Needs: Transaction Date, Description, Amount, Type</div>`}
          </div>
        </div>
        <div class="drop-wrap">
          <label>📋 Rentvine Payables CSV</label>
          <div class="drop ${rvFile?'filled':''}" id="drop-rv">
            <input type="file" id="fi-rv" accept=".csv" style="display:none"/>
            ${rvFile
              ?`<div class="drop-title" style="color:var(--teal)">✓ ${esc(rvFile.name)}</div><div class="drop-sub">Click to replace</div>`
              :`<div class="drop-icon">📋</div><div class="drop-title">Drop Rentvine Payables CSV here</div><div class="drop-sub">Reports → Payables → Payee = Aloe PM Reimbursements → Export</div>`}
          </div>
        </div>
      </div>
      <button class="btn-run" id="runBtn" ${!chaseFile||!rvFile?'disabled':''}>Match bills →</button>
    </div>
  </div>`;
}

function rResults(){
  const{results,search,filter,view,chaseFile,rvFile}=S;
  const{chaseRows,rvBills,rows,chaseUnmatched,rvStart,rvEnd,cutoff,chaseEnd}=results;

  const rvMatched=rows.filter(r=>r.chase&&r.matchType==='exact');
  const rvPartial=rows.filter(r=>r.chase&&r.matchType==='desc');
  const rvUnmatched=rows.filter(r=>!r.chase);
  const rvUnpaid=rvBills.filter(r=>r.amountUnpaid>0);
  const totalRV=rvBills.reduce((s,r)=>s+r.amount,0);
  const unmatchedAmt=rvUnmatched.reduce((s,r)=>s+r.amount,0);

  const viewRows=getViewRows();
  const isChaseView=view==='chase';

  // Build table rows
  let tableHtml='';
  if(isChaseView){
    // Chase unmatched view
    if(!viewRows.length){
      tableHtml=`<tr class="empty-row"><td colspan="5">🎉 All Chase charges have a matching Rentvine bill!</td></tr>`;
    } else {
      tableHtml=viewRows.map(c=>`<tr class="r-none">
        <td><span class="mono">${fmtDate(c.date)}</span></td>
        <td title="${esc(c.description)}">${esc(c.description)}</td>
        <td>···${esc(c.card)}</td>
        <td><span class="amt amt-red">−${fmt(c.amount)}</span></td>
        <td><span class="note action">Add bill to Rentvine</span></td>
      </tr>`).join('');
    }
  } else {
    // RV-centric view
    if(!viewRows.length){
      tableHtml=`<tr class="empty-row"><td colspan="9">No rows match the current filter.</td></tr>`;
    } else {
      tableHtml=viewRows.map(row=>{
        const{rv,chase,matchType,dateDiff,descScore}=row;
        const rowCls=matchType==='exact'?'r-match':matchType==='desc'?'r-near':'r-none';

        let badge='',matchInfo='';
        if(matchType==='exact'){
          badge=`<span class="badge b-match">✓ Amount match</span>`;
          matchInfo=dateDiff===0?'same day':`${dateDiff}d apart`;
        } else if(matchType==='desc'){
          badge=`<span class="badge b-near">~ Desc match${descScore?` ${descScore}%`:''}</span>`;
          matchInfo=dateDiff===0?'same day':`${dateDiff}d apart`;
        } else {
          badge=`<span class="badge b-none">— No match</span>`;
        }

        const paidBadge=rv.amountUnpaid>0
          ?`<span class="badge" style="background:var(--abg);color:var(--amber);border:1px solid var(--aborder);margin-left:4px">Unpaid ${fmt(rv.amountUnpaid)}</span>`:'';

        const chaseDesc=chase?`<span title="${esc(chase.description)}">${esc(chase.description)}</span>`:
          `<span class="muted">—</span>`;
        const chaseDate=chase?`<span class="mono">${fmtDate(chase.date)}</span>`:`<span class="muted">—</span>`;
        const chaseAmt=chase?`<span class="amt amt-red">−${fmt(chase.amount)}</span>`:`<span class="muted">—</span>`;

        const noteCell=!chase?`<span class="note action">No Chase charge found — verify or add bill</span>`
          :matchType==='desc'?`<span class="note">Verify — matched by description similarity</span>`:'';

        return `<tr class="${rowCls}">
          <td><span class="mono">${fmtDate(rv.date)}</span></td>
          <td title="${esc(rv.ledger)}">${esc(rv.ledger)}</td>
          <td title="${esc(rv.account)}">${esc(rv.account.replace(/^\d+:\s*/,''))}</td>
          <td title="${esc(rv.description)}">${esc(rv.description||'—')}</td>
          <td><span class="amt">${fmt(rv.amount)}</span>${paidBadge}</td>
          <td>${badge}<br><span class="muted" style="font-size:9px">${matchInfo}</span></td>
          <td>${chaseDate}</td>
          <td>${chaseAmt}</td>
          <td>${noteCell||chaseDesc}</td>
        </tr>`;
      }).join('');
    }
  }

  const filterBtns=[
    ['all','All RV bills'],['matched','✓ Matched'],['partial','~ Partial'],
    ['unmatched','— No match'],['unpaid','Unpaid only'],
  ].map(([v,l])=>
    `<button class="btn-sm ${filter===v?'active-f':''}" data-filter="${v}">${l}</button>`
  ).join('');

  return `<div class="hdr">
    <span class="hdr-title">ALOE RECON · BILLS</span>
    <span class="hdr-sub">RV: ${fmtDate(rvStart)} → ${fmtDate(rvEnd)} (${rvBills.length} bills) · Chase: ${fmtDate(cutoff)} → ${fmtDate(chaseEnd)} (${chaseRows.length} charges)</span>
    <div class="hdr-right"><button class="btn-sm" id="backBtn">← New run</button></div>
  </div>
  <div class="body">
    <div class="stats">
      <div class="stat"><div class="stat-n">${rvBills.length}</div><div class="stat-l">RV bills total</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--green)">${rvMatched.length}</div><div class="stat-l">Matched</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--amber)">${rvPartial.length}</div><div class="stat-l">Partial</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--red)">${rvUnmatched.length}</div><div class="stat-l">No Chase match</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--amber)">${rvUnpaid.length}</div><div class="stat-l">Unpaid bills</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--red)">${chaseUnmatched.length}</div><div class="stat-l">Chase not in RV</div></div>
    </div>

    ${chaseUnmatched.length>0?`<div class="alert-banner">
      <div>
        <div class="al">⚠ Chase charges not entered in Rentvine</div>
        <div class="aa">${chaseUnmatched.length} charge${chaseUnmatched.length>1?'s':''}</div>
        <div class="as">These card charges have no matching RV bill — click "Chase not in RV" tab to see them and add to Rentvine</div>
      </div>
    </div>`:''}

    <div class="xl-wrap">
      <div style="border-bottom:2px solid var(--border);display:flex;background:var(--s2)">
        <button class="view-tab ${view==='rv'?'active':''}" id="tab-rv">📋 All Rentvine Bills (${rvBills.length})</button>
        <button class="view-tab ${view==='chase'?'active':''}" id="tab-chase" style="color:${chaseUnmatched.length?'var(--red)':'var(--muted)'}">💳 Chase not in RV (${chaseUnmatched.length})</button>
      </div>

      ${!isChaseView?`<div class="xl-toolbar">${filterBtns}
        <input class="srch" id="si" placeholder="Search…" value="${esc(search)}"/>
        <span class="row-ct">${viewRows.length} rows · ${fmt(totalRV)} total</span>
      </div>`:`<div class="xl-toolbar">
        <input class="srch" id="si" placeholder="Search…" value="${esc(search)}"/>
        <span class="row-ct">${viewRows.length} rows</span>
      </div>`}

      <div class="xl-scroll">
        <table class="xl-table">
          ${isChaseView?`<thead><tr>
            ${thSort('rv_date','Date')}
            <th>Chase Description</th>
            <th>Card</th>
            ${thSort('chase_amt','Amount')}
            <th>Action</th>
          </tr></thead>`:`<thead><tr>
            ${thSort('rv_date','RV Date')}
            ${thSort('rv_ledger','Owner / Ledger')}
            ${thSort('rv_acct','Account')}
            <th>RV Description</th>
            ${thSort('rv_amt','RV Amount')}
            ${thSort('match','Match')}
            ${thSort('chase_date','Chase Date')}
            ${thSort('chase_amt','Chase Amt')}
            <th>Chase Description / Notes</th>
          </tr></thead>`}
          <tbody>${tableHtml}</tbody>
        </table>
      </div>

      <div class="legend">
        <div class="leg"><div class="leg-dot" style="background:var(--match-bg);border-color:var(--gborder)"></div>Matched — amount within $0.02, within 45 days</div>
        <div class="leg"><div class="leg-dot" style="background:var(--near-bg);border-color:var(--aborder)"></div>Partial — description similarity match, verify manually</div>
        <div class="leg"><div class="leg-dot" style="background:#fff;border-color:var(--border2)"></div>No match — verify or find charge on a different statement</div>
      </div>
      <div class="xl-footer">
        <span class="xl-footer-info">Click column headers to sort · RV = Rentvine Payables · Match window: ±45 days, amount ±$0.02</span>
        <button class="btn-sm" id="exportBtn">⬇ Export unmatched</button>
      </div>
    </div>
  </div>`;
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function exportUnmatched(){
  const{rows,chaseUnmatched}=S.results;
  const rvUnmatched=rows.filter(r=>!r.chase);
  const lines=[['Type','Date','Ledger/Description','Account','Amount','Action']];
  rvUnmatched.forEach(r=>lines.push(['RV no Chase',r.rv.date,r.rv.ledger||r.rv.description,r.rv.account,r.rv.amount.toFixed(2),'Find Chase charge or verify payment method']));
  chaseUnmatched.forEach(c=>lines.push(['Chase not in RV',c.date,'"'+c.description.replace(/"/g,'""')+'"','',c.amount.toFixed(2),'Add Reimbursement bill to Rentvine']));
  const csv=lines.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv,'+encodeURIComponent(csv);
  a.download='aloe_bills_unmatched_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// ─── BIND ─────────────────────────────────────────────────────────────────────
function bind(){
  if(S.screen==='config'){
    bindDrop('drop-chase','fi-chase',(f,t)=>set({chaseFile:f,chaseText:t}));
    bindDrop('drop-rv','fi-rv',(f,t)=>set({rvFile:f,rvText:t}));
    document.getElementById('runBtn')?.addEventListener('click',run);
  }
  if(S.screen==='results'){
    document.getElementById('backBtn')?.addEventListener('click',()=>set({screen:'config',results:null}));
    document.getElementById('si')?.addEventListener('input',e=>set({search:e.target.value}));
    document.getElementById('exportBtn')?.addEventListener('click',exportUnmatched);
    document.getElementById('tab-rv')?.addEventListener('click',()=>set({view:'rv',search:'',filter:'all'}));
    document.getElementById('tab-chase')?.addEventListener('click',()=>set({view:'chase',search:''}));
    document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>set({filter:btn.dataset.filter})));
    document.querySelectorAll('[data-col]').forEach(th=>th.addEventListener('click',()=>{
      const col=th.dataset.col;
      set({sortCol:col,sortDir:S.sortCol===col&&S.sortDir==='asc'?'desc':'asc'});
    }));
  }
}

function bindDrop(dropId,inputId,cb){
  const drop=document.getElementById(dropId),fi=document.getElementById(inputId);
  if(!drop||!fi) return;
  drop.addEventListener('click',()=>fi.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');hf(e.dataTransfer.files[0],cb);});
  fi.addEventListener('change',e=>hf(e.target.files[0],cb));
}
async function hf(file,cb){if(!file)return;const text=await file.text();cb(file,text);}

render();
</script>
